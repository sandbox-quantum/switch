properties:
  - id: membership.removal-reaches-every-replica
    title: A removed member stops getting the room everywhere
    statement: >
      A member removed from a room stops receiving it on every process within a
      bound (the signal re-check), even when the membership signal was missed.
    kind: safety
    formality: semi-formal
    levels: [model, system]
    owner: platform
    status: proposed
    notes: >
      `transport/membership_signals.py`; the bound is `RECHECK_SECONDS` in
      `signals.py`.
