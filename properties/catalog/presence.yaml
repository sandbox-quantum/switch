properties:
  - id: presence.online-iff-lease
    title: A connection reads online only while its process holds
    statement: >
      A connection reads as online only while the process holding it holds its
      process lease, so a crashed process's connections read as lost within the
      lease's lifetime.
    kind: safety
    formality: semi-formal
    levels: [code, system]
    owner: platform
    status: proposed
    notes: >
      Checked at the system level by `src/fast/replica-connections.ts` in the
      end-to-end harness, on the two-replica lane: an agent's socket claims a
      room and its holder is killed, and the survivor must read the agent
      offline within `LEASE_TTL` and one lease watch, then live once it
      reconnects through the survivor; a controller's socket taken over while
      its holder was paused reads online, held by the survivor.
      `process_lease.py`, with `bridges/agent/protocol/connection_rows.py` for
      agents' own connections and `management/connection_ledger.py` with
      `placement.controller_state` for controllers'. Checked at the code level
      by `lease_presence_machine.py`. Two processes share Postgres, each with
      its own registry, presence, ledger, lease and signal bus. An agent's
      connection and a controller's are opened and closed through either,
      while the leases are renewed, lapse (their last renewal moved back past
      `LEASE_TTL`, so nothing sleeps) and are stopped. A read of the database
      (the rows' `held`, the controller's state) must say online exactly while
      the connection is open and its holder holds its lease. The other
      process's copy may lag only until it has caught up with what changed: a
      connection opened or closed, once it hears the signal; a lease that
      lapsed or was stopped, once it checks the leases (`WATCH_SECONDS`);
      anything, once it reads every connection again. "Within the lease's
      lifetime" is that bound: `LEASE_TTL` after the last renewal, plus one
      lease watch. The holder's own view is not judged, since a socket it
      holds is live to it whatever its lease says. A holder whose lease
      lapsed and is then renewed reads offline elsewhere until the next
      re-check (`RECHECK_SECONDS`), since the lease watch only drops copies. A
      lapse is a process that stopped renewing for a whole `LEASE_TTL`, so
      that is a delay after an outage, not a wrong answer. The re-check skips
      a tenant whose rows and live processes are unchanged, so for a
      controller it reads the tenant again only because the controllers held
      elsewhere there are not what its last full read left.
