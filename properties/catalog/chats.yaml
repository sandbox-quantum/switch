properties:
  - id: chats.membership-is-read-authority
    title: A person reads a chat only while a member
    statement: >
      A person reads a room only while they have a `client_rooms` row for it and
      a role in its workspace.
    kind: safety
    formality: semi-formal
    levels: [code, system]
    owner: platform
    status: proposed
    gaps:
      system: no lane reads chats through the routes as people come and go
    notes: >
      `chats/service.py`. The code-level machine (`chats_machine.py`) checks
      `require_member` on every read step and `reads_room` for every person and
      chat after every step, against workspace role, membership and whether
      the chat is archived. `readable_rooms` does not check the workspace role
      itself; its callers do first.
  - id: chats.owned-sync-reversible
    title: Owned-room sync takes back only what it gave
    statement: >
      `sync_owned_rooms` takes back exactly the memberships it granted for agent
      ownership, and never one a manager granted directly or the person gained by
      being invited or creating the chat.
    kind: safety
    formality: semi-formal
    levels: [code]
    owner: platform
    status: checked
    notes: >
      The machine keeps why each membership exists (lasting, or held for
      owning an agent) through chats created, left, invited to and removed
      from, agents added, removed and handed over, chats archived and
      restored, and people leaving the workspace and coming back. After every
      step, the membership rows and the `ChatOwnerGrant` marks must match it.
      A creator who left their chat still manages it (adds agents, invites),
      because managing follows the room's owner, not its membership.
      `sync_owned_rooms` does nothing for someone outside the workspace, and
      rejoining does not sync. That leaves no stale membership only because
      the removal route refuses anyone who still owns an agent: they hand
      their agents on first, while still a member, and that syncs them. The
      machine removes only people who own no agent, for the same reason.
  - id: chats.streams-close-on-sign-out
    title: Signing out closes a person's streams
    statement: >
      Once a person's sessions end, their open chat streams and change sockets
      close.
    kind: safety
    formality: semi-formal
    levels: [system, ui]
    owner: platform
    status: proposed
