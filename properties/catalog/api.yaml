properties:
  - id: api.no-5xx
    title: No input makes the server fail
    statement: No request, however malformed, is answered with a 5xx.
    kind: safety
    formality: semi-formal
    levels: [code, system]
    owner: platform
    status: checked
    notes: >
      The gateway is fuzzed from its OpenAPI schema every night
      (`properties/http`). The routes known to answer 500 or 503 are listed in
      `properties/http/baseline.json`; a route not in it fails the run. A NUL
      in a string is not generated, because it makes many routes answer 500.
