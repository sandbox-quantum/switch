properties:
  - id: replica.single-owner
    title: Run-once work runs on one process at a time
    statement: >
      Work that must run once (a client's consumer, a bridge's platform
      connection) runs on at most one switch-core process at a time, and a
      process that cannot confirm its own lease stops it.
    kind: safety
    formality: semi-formal
    levels: [system]
    owner: platform
    status: proposed
    notes: >
      Checked at the system level by `src/fast/replica-faults.ts` in the
      end-to-end harness, on the two-replica lane, for the Mattermost bridge
      with its holder killed, stopped and paused: after each fault,
      `ownership_leases` names one live holder, and every message relayed
      across the hand-over is posted once. Not yet for client consumers, and
      there is no assertion where owned work starts.
      The end-to-end statement of `lease.no-overlap`, which holds it at the model
      and code levels for one key: this one is about the work itself, in real
      processes that are killed and partitioned (`ownership.py`, `surely_held`).
  - id: replica.ownership-eventual
    title: Work whose owner died is picked up
    statement: >
      Work whose owning process died, or stopped renewing its lease, is held
      and running on a live process once the lease has expired.
    kind: liveness
    formality: semi-formal
    levels: [model, system]
    owner: platform
    status: proposed
    notes: >
      At the system level, `src/fast/replica-faults.ts` checks that the
      survivor holds a crashed or paused holder's Mattermost bridge within the
      lease's lifetime and one balance, read from the product's timers, and a
      stopped one's within a balance. Not yet for client consumers.
      Supersedes `lease.eventual-owner`. Checked at the model level by
      `properties/specs/ownership_eventual.qnt`, an untimed abstraction of the
      lease: a bounded clock cannot carry a liveness property. A process
      lease is read by the process (sure of it until its own deadline) and by
      the database (holding it until it lapses), in that order, which
      `ownership.qnt` checks against drifting clocks. Placement is in: only
      the process the key is placed on claims it, and a holder it is not
      placed on hands it off. Lapsing, the balance's claim and hand-off, the
      suspension of work whose lease is not sure, the release of the rows a
      suspension kept once the lease holds again, and a live process's renewal
      are events under weak fairness; dying,
      shutting down and losing the lease while alive are faults, bounded so
      that one process outlives them. TLC checks the temporal property itself
      (`Fair implies eventually(always(settled))`: from some point on exactly
      one live process, the one the key is placed on, sure of its lease and
      named by the key's row, runs the key) over every run, with three processes and two faults, and four
      and three nightly. It fails on a claim that never takes a lapsed
      holder's key, a claim that takes a live holder's, work that is not
      suspended when its lease is no longer sure, a dead process's lease
      kept renewed, placement over lapsed processes too, each process placing
      the key among the others, a holder that never hands off, and a process
      back from suspending that keeps its rows. That last was the code's
      behaviour until the model found it: a key placed elsewhere stayed held by
      a row nothing ran until the holder restarted. It says nothing about how long the pickup takes, which is
      the lease's lifetime and one balance.
