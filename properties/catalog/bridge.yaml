properties:
  - id: bridge.roundtrip-exactly-once
    title: A bridged message crosses once in each direction
    statement: >
      A post from a collaboration platform appears in its room once, and an
      agent's reply appears on the platform once.
    kind: safety
    formality: semi-formal
    levels: [code, system]
    owner: platform
    status: proposed
    notes: >
      `bridges/collaboration/collaboration_core.py` (`_post_source` for posts
      coming in, `_claim_outbound` for messages going out) and
      `clients/workspace_consumer.py` (trying a failed post again). Checked at
      the code level by `bridge_machine.py`: one bridge on two processes
      sharing Postgres, one holding it and one running a quiet copy, as `main`
      runs them. People post on the platform, and the platform delivers a post
      again, to the holder or as a webhook reaching the quiet copy. Messages
      written in Switch are posted out; the platform refuses some, or takes
      one and then fails. The bridge is handed over as a deploy replaces the
      process holding it. Each post must be in the room once, each message
      written in Switch on the platform once (a refused one after it is tried
      again, by the holder or the next), and nothing the platform said posted
      back to it. A message the platform took and then failed on is expected
      twice, since the bridge cannot tell it went out. An agent's retried
      `post_message` is outside this property: it takes no idempotency key.
      At the system level, on the two-replica lane: the bridge's holder is
      crashed, stopped, paused or taken out of rotation
      (`src/fast/replica-faults.ts`), or its wake-up listener cut
      (`src/fast/replica-bus-faults.ts`), and each agent post must reach the
      channel once, and a person's post the agent once.
  - id: bridge.split-preserves-content
    title: A message split to fit a platform keeps what it said
    statement: >
      A message longer than a platform's limit is posted as parts that each
      fit the limit, say what the message said in order, and leave no code
      block open that the message closed.
    kind: safety
    formality: semi-formal
    levels: [code]
    owner: platform
    status: proposed
    notes: >
      `bridges/collaboration/chunking.py` (`split_markdown`). Checked by
      `test_bridge_formats.py` on generated Markdown (prose, words longer than
      the limit, fenced blocks closed and left open, lines that start with
      backticks and are not fences): every part fits, the text without
      whitespace and fence lines is the original's, and a fence a split
      cuts is closed at the end of one part and reopened in the next. A split
      with no fence and no over-long line is the original cut between lines.
  - id: bridge.slack-markup-roundtrip
    title: A message sent to Slack reads as written
    statement: >
      A message sent to Slack shows what it said: the people it names are
      Slack mentions, its links are Slack links to the same address, and any
      Slack syntax it spells out shows as text rather than mentioning,
      linking or broadcasting.
    kind: safety
    formality: semi-formal
    levels: [code]
    owner: platform
    status: proposed
    notes: >
      `bridges/collaboration/slack/adapter.py` (`translate_outbound`,
      `translate_inbound`). Checked by `test_bridge_formats.py`: a body of
      text, mentions of known people (some ending a sentence), Markdown links
      (some with parentheses in the address) and spelled-out Slack syntax
      (`<@U…>`, `<!here>`, `<url|label>`, `<`, `&`) goes out and is read back
      the way Slack shows it, and must read as written. Only the translation
      may write Slack markup, and no `&` goes out unescaped. An entity a body
      spells out (`&amp;`) is left out: it shows decoded on Slack, a known
      issue.
