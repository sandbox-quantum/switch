properties:
  - id: delivery.decided-at-write
    title: Who a row is for is decided when it is written
    statement: >
      Which agents a room row is for is decided by the room's state when the
      row is written. A later membership or addressing change never adds an
      own event for an earlier row; an event is removed only by retention, or
      when its agent leaves the room.
    kind: safety
    formality: formal
    spec: delivery.qnt::DecidedAtWrite
    levels: [model, code, system]
    owner: platform
    status: proposed
    gaps:
      system: the history checker is a later step of the first slice
  - id: delivery.own-seq-contiguous
    title: An agent's own-event numbers never repeat and never skip
    statement: >
      An agent's own-event `seq` is contiguous and never reused, across
      retention and server restarts.
    kind: safety
    formality: formal
    spec: delivery.qnt::OwnSeqContiguous
    levels: [model, code, system]
    owner: platform
    status: checked
    supports: [delivery.no-silent-loss]
    notes: >
      Numbers come from `agent_event_heads`, not the highest stored row,
      because retention deletes old rows.
  - id: delivery.addressed-exactly-once
    title: An addressed message reaches its agent exactly once
    statement: >
      A message addressed to an agent in a room it belongs to produces
      exactly one own event stored for that agent.
    kind: safety
    formality: formal
    spec: delivery.qnt::AddressedExactlyOnce
    levels: [model, code, system]
    owner: platform
    status: checked
    notes: >
      The stored half. That the agent then receives the event once, through its
      stream and its session, is a separate property:
      `session.addressed-reaches-controller` for an agent behind a controller.
  - id: delivery.no-silent-loss
    title: A resuming agent misses nothing without being told
    statement: >
      A client that resumes an agent's event stream from position p receives
      every one of the agent's own events after p, in order, or the stream
      opens with a gap that names each room events were lost from.
    kind: safety
    formality: formal
    spec: delivery.qnt::NoSilentLoss
    levels: [model, code, system]
    owner: platform
    status: checked
    notes: >
      Retention deletes old rows (`agent_event_drops`) and a restarted server
      numbers from a new boot (`agent_event_heads.first_seq`); both must
      surface as a gap, never as silence.
  - id: delivery.addressing-matches-reference
    title: A row is addressed to exactly the agents the rules say
    statement: >
      For any message and room state, the agents the router decides a row is
      for are exactly those a reference model of the addressing rules says it
      is for: mentions, aliases, roles, groups, who may address whom, and
      direct chats.
    kind: safety
    formality: semi-formal
    levels: [code]
    owner: platform
    status: proposed
    gaps:
      code: no reference model of `addresses()` yet
    notes: >
      Replaces `delivery.unaddressed-silent`, which was false as stated: an
      agent alone in a direct chat, an alias and a role all address without a
      mention. Every other delivery property assumes this one. The inputs that
      find bugs are free text: punctuation, code spans, case, one name inside
      another.
  - id: delivery.no-events-after-leave
    title: A member who has left has no events in the room
    statement: >
      An agent that is not in a room has no own events from it: removing it
      deletes the ones it had, including one a transaction was storing as it
      was removed, and none is stored for a row written after.
    kind: safety
    formality: formal
    spec: delivery.qnt::NoEventsAfterLeave
    levels: [model, code, system]
    owner: platform
    status: checked
    notes: >
      `EventBuffer.forget_room` locks the agent's head row before deleting, and
      `store` reads membership after taking that lock.
