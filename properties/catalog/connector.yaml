properties:
  - id: connector.token-only-to-granted
    title: A service token goes only where it was granted
    statement: >
      The broker issues a service token only to an agent whose owner connected
      that account and granted it to the agent, and nothing else decrypts the
      secret.
    kind: safety
    formality: semi-formal
    levels: [code, system]
    owner: platform
    status: proposed
    gaps:
      system: no lane asks for service tokens through the agent routes
    notes: >
      Security-critical (`connections/broker.py`). The code-level machine
      holds a reference model of who may hold what, and checks every issue
      against it and, after each upkeep pass, that every token whose grant,
      owner's membership, sign-in or controller is gone was revoked. A lapsed
      sign-in stops new tokens but leaves issued ones live until they expire
      (an hour at most), and the machine allows that. Agent ownership transfer
      is not modelled, because a transfer is refused while the agent holds a
      grant. Outside the broker, key rotation re-encrypts the secrets in place
      and the one-off GitHub move reads the account id from the old rows; the
      static half of the check names both and fails on any other code that
      decrypts a connection's secret or an issued token.
  - id: connector.refresh-single-flight
    title: Concurrent requests refresh a token once
    statement: >
      Concurrent requests whose token is about to expire cause one refresh under
      the connection's lock, never two that invalidate each other's refresh
      token.
    kind: safety
    formality: semi-formal
    levels: [code]
    owner: platform
    status: checked
    notes: >
      The machine runs three brokers on one database, as three processes,
      against a vendor that rotates refresh tokens and refuses a spent one.
      Bursts of callers arrive while the token is fresh, about to expire or
      expired; some callers give up part way, refreshes fail now and then, and
      the owner signs in again during a burst. One process's callers sharing
      one fetch saves database connections rather than refreshes (the lock
      would keep them apart without it), so removing that is not a failure
      here.
