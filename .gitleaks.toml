# Gitleaks configuration: default ruleset plus allowlisted known false
# positives. Picked up automatically by `gitleaks detect` (CI, pre-commit,
# and the public-tree scrub gate).

[extend]
useDefault = true

# Incoming-webhook URLs are bearer credentials: the URL *is* the secret, so
# whoever holds it can post as the integration. The default ruleset keys off
# `name = value` assignments near a vendor word and so misses URL-shaped
# credentials — which is how a Discord webhook reached main (CHOO-2040).
#
# Slack is left to the default `slack-webhook-url` rule, which already covers
# it. The rules below fill the gaps that one leaves.

[[rules]]
id = "discord-webhook-url"
description = "Discord incoming webhook URL (the id + token pair grants posting rights)"
regex = '''https?://(?:canary\.|ptb\.)?discord(?:app)?\.com/api(?:/v\d+)?/webhooks/\d+/[A-Za-z0-9_-]{20,}'''
keywords = ["discord.com/api/webhooks", "discordapp.com/api/webhooks"]

# Broader than the default `microsoft-teams-webhook`, which requires a
# hyphen-free tenant and lowercase GUIDs and so misses e.g.
# `contoso-corp.webhook.office.com` or an uppercased id.
[[rules]]
id = "microsoft-teams-webhook-url"
description = "Microsoft Teams incoming webhook URL"
regex = '''(?i)https?://[a-z0-9.-]*\.(?:webhook\.office\.com/webhookb2|office\.com/webhook)/[a-z0-9@/_-]{20,}'''
keywords = ["webhook.office.com", "office.com/webhook"]

# Vendor-agnostic backstop: any URL whose path goes through `webhook(s)/` and
# ends in a long opaque token. Catches the vendors nobody thought to enumerate,
# which is the failure mode this whole section exists to prevent.
[[rules]]
id = "generic-webhook-url-with-token"
description = "Webhook URL carrying an embedded token"
regex = '''https?://[A-Za-z0-9.-]+/[A-Za-z0-9._/-]*webhooks?/[A-Za-z0-9._-]*/[A-Za-z0-9_-]{32,}'''
keywords = ["webhook"]

[[allowlists]]
description = "Known false positives"
regexTarget = "line"
regexes = [
  # Collaboration-adapter type registration; the mattermost-access-token
  # rule mistakes the identifier sequence for a token. No secret here.
  '''"mattermost", MattermostAdapter, MattermostConnectionConfig''',
  # A Discord client/application id is a *public* identifier, not a secret, and
  # these are obvious dummies in a config-validator test — but the default
  # `discord-client-id` rule flags any 17-19 digit number next to the keyword.
  '''discord_app_(?:client|application)_id="\d{17,19}"''',
  # A cache's time-to-live passed by keyword in a management test harness; the
  # generic-api-key rule reads "auth" in the variable name as a secret.
  '''ttl_seconds=controller_auth_ttl_seconds,''',
]
paths = [
  # Log-redaction tests exercise deliberately fake vendor tokens. Both spellings
  # of the path: gitleaks scans history, where the file lived under
  # `dash/apps/switchdash-desktop/` before the rename in CHOO-2008, and those
  # commits still carry the fixtures.
  '''(dash/apps/switchdash-desktop|console/apps/switch-console-desktop)/src/main/lib/file-logger\.test\.ts$''',
]

# Hosted agents v2 test fixtures. Each entry below needs BOTH its file path and
# its exact line (condition = "AND"), so the same text anywhere else, or any
# other value in the same file, is still scanned.

[[allowlists]]
description = "Git blob ids in the box runtime's upstream-sync list"
# 40-character hashes recording which upstream file each box copy is from.
# upstream-packages.test.ts checks every value against the real upstream
# file's blob id, so a value here that is not a real blob id fails that test.
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^console/packages/switch-agent-runtime-box/upstream-packages\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"]+\.(ts|tsx|json)": "[0-9a-f]{40}",?$''']

[[allowlists]]
description = "Test fixture in split-runtime.test.ts"
# A made-up "swpg_" proxy token in the split-runtime test's fake agent
# environment; never issued by anything.
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^console/packages/agent-controller-box/src/split-runtime\.test\.ts$''']
regexTarget = "line"
regexes = [
  '''^\s*ANTHROPIC_AUTH_TOKEN: 'swpg_probe_0123456789abcdef',\s*$''',
  '''^\s*env: \{ ANTHROPIC_API_KEY: 'swpg_probe_0123456789abcdef' \},\s*$''',
]

[[allowlists]]
description = "Test fixture in sealed-login.web.test.ts"
# A throwaway X25519 key pair used only by this cross-implementation test
# vector; not any controller's key. If it is ever used outside this test,
# replace it rather than allow it.
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^console/packages/agent-providers-box/src/sealed-login\.web\.test\.ts$''']
regexTarget = "line"
regexes = [
  '''^\s*privateKey: 'mK9YFSnL\+gcY/ye\+4HkkiK7eVYX/u\+CQzDECYtOqRUM=',\s*$''',
  '''^\s*ephemeral_key: 'qh92VjE6EvWweftDb6jNmtIsKJKOO5NzXaXl1kXzlFE=',\s*$''',
]

[[allowlists]]
description = "Test fixture in test_read_views_routes.py"
# A made-up keyed id ("k1-" plus hex): an id format, not a credential.
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^core/tests/switch_core/visibility/test_read_views_routes\.py$''']
regexTarget = "line"
regexes = [
  '''^\s*keyed = "k1-0123456789abcdef"\s*$''',
]

[[allowlists]]
description = "Test fixture in test_box_operator.py"
# A made-up keyed id ("k1-" plus hex): an id format, not a credential.
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^deploy/hosted/controller/tests/test_box_operator\.py$''']
regexTarget = "line"
regexes = [
  '''^\s*\("user_keyed_id", "k1-0123456789ABCDEF"\),\s*$''',
]

[[allowlists]]
description = "Test fixture in k8s-fields.json"
# A plain source label in the box operator's Kubernetes field fixture.
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^deploy/hosted/controller/tests/fixtures/k8s-fields\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"source": "cluster OpenAPI v3, v1\.37\.0-eks-b9510e3",\s*$''',
]
