name: switch dev cleanup

# Prunes old dev builds — the images and chart every push to main publishes
# under ghcr.io/<owner>/dev/, and the agents controller it publishes as a
# GitHub prerelease (see switch-release.yml) — so they do not grow without
# bound. Only the dev/ packages and the dev controller prereleases are
# touched; releases and RCs live apart. A build is deleted once it is older than 30
# days and outside the 20 newest, so the dev environment's pin always has
# something recent to point at. See scripts/prune_dev_packages.py.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        type: boolean
        default: true

permissions:
  # To delete the dev controller prereleases and their tags.
  contents: write
  packages: write

concurrency:
  group: switch-dev-cleanup
  cancel-in-progress: false

jobs:
  prune:
    name: Prune dev builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--owner "${{ github.repository_owner }}" --repository "${{ github.repository }}" --max-age-days 30 --keep 20)
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          python3 scripts/prune_dev_packages.py "${args[@]}"
