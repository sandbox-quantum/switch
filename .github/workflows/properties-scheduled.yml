name: Properties scheduled

# The checks that take too long for a pull request: the Quint models at their
# larger bounds (`properties/specs/configs.qnt`, `recipients_deep`). The
# bounds a PR runs are pr-ci.yml's `properties-model` job. A failure fails the
# run, which GitHub reports to whoever last edited the schedule.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models-deep:
    name: Property models, larger bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Quint
        uses: ./.github/actions/setup-quint

      - name: Every invariant holds in the larger bounds
        run: python3 properties/specs/run.py verify --deep
