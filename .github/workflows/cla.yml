name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a scoped, short-lived token for the CLA bot
        id: app-token
        if: >-
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          || github.event_name == 'pull_request_target'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CLA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLA_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: signatures/version1/cla.json
          # These name this very repository, which looks redundant but is not:
          # the action only reaches for PERSONAL_ACCESS_TOKEN (the CLA App
          # token above) to read and write the signature file when a remote
          # org or repo is set. Left unset, it writes with GITHUB_TOKEN, which
          # is contents:read here — so signing fails with "Resource not
          # accessible by integration". Do not remove without also granting
          # this workflow contents:write.
          remote-organization-name: sandbox-quantum
          remote-repository-name: switch
          path-to-document: https://github.com/sandbox-quantum/switch/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot],renovate[bot],socket-fix[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please read
            our [Contributor License Agreement](https://github.com/sandbox-quantum/switch/blob/main/CLA.md)
            and sign it by posting the following comment on this pull request:


            ---

            **Contributing on behalf of a company?** Your employer can sign the
            [Corporate CLA](https://github.com/sandbox-quantum/switch/blob/main/CCLA.pdf)
            instead: complete the PDF with your authorized GitHub usernames, have
            an authorized representative sign it, and email it to
            legal@sandboxquantum.com. Once we record it, your contributions are
            recognized as covered — see
            [CONTRIBUTING.md](https://github.com/sandbox-quantum/switch/blob/main/CONTRIBUTING.md#corporate-contributors).
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. ✅
