name: Docs sync

# Keeps docs/official, the offline copy of the published docs
# (docs.switchagents.ai), from falling behind them.
#
#   check  fails when docs/official on main differs from what the published
#          docs would produce, so a stale copy shows as a red run rather than
#          going unnoticed
#   sync   runs `just sync-docs` and opens a pull request with the result, or
#          updates the one already open, on the branch automation/sync-docs
#
# Not a PR check: the published docs change on their own schedule, so a check
# on every PR would fail work that has nothing to do with them.

on:
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC (off the top of the hour on purpose)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Token that can read sandbox-quantum/docs
        # The docs repository is private, so neither an anonymous clone nor this
        # repository's GITHUB_TOKEN can read it. The PR-bot App has to be
        # installed on it with read access to its contents.
        id: apptoken
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.AUTOFIX_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOFIX_PR_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            docs

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check out the docs source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: sandbox-quantum/docs
          path: .docs-source
          token: ${{ steps.apptoken.outputs.token }}
          persist-credentials: false

      - name: Compare docs/official with the published docs
        run: python3 scripts/sync_docs.py --check --source .docs-source

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scheduled runs are always on the default branch; a manual dispatch from any
    # other branch is skipped so its code never gets the write token.
    if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/sync-docs
    steps:
      - name: Token that can read sandbox-quantum/docs
        # As in `check`. It also pushes the branch and opens the PR, so CI runs
        # on it, which it would not for a PR opened with GITHUB_TOKEN.
        id: apptoken
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.AUTOFIX_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOFIX_PR_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            docs

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.apptoken.outputs.token }}

      - name: Check out the docs source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: sandbox-quantum/docs
          path: .docs-source
          token: ${{ steps.apptoken.outputs.token }}
          persist-credentials: false

      - name: Sync
        run: python3 scripts/sync_docs.py --source .docs-source

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/official)" ]; then
            echo "docs/official already matches the published docs."
            exit 0
          fi
          docs_sha=$(git -C .docs-source rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A docs/official
          git commit -q -m "docs: sync docs/official from published docs" \
            -m "Generated by \`just sync-docs\` from sandbox-quantum/docs@${docs_sha}."
          git push --force origin "$BRANCH"
          {
            echo "Daily sync of docs/official from sandbox-quantum/docs@${docs_sha}, generated by \`just sync-docs\` in the Docs sync workflow. Do not edit by hand: change the source pages in the docs repository."
            echo
            echo '```'
            git diff --name-status HEAD~1 -- docs/official
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated #$existing"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "docs: sync docs/official from published docs" --body-file "$RUNNER_TEMP/body.md"
          fi
