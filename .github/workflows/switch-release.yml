name: switch release

# Builds and publishes the Switch core stack — the switch-core, gateway, and
# setup container images, the Helm chart, and the standalone Docker Compose file
# (as an OCI artifact) — so adopters can deploy without building from source.
# See RELEASING.md for the full procedure.
#
# Trigger by pushing a tag like `switch-v0.2.0` (the version after `switch-v`
# MUST match pyproject.toml `[project].version`; the prep job verifies this).
# `workflow_dispatch` builds everything WITHOUT pushing, for verification.
#
# Release candidates: push `switch-v0.30.0-rc.1` on a commit that is on `main` or
# a `release/*` branch. The base version must be at or above pyproject's and not
# already released. An RC publishes the images, chart and compose under its own
# version only — never `latest` — so nothing that follows `latest` picks up an
# untested build, and Helm skips it unless asked for with `--devel` or an exact
# `--version`. pyproject's version is stamped on the runner (PEP 440 form,
# `0.30.0rc1`) so the running server reports the RC it is; nothing is committed.
#
# Dev builds: every push to `main` publishes the stack as
# `<next patch>-dev.<run number>.g<short sha>` under a separate `dev/` namespace
# (ghcr.io/<owner>/dev/…) — never `latest`, never mixed into the release
# packages' tag lists, and a semver pre-release Helm skips unless asked for by
# exact version — so the dev environment runs what is on main from published
# artifacts rather than building from source at deploy time. "Next patch" is one
# above the newest release tag on main, so a dev build sorts after the release it
# contains. A newer push cancels an in-flight dev build; switch-dev-cleanup.yml
# prunes old ones. No compose artifact: Switch Console bundles that from
# releases only.
#
# Build once, pin by digest: the chart is packaged only after the images are
# pushed, with each image's registry digest written into its values.yaml
# (scripts/pin_chart_images.py). Pinning the chart therefore pins the exact
# images, and what runs is reproducible from that one pin. The run summary and
# the `release-pins` artifact carry every digest, chart included. A version is
# published once: a run (or re-run) whose chart version already exists in the
# registry fails before building, since a rebuilt chart would point the same
# version at different digests.
#
# Artifacts go to GHCR by default, and the packages are public alongside the
# repo. REGISTRY / IMAGE_NAMESPACE are the only things to change to retarget
# another registry (e.g. ECR) — a config flip, not a rewrite.

on:
  push:
    tags:
      - 'switch-v*'
    # Every push, with no path filter: the images copy files from outside
    # core/ and gateway/ (a console fixture, core/README.md), so a filter
    # narrow enough to save builds is one that will someday skip a change
    # that mattered.
    branches:
      - main
  workflow_dispatch:

# Pushes to main share a group and the newest wins: an in-flight dev build of an
# older commit is superseded, so a busy merge day does not queue parallel
# emulated arm64 builds. Tags and dispatch runs each get their own group and are
# never cancelled — a cancelled release would be a half-published one.
concurrency:
  group: switch-release-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  # GHCR namespace = the repo owner (lowercase). Images land at
  # ghcr.io/<owner>/<image>; the Helm chart at ghcr.io/<owner>/charts/switch.
  # Dev builds go one level down, under <owner>/dev (prep's `namespace`).
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  prep:
    name: Resolve + verify version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To ask the registry whether this version is already published.
      packages: read
    outputs:
      images: ${{ steps.images.outputs.images }}
      namespace: ${{ steps.version.outputs.namespace }}
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      push: ${{ steps.version.outputs.push }}
      latest: ${{ steps.version.outputs.latest }}
      channel: ${{ steps.version.outputs.channel }}
      compose_speaks: ${{ steps.contract.outputs.speaks }}
      compose_accepts: ${{ steps.contract.outputs.accepts }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Branch and tag history, to check which branches contain an RC tag.
          fetch-depth: 0

      - name: Resolve version
        id: version
        # On a release tag: version is the tag minus `switch-v`, and we push and
        # move `latest`. On an RC tag: push under the RC version only. On a push
        # to main: push under a dev version only. On a dispatch run: use
        # pyproject's version and DON'T push (build-only).
        run: |
          pkg_version="$(python3 -c "import tomllib; print(tomllib.load(open('core/pyproject.toml','rb'))['project']['version'])")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME#switch-v}"
            if [[ "$tag_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
              base="${BASH_REMATCH[1]}"
              python_version="${base}rc${BASH_REMATCH[2]}"
              echo "rc base=$base pyproject=$pkg_version"
              if [ "$(printf '%s\n%s\n' "$pkg_version" "$base" | sort -V | head -n1)" != "$pkg_version" ]; then
                echo "::error::RC base version $base is below core/pyproject.toml $pkg_version."
                exit 1
              fi
              if git rev-parse -q --verify "refs/tags/switch-v$base" >/dev/null; then
                echo "::error::switch-v$base is already released; an RC must precede a later version."
                exit 1
              fi
              commit="$(git rev-parse "$GITHUB_REF^{commit}")"
              branches="$(git branch -r --contains "$commit" --format='%(refname:short)')"
              echo "branches containing $commit:"
              echo "$branches"
              if ! printf '%s\n' "$branches" | grep -Eq '^origin/(main|release/.+)$'; then
                echo "::error::RC tag $GITHUB_REF_NAME points at $commit, which is not on main or a release/* branch."
                exit 1
              fi
              latest=false
            elif [ "$tag_version" = "$pkg_version" ]; then
              python_version="$pkg_version"
              latest=true
            else
              echo "::error::Tag version ($tag_version) does not match core/pyproject.toml version ($pkg_version). Bump pyproject and re-tag, or tag a release candidate as switch-v<version>-rc.<n>."
              exit 1
            fi
            push=true
            channel=release
            [ "$latest" = true ] || channel=rc
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            # One patch above the newest release on main, so the build sorts
            # after the release it contains (a `-dev`/`.dev` version sorts
            # before its own base) and before any later release or RC.
            released="$(git tag --merged HEAD --list 'switch-v*' | sed 's/^switch-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
            if [ -z "$released" ]; then
              echo "::error::No switch-v<X.Y.Z> release tag is reachable from main; cannot place a dev version."
              exit 1
            fi
            IFS=. read -r major minor patch <<<"$released"
            base="$major.$minor.$((patch + 1))"
            # The `g` keeps the identifier alphanumeric: an all-digit short sha
            # with a leading zero is not valid semver.
            tag_version="${base}-dev.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA::7}"
            python_version="${base}.dev${GITHUB_RUN_NUMBER}"
            push=true
            latest=false
            channel=dev
          else
            tag_version="$pkg_version"
            python_version="$pkg_version"
            push=false
            latest=false
            channel=dry-run
          fi
          namespace="$IMAGE_NAMESPACE"
          [ "$channel" != dev ] || namespace="$IMAGE_NAMESPACE/dev"
          {
            echo "namespace=$namespace"
            echo "version=$tag_version"
            echo "python_version=$python_version"
            echo "push=$push"
            echo "latest=$latest"
            echo "channel=$channel"
          } | tee -a "$GITHUB_OUTPUT"

      - name: List the images
        # scripts/pin_chart_images.py is the one list of first-party images; the
        # build matrix, the pin and the recorded pins all come from it.
        id: images
        run: echo "images=$(python3 scripts/pin_chart_images.py images)" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Helm
        if: ${{ steps.version.outputs.push == 'true' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Refuse to republish a version
        # Checked before anything is built; see scripts/refuse_published_chart.sh.
        if: ${{ steps.version.outputs.push == 'true' }}
        env:
          NAMESPACE: ${{ steps.version.outputs.namespace }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          for chart in $(python3 scripts/pin_chart_images.py charts | jq -r '.[].chart'); do
            scripts/refuse_published_chart.sh "oci://$REGISTRY/$NAMESPACE/charts/$chart" "$VERSION"
          done

      # The published compose artifact declares its stack-compose range twice:
      # in the file (for whoever has already downloaded it) and as an OCI
      # annotation here — which a consumer can read off the registry WITHOUT
      # pulling it, to decide whether pulling is worth it (CHOO-1865).
      - name: Read the stack-compose contract
        id: contract
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          declared = yaml.safe_load(open("artifacts.yaml"))["contracts"]["stack-compose"]["artifacts"]["compose"]
          print(f"speaks={declared['speaks']}")
          print(f"accepts={declared['accepts']}")
          PY

  images:
    name: Build & publish image (${{ matrix.image }})
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stamp the pre-release version
        # The server reports its version from the installed package metadata,
        # which comes from pyproject. Written here for an RC or a dev build,
        # never committed.
        if: ${{ needs.prep.outputs.python_version != needs.prep.outputs.version }}
        env:
          PYTHON_VERSION: ${{ needs.prep.outputs.python_version }}
        run: |
          python3 - <<'PY'
          import os, re
          path = "core/pyproject.toml"
          text = open(path).read()
          stamped, n = re.subn(r'(?m)^version = ".*"$', f'version = "{os.environ["PYTHON_VERSION"]}"', text, count=1)
          if n != 1:
              raise SystemExit(f"no [project] version line found in {path}")
          open(path, "w").write(stamped)
          PY
          grep -m1 '^version = ' core/pyproject.toml

      - name: Set up QEMU
        # Enables arm64 emulation so buildx can produce a multi-arch manifest
        # from an amd64 runner.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prep.outputs.push == 'true' }}
          # Read by Dockerfile.switch only; the other images ignore them.
          build-args: |
            SWITCH_GIT_COMMIT=${{ github.sha }}
            SWITCH_GIT_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prep.outputs.namespace }}/${{ matrix.image }}:${{ needs.prep.outputs.version }}
            ${{ needs.prep.outputs.latest == 'true' && format('{0}/{1}/{2}:latest', env.REGISTRY, needs.prep.outputs.namespace, matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # The digest of the multi-arch index, which is what a pod pulls by. The
      # chart job writes it into values.yaml, so it has to leave this job.
      - name: Record digest
        if: ${{ needs.prep.outputs.push == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build-push-action reported no usable digest for ${{ matrix.image }}: '$DIGEST'"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.image }}"

      - name: Upload digest
        if: ${{ needs.prep.outputs.push == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 7

  chart:
    name: Package & publish Helm charts
    # After the images: each chart carries its images' digests, so it cannot be
    # packaged before they exist, and a chart is never published pointing at an
    # image that failed to push. The charts come from
    # scripts/pin_chart_images.py (`charts`), like the image matrix.
    needs: [prep, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      NAMESPACE: ${{ needs.prep.outputs.namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # To ask, before moving the dev `main` tag, whether this is still main's head.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Set up ORAS
        if: ${{ needs.prep.outputs.channel == 'dev' }}
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4

      - name: Download image digests
        if: ${{ needs.prep.outputs.push == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        if: ${{ needs.prep.outputs.push == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the registry serves every pinned image
        if: ${{ needs.prep.outputs.push == 'true' }}
        run: |
          for file in "$RUNNER_TEMP"/digests/*; do
            docker buildx imagetools inspect "$REGISTRY/$NAMESPACE/$(basename "$file")@$(cat "$file")" >/dev/null
          done

      - name: Pin, lint, package and check each chart
        # A dry run pushed no images, so it pins placeholder digests: the pin
        # and the checks still run, and nothing is published. The check renders
        # the .tgz that is about to be pushed, not the source tree.
        run: |
          if [ "${{ needs.prep.outputs.push }}" = true ]; then
            source=(--digests-dir "$RUNNER_TEMP/digests")
          else
            source=(--placeholder-digests)
          fi
          python3 scripts/pin_chart_images.py charts > "$RUNNER_TEMP/charts.json"
          for chart in $(jq -r '.[].chart' "$RUNNER_TEMP/charts.json"); do
            path="$(jq -r --arg c "$chart" '.[] | select(.chart == $c) | .path' "$RUNNER_TEMP/charts.json")"
            python3 scripts/pin_chart_images.py pin --chart "$chart" \
              --registry "$REGISTRY/$NAMESPACE" --version "$VERSION" "${source[@]}"
            git diff -- "$path/values.yaml"
            helm package "$path" --version "$VERSION" --app-version "$VERSION" \
              --destination "$RUNNER_TEMP/chart"
            renders="$(jq -c --arg c "$chart" '.[] | select(.chart == $c) | .renders[]' "$RUNNER_TEMP/charts.json")"
            while read -r files; do
              args=()
              for f in $(jq -r '.[]' <<<"$files"); do args+=(-f "$f"); done
              # Linted with the check values: a chart with a values schema
              # does not lint without the values it requires.
              helm lint "$path" "${args[@]}"
              helm template switch "$RUNNER_TEMP/chart/$chart-$VERSION.tgz" "${args[@]}" \
                | python3 scripts/pin_chart_images.py verify --chart "$chart" --registry "$REGISTRY/$NAMESPACE"
            done <<<"$renders"
          done

      - name: Log in to GHCR (Helm OCI)
        if: ${{ needs.prep.outputs.push == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Push the charts
        id: push
        if: ${{ needs.prep.outputs.push == 'true' }}
        run: |
          flags=""
          for chart in $(jq -r '.[].chart' "$RUNNER_TEMP/charts.json"); do
            # prep refused a published version, but a re-run of this job alone
            # skips prep, so ask again right before pushing.
            scripts/refuse_published_chart.sh "oci://$REGISTRY/$NAMESPACE/charts/$chart" "$VERSION"
            helm push "$RUNNER_TEMP/chart/$chart-$VERSION.tgz" "oci://$REGISTRY/$NAMESPACE/charts" 2>&1 \
              | tee "$RUNNER_TEMP/helm-push.log"
            digest="$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/helm-push.log")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::helm push of $chart printed no chart digest; got '$digest'"
              exit 1
            fi
            flags="$flags --chart-digest $chart=$digest"
          done
          echo "chart_digest_flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Record the pins
        # The run summary is for a person; release-pins.json is for whatever
        # promotes this build next (an environment's pins file), so it never has
        # to be copied out of a log by hand.
        if: ${{ needs.prep.outputs.push == 'true' }}
        run: |
          # shellcheck disable=SC2086 # the flags are deliberately split into words
          python3 scripts/pin_chart_images.py record \
            --digests-dir "$RUNNER_TEMP/digests" \
            --registry "$REGISTRY/$NAMESPACE" \
            --version "$VERSION" \
            --channel "${{ needs.prep.outputs.channel }}" \
            --commit "$GITHUB_SHA" \
            ${{ steps.push.outputs.chart_digest_flags }} \
            --json "$RUNNER_TEMP/release-pins.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the pins
        if: ${{ needs.prep.outputs.push == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-pins
          path: ${{ runner.temp }}/release-pins.json
          if-no-files-found: error

      - name: Move the dev `main` tag
        # The dev environment follows main: its ArgoCD Application tracks the
        # `main` tag of the dev charts, so moving it is the deploy. Only the
        # build of main's current head moves it; an older build finishing late
        # leaves it alone, and the newer build moves it when it finishes.
        if: ${{ needs.prep.outputs.channel == 'dev' }}
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now, not $GITHUB_SHA; leaving the main tag to that build."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          for chart in $(jq -r '.[].chart' "$RUNNER_TEMP/charts.json"); do
            oras tag "$REGISTRY/$NAMESPACE/charts/$chart:$VERSION" main
          done

  compose:
    name: Publish standalone compose (OCI artifact)
    needs: prep
    # Switch Console bundles the compose file from releases; a dev build of it
    # has no consumer.
    if: ${{ needs.prep.outputs.channel != 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4

      - name: Log in to GHCR (ORAS)
        if: ${{ needs.prep.outputs.push == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Push compose artifact
        # Publishes deploy/local/standalone-docker-compose.yml to GHCR as an OCI
        # artifact, stamped with the same version as the images so a single tag
        # pins the whole standalone stack. Switch Console bundles this exact file at
        # build time. `latest` moves with each release, never with an RC.
        if: ${{ needs.prep.outputs.push == 'true' }}
        working-directory: deploy/local
        run: |
          oras push \
            "$REGISTRY/$IMAGE_NAMESPACE/standalone-compose:${{ needs.prep.outputs.version }}${{ needs.prep.outputs.latest == 'true' && ',latest' || '' }}" \
            --artifact-type application/vnd.switch.compose.v1+yaml \
            --annotation "org.opencontainers.image.version=${{ needs.prep.outputs.version }}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "com.switch.contract.stack-compose.speaks=${{ needs.prep.outputs.compose_speaks }}" \
            --annotation "com.switch.contract.stack-compose.accepts=${{ needs.prep.outputs.compose_accepts }}" \
            standalone-docker-compose.yml:application/yaml
