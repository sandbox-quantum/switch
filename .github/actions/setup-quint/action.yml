name: Set up Quint
description: >
  Quint with the Java its model checkers run on, for the models in
  properties/specs. Quint downloads the checkers on first use; they are cached
  by operating system, Quint version and Java version.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: console/.nvmrc

    - name: Set up Java
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install Quint
      shell: bash
      run: npm install --global @informalsystems/quint@0.32.0

    - name: Cache the model checkers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.quint
        key: ${{ runner.os }}-quint-0.32.0-java21
