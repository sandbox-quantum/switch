[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switch-hosted-controller"
version = "0.2.0"
description = "Bounded EC2 lifecycle controller for hosted Switch agents"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
switch-hosted-controller = "switch_hosted_controller.cli:main"
switch-node-gate = "switch_hosted_controller.node_gate_main:main"
switch-egress-lists = "switch_hosted_controller.egress_lists:main"
switch-egress-check-template = "switch_hosted_controller.egress_lists:check_template_main"
switch-box-operator = "switch_hosted_controller.box_operator_main:main"
switch-hosted-workers = "switch_hosted_controller.workers_main:main"
switch-drain-worker = "switch_hosted_controller.drain_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/switch_hosted_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
