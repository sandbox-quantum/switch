---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switch-operator-drain-room
  namespace: switch-drain-room
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - get
  - list
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switch-operator-drain-room
  namespace: switch-drain-room
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switch-operator-drain-room
subjects:
- kind: ServiceAccount
  name: switch-drain
  namespace: switch-hosted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: one-placeholder
  namespace: switch-drain-room
spec:
  hard:
    limits.cpu: 250m
    limits.memory: 1Gi
    pods: '1'
    requests.cpu: 250m
    requests.memory: 1Gi
