---
# switch-hosted-reaper: deletes unclaimed warm pool boxes, and nothing else (controller/src/.../reaper.py).
# Its own account, its own Core credential (`reaper_token`, in Secret switch-hosted-reaper-core, made before the first
# apply like the other tokens; DEPLOY.md step 3), and rights to read the three lists, read namespaces, list persistent
# volumes and delete namespaces. The admission policy switch-reaper-deletes-unclaimed-pool-boxes limits the delete to a
# box-keyed namespace with no owner. It names no RuntimeClass and no toleration, so it never lands on an agent
# machine that carries the agents taint.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: switch-hosted-reaper
  namespace: switch-hosted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: switch-hosted-reaper
  name: switch-hosted-reaper
  namespace: switch-hosted
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: switch-hosted-reaper
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        ad.datadoghq.com/reaper.logs: '[{"source":"switch-hosted-reaper","service":"switch-hosted-reaper"}]'
        tags.datadoghq.com/service: switch-hosted-reaper
      labels:
        app: switch-hosted-reaper
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - switch-hosted-reaper
        env:
        - name: SWITCH_REAPER_CORE_URL
          value: https://__SERVER_IP__
        - name: SWITCH_REAPER_TOKEN_FILE
          value: "/etc/switch/core/token"
        - name: SWITCH_REAPER_CORE_CA
          value: "/etc/switch/files/box-ca.crt"
        image: __CONTROLLER_IMAGE__
        imagePullPolicy: IfNotPresent
        name: reaper
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: "/dev/termination-log"
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/etc/switch/files"
          name: files
          readOnly: true
        - mountPath: "/etc/switch/core"
          name: core
          readOnly: true
        - mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
          name: kube
          readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: switch-hosted-reaper
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: box-ca.crt
            path: box-ca.crt
          name: switch-box-operator-files
        name: files
      - name: core
        secret:
          defaultMode: 256
          secretName: switch-hosted-reaper-core
      - name: kube
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switch-hosted-reaper-egress
  namespace: switch-hosted
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: __SERVER_IP__/32
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: __API_SERVER_IP_1__/32
    - ipBlock:
        cidr: __API_SERVER_IP_2__/32
    - ipBlock:
        cidr: 172.20.0.1/32
  podSelector:
    matchLabels:
      app: switch-hosted-reaper
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switch-hosted-reaper-lists
  namespace: switch-hosted
rules:
- apiGroups:
  - ''
  resourceNames:
  - pool-map
  - box-map
  - box-owners
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switch-hosted-reaper-lists
  namespace: switch-hosted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switch-hosted-reaper-lists
subjects:
- kind: ServiceAccount
  name: switch-hosted-reaper
  namespace: switch-hosted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switch-hosted-reaper
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: switch-hosted-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: switch-hosted-reaper
subjects:
- kind: ServiceAccount
  name: switch-hosted-reaper
  namespace: switch-hosted
