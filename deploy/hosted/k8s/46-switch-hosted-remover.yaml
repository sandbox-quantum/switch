---
# switch-hosted-remover: deletes retired box namespaces, and nothing else (controller/src/.../remover.py).
# Its own Deployment, account and Core credential (`remover_token`, in Secret switch-hosted-remover-core, made before
# the first apply like the other tokens; DEPLOY.md step 3), sharing nothing with the other services. Its rights: read
# `box-removals` by name, and read and delete namespaces. The admission policy switch-remover-deletes-listed-boxes
# limits the delete to a namespace listed in `box-removals`. Placed like the other control services: no RuntimeClass,
# no toleration, never on a node with a box, system nodes preferred.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: switch-hosted-remover
  namespace: switch-hosted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: switch-hosted-remover
  name: switch-hosted-remover
  namespace: switch-hosted
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: switch-hosted-remover
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        ad.datadoghq.com/remover.logs: '[{"source":"switch-hosted-remover","service":"switch-hosted-remover"}]'
        tags.datadoghq.com/service: switch-hosted-remover
      labels:
        app: switch-hosted-remover
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: switch.dev/pool
                operator: In
                values:
                - system
            weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: switch-box
            namespaceSelector: {}
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
      - command:
        - switch-hosted-remover
        env:
        - name: SWITCH_REMOVER_CORE_URL
          value: https://__SERVER_IP__
        - name: SWITCH_REMOVER_TOKEN_FILE
          value: "/etc/switch/core/token"
        - name: SWITCH_REMOVER_CORE_CA
          value: "/etc/switch/files/box-ca.crt"
        image: __CONTROLLER_IMAGE__
        imagePullPolicy: IfNotPresent
        name: remover
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: "/dev/termination-log"
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/etc/switch/files"
          name: files
          readOnly: true
        - mountPath: "/etc/switch/core"
          name: core
          readOnly: true
        - mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
          name: kube
          readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: switch-hosted-remover
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: box-ca.crt
            path: box-ca.crt
          name: switch-box-operator-files
        name: files
      - name: core
        secret:
          defaultMode: 256
          secretName: switch-hosted-remover-core
      - name: kube
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switch-hosted-remover-egress
  namespace: switch-hosted
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: __SERVER_IP__/32
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: __API_SERVER_IP_1__/32
    - ipBlock:
        cidr: __API_SERVER_IP_2__/32
    - ipBlock:
        cidr: 172.20.0.1/32
  podSelector:
    matchLabels:
      app: switch-hosted-remover
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switch-hosted-remover-removals
  namespace: switch-hosted
rules:
- apiGroups:
  - ''
  resourceNames:
  - box-removals
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switch-hosted-remover-removals
  namespace: switch-hosted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switch-hosted-remover-removals
subjects:
- kind: ServiceAccount
  name: switch-hosted-remover
  namespace: switch-hosted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switch-hosted-remover
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: switch-hosted-remover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: switch-hosted-remover
subjects:
- kind: ServiceAccount
  name: switch-hosted-remover
  namespace: switch-hosted
