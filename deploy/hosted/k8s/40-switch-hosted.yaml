apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  finalizers:
  - networking.k8s.aws/resources
  name: operator-egress
  namespace: switch-hosted
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: __SERVER_IP__/32
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: __API_SERVER_IP_1__/32
    - ipBlock:
        cidr: __API_SERVER_IP_2__/32
    - ipBlock:
        cidr: 172.20.0.1/32
  podSelector:
    matchLabels:
      app: switch-hosted-operator
  policyTypes:
  - Ingress
  - Egress
