    {
      "server_ip": "__SERVER_IP__",
      "server_url": "https://__SERVER_IP__",
      "image": "__BOX_IMAGE__",
      "storage_class": "gp3",
      "proxy_host": "squid.egress-proxy.svc",
      "proxy_port": 3128,
      "zones": [
        "__ZONE__"
