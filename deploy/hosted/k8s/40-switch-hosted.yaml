---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: switch-drain
  name: switch-drain
  namespace: switch-hosted
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: switch-drain
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: switch-drain
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: switch-box
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: switch-hosted
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
      - command:
        - switch-drain-worker
        env:
        - name: SWITCH_DRAIN_CORE_URL
          value: https://__SERVER_IP__
        - name: SWITCH_DRAIN_CORE_TOKEN_FILE
          value: "/etc/switch/core/bearer"
        - name: SWITCH_DRAIN_CORE_CA
          value: "/etc/switch/files/box-ca.crt"
        - name: SWITCH_DRAIN_BOX_MAP
          value: "/etc/switch/box-map"
        - name: SWITCH_DRAIN_PAUSE_IMAGE
          value: __PAUSE_IMAGE__
        - name: SWITCH_PLACEMENT_POOL
          valueFrom:
            configMapKeyRef:
              key: pool
              name: switch-placement
        - name: SWITCH_PLACEMENT_TARGET
          valueFrom:
            configMapKeyRef:
              key: target
              name: switch-placement
        - name: SWITCH_PLACEMENT_CEILING
          valueFrom:
            configMapKeyRef:
              key: ceiling
              name: switch-placement
        - name: SWITCH_DRAIN_OWN_NODE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: __CONTROLLER_IMAGE__
        imagePullPolicy: IfNotPresent
        name: drain
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: "/dev/termination-log"
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/etc/switch/files"
          name: files
          readOnly: true
        - mountPath: "/etc/switch/core"
          name: core
          readOnly: true
        - mountPath: "/etc/switch/box-map"
          name: box-map
          readOnly: true
        - mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
          name: kube
          readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      nodeSelector:
        switch.dev/pool: agents
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: switch-drain
      serviceAccountName: switch-drain
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: box-ca.crt
            path: box-ca.crt
          name: switch-box-operator-files
        name: files
      - name: core
        secret:
          defaultMode: 256
          secretName: switch-operator-actions-bearer
      - name: box-map
        secret:
          defaultMode: 288
          secretName: box-map
      - name: kube
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: switch-hosted-controller
  name: switch-hosted-controller
  namespace: switch-hosted
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: switch-hosted-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: switch-hosted-controller
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - switch-hosted-workers
        env:
        - name: SWITCH_HOSTED_WORKERS_SCALER
          value: '1'
        - name: SWITCH_HOSTED_WORKERS_EVICTIONS
          value: '1'
        - name: SWITCH_HOSTED_WORKERS_CLUSTER_REPORT
          value: '1'
        - name: SWITCH_HOSTED_WORKERS_INTERVAL_SECONDS
          value: '30'
        - name: SWITCH_HOSTED_WORKERS_CORE_URL
          value: https://__SERVER_IP__
        - name: SWITCH_HOSTED_WORKERS_CORE_TOKEN_FILE
          value: "/etc/switch/core/token"
        - name: SWITCH_HOSTED_WORKERS_CORE_CA
          value: "/etc/switch/files/box-ca.crt"
        - name: SWITCH_HOSTED_WORKERS_BOX_MAP
          value: "/etc/switch/box-map"
        - name: SWITCH_SCALER_REPORT_EVICTIONS
          value: '1'
        - name: SWITCH_SCALER_REPORT_BOX_FACTS
          value: '1'
        - name: SWITCH_CLUSTER_PROXY_NAMESPACE
          value: egress-proxy
        - name: SWITCH_CLUSTER_OPERATOR_NAMESPACE
          value: switch-hosted
        - name: SWITCH_CLUSTER_OPERATOR_DEPLOYMENT
          value: switch-hosted-controller
        - name: SWITCH_PLACEMENT_POOL
          valueFrom:
            configMapKeyRef:
              key: pool
              name: switch-placement
        - name: SWITCH_PLACEMENT_TARGET
          valueFrom:
            configMapKeyRef:
              key: target
              name: switch-placement
        - name: SWITCH_PLACEMENT_CEILING
          valueFrom:
            configMapKeyRef:
              key: ceiling
              name: switch-placement
        image: __CONTROLLER_IMAGE__
        imagePullPolicy: IfNotPresent
        name: workers
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: "/dev/termination-log"
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/etc/switch/files"
          name: files
          readOnly: true
        - mountPath: "/etc/switch/core"
          name: core
          readOnly: true
        - mountPath: "/etc/switch/box-map"
          name: box-map
          readOnly: true
        - mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
          name: kube
          readOnly: true
        - mountPath: "/tmp"
          name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      nodeSelector:
        switch.dev/pool: agents
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: switch-hosted-controller
      serviceAccountName: switch-hosted-controller
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: box-ca.crt
            path: box-ca.crt
          name: switch-box-operator-files
        name: files
      - name: core
        secret:
          defaultMode: 256
          secretName: switch-hosted-controller-core
      - name: box-map
        secret:
          defaultMode: 288
          secretName: box-map
      - name: kube
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
