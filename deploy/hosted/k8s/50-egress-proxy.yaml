---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: squid
  namespace: egress-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid
  namespace: egress-proxy
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: squid
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # Datadog: the squid container's lines (its reload wrapper's included) go under one service, so the box
        # cluster's monitors (../observability/monitors.json) can find them. Inert until the cluster runs an agent.
        ad.datadoghq.com/squid.logs: '[{"source":"squid","service":"switch-egress-proxy"}]'
        # The access-log sidecar prints each box's proxy login and destination host. An agent collecting every
        # container's output must drop all of it: it never leaves the cluster.
        ad.datadoghq.com/access-log.logs: '[{"source":"squid-access","service":"switch-egress-proxy","log_processing_rules":[{"type":"exclude_at_match","name":"never_ship_box_destinations","pattern":"."}]}]'
        # squid.conf and the reload wrapper as filled (fill-placeholders.py fills in their hash). squid reads both
        # only when its pod starts, so a change to either changes this and rolls the pods; without it, applying the
        # files left the running pods on the old ones, and a pod starting mid-apply could take the old wrapper.
        switch.dev/squid-config: __SQUID_CONFIG_HASH__
      labels:
        app: squid
        tags.datadoghq.com/service: switch-egress-proxy
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - sh
        - "/etc/squid/reload/run.sh"
        image: public.ecr.aws/ubuntu/squid@sha256:c9f5212b147a766529c7b026e2bebed37b998d33d0066b658596af5eba7cc65c
        imagePullPolicy: IfNotPresent
        name: squid
        ports:
        - containerPort: 3128
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 13
          runAsNonRoot: true
          runAsUser: 13
        terminationMessagePath: "/dev/termination-log"
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/etc/squid/conf.d"
          name: conf
        - mountPath: "/var/log/squid"
          name: logs
        - mountPath: "/var/spool/squid"
          name: spool
        - mountPath: "/run"
          name: run
        - mountPath: "/tmp"
          name: tmp
        - mountPath: "/etc/squid/boxes"
          name: boxes
          readOnly: true
        - mountPath: "/etc/squid/passwd"
          name: passwd
          readOnly: true
        - mountPath: "/etc/squid/reload"
          name: reload
          readOnly: true
      - args:
        - sh
        - "-c"
        - until [ -f /var/log/squid/access.log ]; do sleep 1; done; exec tail -F /var/log/squid/access.log
        image: public.ecr.aws/docker/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        imagePullPolicy: IfNotPresent
        name: access-log
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 13
          runAsNonRoot: true
          runAsUser: 13
        terminationMessagePath: "/dev/termination-log"
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: "/var/log/squid"
          name: logs
          readOnly: true
      dnsPolicy: ClusterFirst
      priorityClassName: switch-shared-services
      restartPolicy: Always
      runtimeClassName: gvisor
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: squid
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: squid-conf
        name: conf
      - emptyDir: {}
        name: logs
      - emptyDir: {}
        name: spool
      - emptyDir: {}
        name: run
      - emptyDir: {}
        name: tmp
      # The box files: a fixed `_none.conf` (squid-boxes-base), so `include /etc/squid/boxes/*.conf` always
      # finds a file and squid starts with no box yet, beside the per-box files egress-lists writes into
      # squid-boxes (optional, so a missing one never holds squid back). Read-only, as before.
      - name: boxes
        projected:
          defaultMode: 420
          sources:
          - configMap:
              name: squid-boxes-base
          - configMap:
              name: squid-boxes
              optional: true
      - name: passwd
        secret:
          defaultMode: 288
          secretName: squid-passwd
      - configMap:
          defaultMode: 365
          name: squid-reload
        name: reload
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switch-cluster-report-services
  namespace: egress-proxy
rules:
- apiGroups:
  - apps
  resourceNames:
  - squid
  resources:
  - deployments
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: switch-egress-lists
  namespace: egress-proxy
rules:
- apiGroups:
  - ''
  resourceNames:
  - squid-boxes
  resources:
  - configmaps
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resourceNames:
  - squid-passwd
  resources:
  - secrets
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switch-cluster-report-services
  namespace: egress-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switch-cluster-report-services
subjects:
- kind: ServiceAccount
  name: switch-hosted-controller
  namespace: switch-hosted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: switch-egress-lists
  namespace: egress-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: switch-egress-lists
subjects:
- kind: ServiceAccount
  name: egress-lists
  namespace: egress-lists
---
apiVersion: v1
data:
  squid.conf: |
    http_port 3128
    max_filedescriptors 4096   # default 65536 sizes tables for 64k sockets; we need a few hundred
    acl SSL_ports port 443
    acl HTTP_port port 80
    acl CONNECT method CONNECT
    # Plain http (port 80) only to fetch: anything else is refused before any box's rule.
    acl web_get method GET HEAD
    # Allow-list: GitHub and npm, plus the AI provider hosts below.
    # -n: match names only; never look up the name behind a bare IP (a request by IP must not match an allowed name)
    acl allowed dstdomain -n github.com api.github.com codeload.github.com objects.githubusercontent.com raw.githubusercontent.com
    acl allowed dstdomain -n registry.npmjs.org
    # Vertex AI: the global endpoint and token refresh. Exact host names only (no leading dot, so no subdomains):
    #   aiplatform.googleapis.com  the global Vertex endpoint (Claude calls)
    #   oauth2.googleapis.com      refreshing the credential into a short-lived access token
    # Any other host a CLI asks for shows as TCP_DENIED in the proxy log; each extra host is a reviewed change.
    # Telemetry stays refused (CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1).
    acl allowed dstdomain -n aiplatform.googleapis.com oauth2.googleapis.com
    # Only with an Anthropic API key instead of Vertex:
    # acl allowed dstdomain -n api.anthropic.com
    # Codex, only if it's used (separate line so it can be removed on its own):
    # acl allowed dstdomain -n api.openai.com auth.openai.com chatgpt.com   (off unless Codex is used)
    acl agents src __AGENTS_SUBNET__
    # Never forward to private, local, reserved, multicast or metadata addresses, or to the box cluster's own VPC
    # and service ranges, whatever name was asked for. `dst` checks the address squid resolved and connects to, so
    # a public name that resolves to one of these is refused too.
    acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
    acl private_dst dst 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
    acl private_dst dst ::1 fc00::/7 fe80::/10 ::ffff:0:0/96
    # IPv6 forms that carry an IPv4 address inside (NAT64, 6to4, Teredo): refused whole, so none reaches one behind.
    acl private_dst dst 64:ff9b::/96 2002::/16 2001::/32
    acl private_dst dst __CLUSTER_VPC_CIDR__ __CLUSTER_SERVICE_CIDR__
    # Per box (each box pod has its own address, and squid counts per client address): at most 128 connections at
    # once, controller and agents together, so a box can't flood; a refusal for this is logged as a fixed line.
    acl box_over maxconn 128
    # Per-box logins: the generator's hashes; a login means only that box's own list. The wrapper (run.sh)
    # copies them, and the box files, from the mounts to /run/squid-live: logins at once, box files, joined into one, after a clean parse.
    auth_param basic program /usr/lib/squid/basic_ncsa_auth /run/squid-live/passwd
    auth_param basic realm switch-egress
    auth_param basic children 5 startup=1 idle=1
    # A login is re-checked every 10 s, so a removed one stops working within seconds.
    auth_param basic credentialsttl 10 seconds
    acl has_login req_header Proxy-Authorization .
    http_access deny private_dst
    http_access deny box_over
    http_access deny CONNECT !SSL_ports
    http_access deny !CONNECT !web_get
    http_access deny !CONNECT !HTTP_port
    include /run/squid-live/boxes.conf
    http_access deny all
    # Bandwidth per box. Download: 5 MB/s sustained after a 100 MB burst (class 3 keys by the address's last two
    # octets, unique inside the VPC; class 2's last octet would share a bucket across /24s). Upload: 2 MB/s after a
    # 20 MB burst. Slowed, never refused.
    delay_pools 1
    delay_class 1 3
    delay_parameters 1 -1/-1 -1/-1 5000000/100000000
    delay_access 1 allow all
    client_delay_pools 1
    client_delay_parameters 1 2000000 20000000
    client_delay_access 1 allow all
    cache deny all
    strip_query_terms on   # never log query strings (CONNECT tunnels only log host:port anyway)
    logfile_rotate 0
    access_log stdio:/var/log/squid/access.log
    # A box refused for its connection limit: one fixed line in the same in-cluster log, no host and no address.
    logformat box_limit %ts switch-egress: a box is over its connection limit
    access_log stdio:/var/log/squid/access.log logformat=box_limit box_over
    cache_log /var/log/squid/cache.log
    pinger_enable off   # the ICMP pinger needs NET_RAW, which this pod rightly lacks
    pid_filename none
    coredump_dir /tmp
kind: ConfigMap
metadata:
  name: squid-conf
  namespace: egress-proxy
---
apiVersion: v1
data:
  # No box files yet: nothing is allowed (squid.conf denies all after the include). The leading underscore is a
  # name no box's files can have (theirs start with the box id), so egress-lists can never write over it.
  _none.conf: |
    # No box yet: nothing is allowed. egress-lists writes each box's files beside this one.
kind: ConfigMap
metadata:
  labels:
    app: squid
  name: squid-boxes-base
  namespace: egress-proxy
---
apiVersion: v1
data:
  run.sh: |
    #!/bin/sh
    # squid's reload wrapper. squid reads its box files and logins from $live, never from the mounts:
    # - logins (squid-passwd) are copied there at once on any change, apart from the box files, and squid is
    #   reloaded with its last good config, so a removed box loses its login within seconds even while
    #   another box's file is bad;
    # - box files (squid-boxes) are joined, in name order, into one staged file, which goes live only after a
    #   clean `squid -k parse`, by a plain rename over the live file (rename(2): atomic, and the same with
    #   GNU, BSD or busybox `mv`), so a bad file never replaces a good one. Started with a bad file, it keeps
    #   the pod's last good file if it has one, and otherwise allows no box at all.
    # It checks every $poll seconds, takes checksums and counts, and never prints a file's content.
    set -u
    conf=${SQUID_CONF:-/etc/squid/conf.d/squid.conf}
    src_boxes=${SQUID_SRC_BOXES:-/etc/squid/boxes}
    src_passwd=${SQUID_SRC_PASSWD:-/etc/squid/passwd}
    live=${SQUID_LIVE:-/run/squid-live}
    squid=${SQUID_BIN:-squid}
    poll=${SQUID_POLL_S:-2}
    warn_every=${SQUID_WARN_EVERY_S:-60}

    files() { find -L "$1" -type f ! -path '*/..*' 2>/dev/null | sort; }
    sig() { files "$1" | while IFS= read -r f; do cat "$f"; done 2>/dev/null | cksum; }
    count() { files "$1" | wc -l | tr -d ' '; }

    apply_logins() {
      # A missing or unreadable file gives an empty one: no login works, so nothing is allowed.
      cat "$src_passwd/passwd" > "$live/passwd.new" 2>/dev/null || : > "$live/passwd.new"
      chmod 0400 "$live/passwd.new"
      mv -f "$live/passwd.new" "$live/passwd"
    }

    # Joins the box files into the staged file, each ending its own line. With "base", only the fixed
    # `_none.conf` (squid-boxes-base): no box allowed.
    stage() {
      if [ "${1:-}" = base ]; then
        cat "$src_boxes/_none.conf" > "$live/boxes.conf.new" 2>/dev/null || : > "$live/boxes.conf.new"
      else
        # Only the .conf files: a box's .list files are the host lists its .conf names by path, not squid config.
        files "$src_boxes" | grep '\.conf$' | while IFS= read -r f; do cat "$f" && echo || exit 1; done > "$live/boxes.conf.new"
      fi
    }

    # squid's own parse, of its config with the include pointed at the staged file.
    parses() {
      sed "s#$live/boxes.conf#$live/boxes.conf.new#g" "$conf" > "$live/staged.conf" &&
        "$squid" -k parse -f "$live/staged.conf" >/dev/null 2>&1
    }

    go_live() {
      mv -f "$live/boxes.conf.new" "$live/boxes.conf"
    }

    warn() {
      echo "squid-reload: WARN box files failed squid -k parse; kept the last good config (files=$(count "$src_boxes") failing_for=$(($(date +%s) - failing_since))s)"
      warned=$(date +%s)
    }

    mkdir -p "$live"
    # Checksums first, then the copies: a change made while copying is seen as a change on the next check.
    last_logins=$(sig "$src_passwd")
    last_boxes=$(sig "$src_boxes")
    apply_logins
    failing_since=""
    warned=0
    if stage && parses; then
      go_live
      echo "squid-reload: box files ok (files=$(count "$src_boxes"))"
    else
      failing_since=$(date +%s)
      [ -f "$live/boxes.conf" ] || { stage base && go_live; }
      warn
    fi
    "$squid" -N -f "$conf" &
    pid=$!
    echo "squid-reload: squid started (pid $pid); watching the logins and box files every ${poll} s"
    trap 'kill -TERM "$pid" 2>/dev/null; wait "$pid"; exit 0' TERM INT
    while kill -0 "$pid" 2>/dev/null; do
      sleep "$poll" & wait $!
      now=$(sig "$src_passwd")
      if [ "$now" != "$last_logins" ]; then
        apply_logins
        kill -HUP "$pid" && echo "squid-reload: logins changed, applied and reloaded"
        last_logins=$now
      fi
      now=$(sig "$src_boxes")
      if [ "$now" != "$last_boxes" ]; then
        if stage && parses; then
          go_live
          kill -HUP "$pid" && echo "squid-reload: box files changed, parse ok, reloaded (files=$(count "$src_boxes"))"
          failing_since=""
        else
          [ -n "$failing_since" ] || failing_since=$(date +%s)
          warn
        fi
        last_boxes=$now
      elif [ -n "$failing_since" ] && [ $(($(date +%s) - warned)) -ge "$warn_every" ]; then
        warn
      fi
    done
    wait "$pid"; exit $?
kind: ConfigMap
metadata:
  labels:
    app: squid
  name: squid-reload
  namespace: egress-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: squid
  namespace: egress-proxy
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 3128
    protocol: TCP
    targetPort: 3128
  selector:
    app: squid
  sessionAffinity: None
  type: ClusterIP
