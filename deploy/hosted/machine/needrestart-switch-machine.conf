# Switch Cloud machines: restart services that run outdated libraries after an
# update, without asking.
$nrconf{restart} = 'a';
# Never the agent controllers or their agents: restarting them ends agent
# sessions. They pick up the new libraries at the next reboot, which
# switch-machine-reboot.timer makes within seven days.
$nrconf{override_rc}{qr(^switch-agent)} = 0;
$nrconf{override_rc}{qr(^switch-machine-boot)} = 0;
# A newer kernel is switch-machine-reboot's to act on.
$nrconf{kernelhints} = 0;
$nrconf{ucodehints} = 0;
