services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10

  init-db:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint: >
      sh -c "
        until pg_isready -h postgres -U ${DB_USER}; do sleep 1; done
        psql -h postgres -U ${DB_USER} -tc \"SELECT 1 FROM pg_database WHERE datname='mattermost'\" | grep -q 1 ||
          psql -h postgres -U ${DB_USER} -c 'CREATE DATABASE mattermost;'
      "
    depends_on:
      postgres:
        condition: service_healthy

  tuwunel:
    image: jevolk/tuwunel:v1.7.1
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:8008:8008"
    volumes:
      - tuwuneldata:/var/lib/tuwunel
    environment:
      TUWUNEL_SERVER_NAME: localhost
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_PORT: "8008"
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_ALLOW_REGISTRATION: "false"
      TUWUNEL_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET}
      TUWUNEL_MAX_REQUEST_SIZE: "20000000"

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    platform: linux/amd64
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:8065:8065"
    volumes:
      - mmdata:/mattermost/data
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      # Lets the bridge hard-delete (permanent=true) an agent's transient
      # "working on it…" status post instead of soft-deleting it, which would
      # leave a "(message deleted)" tombstone. Requires Mattermost >= v10.2.
      MM_SERVICESETTINGS_ENABLEAPIPOSTDELETION: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      # Both of these exist for Switch Console's embedded room view (CHOO-1674):
      # the onboarding checklist opens a modal over a dimmed page inside the
      # pane, and Mattermost only turns known schemes into links, so without
      # the second the `switchdash://session?…` deeplinks agents post render as
      # unclickable text. Kept in step with the standalone compose.
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_DISPLAYSETTINGS_CUSTOMURLSCHEMES: switchdash
    depends_on:
      init-db:
        condition: service_completed_successfully

  setup:
    build:
      context: .
      dockerfile: deploy/shared_resources/images/Dockerfile.setup
    restart: on-failure
    environment:
      SWITCH_URL: http://host.docker.internal:8000
      MATTERMOST_URL: http://mattermost:8065
      MATTERMOST_URL_FOR_SWITCH: http://localhost:8065
      MATTERMOST_ADMIN_USER: ${MATTERMOST_ADMIN_USER}
      MATTERMOST_ADMIN_PASSWORD: ${MATTERMOST_ADMIN_PASSWORD}
      MATTERMOST_TEAM_NAME: ${MATTERMOST_TEAM_NAME}
      MATTERMOST_USER: ${MATTERMOST_USER}
      MATTERMOST_USER_PASSWORD: ${MATTERMOST_USER_PASSWORD}
      GATEWAY_ADMIN_EMAIL: ${GATEWAY_ADMIN_EMAIL}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
    depends_on:
      - mattermost

volumes:
  pgdata:
  mmdata:
  tuwuneldata:
