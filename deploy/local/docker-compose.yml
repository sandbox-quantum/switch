services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:5432:5432"
    environment:
      # The container's bootstrapped superuser is the SCHEMA OWNER
      # (DB_OWNER_USER), not the runtime role Switch serves requests as
      # (DB_USER). Row-level security is inert against a table's owner, so
      # the role every request authenticates as must be a separate, deliberately
      # unprivileged login — created below by init-db, once the owner is up.
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10

  init-db:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
    # Runs as the owner: creating a database and a role both need privileges
    # the runtime role is deliberately never given. Note the mixed quoting in
    # the CREATE ROLE / ALTER ROLE statements is not optional — DB_USER is an
    # identifier (double-quoted, and safe only because .env.example pins it to
    # a fixed, non-attacker-controlled name) and the password is a string
    # literal (single-quoted); swapping them would either fail to parse or
    # quietly create a role named after the password.
    #
    # No GRANT here on purpose: on a fresh volume there is nothing yet to
    # grant. The `switch` database has no tables until switch-core runs
    # Alembic against the owner connection, so the runtime role's CRUD grants
    # are issued by switch-core itself at boot, immediately after migrating —
    # see db/runtime_role.py. This step only has to make the role exist.
    entrypoint: >
      sh -c "
        until pg_isready -h postgres -U ${DB_OWNER_USER}; do sleep 1; done
        psql -h postgres -U ${DB_OWNER_USER} -tc \"SELECT 1 FROM pg_database WHERE datname='mattermost'\" | grep -q 1 ||
          psql -h postgres -U ${DB_OWNER_USER} -c 'CREATE DATABASE mattermost;'
        psql -h postgres -U ${DB_OWNER_USER} -tc \"SELECT 1 FROM pg_roles WHERE rolname='${DB_USER}'\" | grep -q 1 ||
          psql -h postgres -U ${DB_OWNER_USER} -c 'CREATE ROLE \"${DB_USER}\" LOGIN PASSWORD '\\''${DB_PASSWORD}'\\'' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;'
        psql -h postgres -U ${DB_OWNER_USER} -c 'ALTER ROLE \"${DB_USER}\" PASSWORD '\\''${DB_PASSWORD}'\\'';'
      "
    depends_on:
      postgres:
        condition: service_healthy

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    platform: linux/amd64
    # It calls back to switch-core on the host for button presses; see `setup`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:8065:8065"
    volumes:
      - mmdata:/mattermost/data
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      # The owner's credentials, not the runtime role's: init-db creates the
      # `mattermost` database as the owner, and the runtime role (DB_USER)
      # neither owns it nor was granted anything on it — only `switch`'s
      # tables get the runtime role's grants, issued by switch-core itself at
      # boot. Mattermost's own schema has no row-level security in it, so
      # there is no isolation reason to run it as the restricted role too.
      MM_SQLSETTINGS_DATASOURCE: postgres://${DB_OWNER_USER}:${DB_OWNER_PASSWORD}@postgres:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      # Mattermost refuses to call a private address from an integration unless
      # the host is named here, and a button on a Switch card is delivered by
      # exactly that path. switch-core runs on the host in this compose, not as
      # a service, so what Mattermost has to be allowed to reach is the host.
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: host.docker.internal
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_TEAMSETTINGS_TEAMMATENAMEDISPLAY: "full_name"
      # Both of these exist for Switch Console's embedded room view (CHOO-1674):
      # the onboarding checklist opens a modal over a dimmed page inside the
      # pane, and Mattermost only turns known schemes into links, so without
      # the second the `switchdash://session?…` deeplinks agents post render as
      # unclickable text. Kept in step with the standalone compose.
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_DISPLAYSETTINGS_CUSTOMURLSCHEMES: switchdash
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      MM_LOGSETTINGS_ENABLESENTRY: "false"
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"
      MM_ANNOUNCEMENTSETTINGS_ADMINNOTICESENABLED: "false"
      MM_ANNOUNCEMENTSETTINGS_USERNOTICESENABLED: "false"
      MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE: "false"
    depends_on:
      init-db:
        condition: service_completed_successfully

  setup:
    build:
      context: .
      dockerfile: deploy/shared_resources/images/Dockerfile.setup
    restart: on-failure
    # Docker Desktop and OrbStack define host.docker.internal; Linux Docker
    # (a CI runner) only does when asked.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SWITCH_URL: http://host.docker.internal:8000
      MATTERMOST_URL: http://mattermost:8065
      MATTERMOST_URL_FOR_SWITCH: http://localhost:8065
      # The route back: where the Mattermost container reaches switch-core's
      # callback port, for the button presses Mattermost delivers by HTTP.
      # switch-core runs on the host in this compose, not as a service.
      MATTERMOST_CALLBACK_BASE_URL: http://host.docker.internal:8081
      MATTERMOST_ADMIN_USER: ${MATTERMOST_ADMIN_USER}
      MATTERMOST_ADMIN_PASSWORD: ${MATTERMOST_ADMIN_PASSWORD}
      MATTERMOST_TEAM_NAME: ${MATTERMOST_TEAM_NAME}
      MATTERMOST_USER: ${MATTERMOST_USER}
      MATTERMOST_USER_PASSWORD: ${MATTERMOST_USER_PASSWORD}
      GATEWAY_ADMIN_EMAIL: ${GATEWAY_ADMIN_EMAIL}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
    depends_on:
      - mattermost

  # A mail catcher for invitation e-mails, started by `just local-cloud` only
  # (the `mail` profile keeps it out of `just up`). It accepts anything on
  # 1025 and shows it at http://localhost:8025; nothing is delivered onwards.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:1025:1025"
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:8025:8025"

  # ── Decision service (auto-route) ───────────────────────────────────────────
  # `just decision-up`, or `--profile decision` (CPU, any machine) or
  # `--profile decision-gpu` (Linux with an NVIDIA GPU and the NVIDIA Container
  # Toolkit). Either starts the decision service on :8230 and a llama.cpp
  # server for its model, with the weights downloaded once into the
  # `decision-models` volume. switch-core runs on the host, so point it at the
  # service in .env (see .env.example, "Decision routing"):
  #   DECISION_ENDPOINT_URL=http://localhost:8230
  #   DECISION_TIMEOUT_SECONDS=30
  # On CPU each decision takes several seconds (far over the one-second target
  # a GPU meets), hence the longer timeout; fine for trying auto-route out.
  decision-model-download:
    image: curlimages/curl:8.11.1
    profiles: ["decision", "decision-gpu"]
    # The fresh named volume is root's.
    user: "0:0"
    environment:
      MODEL_URL: ${DECISION_MODEL_URL:-https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf}
      MODEL_FILE: ${DECISION_MODEL_FILE:-Qwen3.5-4B-Q4_K_M.gguf}
      # Only for a gated model (one whose licence your Hugging Face account
      # has accepted).
      HF_TOKEN: ${HF_TOKEN:-}
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        target="/models/$$MODEL_FILE"
        if [ -s "$$target" ]; then echo "have $$MODEL_FILE"; exit 0; fi
        echo "downloading $$MODEL_URL"
        set -- -fsSL --retry 5 --retry-delay 10 -C - -o "$$target.partial"
        if [ -n "$$HF_TOKEN" ]; then set -- "$$@" -H "Authorization: Bearer $$HF_TOKEN"; fi
        curl "$$@" "$$MODEL_URL"
        mv "$$target.partial" "$$target"
    volumes:
      - decision-models:/models

  decision-model:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["decision"]
    command:
      - -m
      - /models/${DECISION_MODEL_FILE:-Qwen3.5-4B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8300"
      - -c
      - "16384"
      - -np
      - "4"
      - --jinja
    volumes:
      - decision-models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8300/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      decision-model-download:
        condition: service_completed_successfully

  decision-model-gpu:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["decision-gpu"]
    command:
      - -m
      - /models/${DECISION_MODEL_FILE:-Qwen3.5-4B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8300"
      - -ngl
      - "99"
      - -c
      - "16384"
      - -np
      - "4"
      - --jinja
    # The decision service reaches whichever model server runs at one name.
    networks:
      default:
        aliases: [decision-model]
    volumes:
      - decision-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8300/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      decision-model-download:
        condition: service_completed_successfully

  decision:
    build:
      context: decision
      dockerfile: Dockerfile
    image: switch-decision:local
    profiles: ["decision", "decision-gpu"]
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:${DECISION_PORT:-8230}:8230"
    environment:
      DECISION_BACKEND: llamacpp
      DECISION_MODEL: ${DECISION_MODEL:-qwen3.5-4b-q4_k_m}
      LLAMACPP_URL: http://decision-model:8300
      # A CPU decision takes seconds; the service's own model-server timeout.
      DECISION_TIMEOUT_S: "60"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8230/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      decision-model:
        condition: service_healthy
        required: false
      decision-model-gpu:
        condition: service_healthy
        required: false

volumes:
  pgdata:
  mmdata:
  decision-models:
