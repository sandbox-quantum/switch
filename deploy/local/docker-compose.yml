services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:5432:5432"
    environment:
      # The container's bootstrapped superuser is the SCHEMA OWNER
      # (DB_OWNER_USER), not the runtime role Switch serves requests as
      # (DB_USER). Row-level security is inert against a table's owner, so
      # the role every request authenticates as must be a separate, deliberately
      # unprivileged login — created below by init-db, once the owner is up.
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10

  init-db:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
    # Runs as the owner: creating a database and a role both need privileges
    # the runtime role is deliberately never given. Note the mixed quoting in
    # the CREATE ROLE / ALTER ROLE statements is not optional — DB_USER is an
    # identifier (double-quoted, and safe only because .env.example pins it to
    # a fixed, non-attacker-controlled name) and the password is a string
    # literal (single-quoted); swapping them would either fail to parse or
    # quietly create a role named after the password.
    #
    # No GRANT here on purpose: on a fresh volume there is nothing yet to
    # grant. The `switch` database has no tables until switch-core runs
    # Alembic against the owner connection, so the runtime role's CRUD grants
    # are issued by switch-core itself at boot, immediately after migrating —
    # see db/runtime_role.py. This step only has to make the role exist.
    entrypoint: >
      sh -c "
        until pg_isready -h postgres -U ${DB_OWNER_USER}; do sleep 1; done
        psql -h postgres -U ${DB_OWNER_USER} -tc \"SELECT 1 FROM pg_database WHERE datname='mattermost'\" | grep -q 1 ||
          psql -h postgres -U ${DB_OWNER_USER} -c 'CREATE DATABASE mattermost;'
        psql -h postgres -U ${DB_OWNER_USER} -tc \"SELECT 1 FROM pg_roles WHERE rolname='${DB_USER}'\" | grep -q 1 ||
          psql -h postgres -U ${DB_OWNER_USER} -c 'CREATE ROLE \"${DB_USER}\" LOGIN PASSWORD '\\''${DB_PASSWORD}'\\'' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;'
        psql -h postgres -U ${DB_OWNER_USER} -c 'ALTER ROLE \"${DB_USER}\" PASSWORD '\\''${DB_PASSWORD}'\\'';'
      "
    depends_on:
      postgres:
        condition: service_healthy

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    platform: linux/amd64
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:8065:8065"
    volumes:
      - mmdata:/mattermost/data
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      # The owner's credentials, not the runtime role's: init-db creates the
      # `mattermost` database as the owner, and the runtime role (DB_USER)
      # neither owns it nor was granted anything on it — only `switch`'s
      # tables get the runtime role's grants, issued by switch-core itself at
      # boot. Mattermost's own schema has no row-level security in it, so
      # there is no isolation reason to run it as the restricted role too.
      MM_SQLSETTINGS_DATASOURCE: postgres://${DB_OWNER_USER}:${DB_OWNER_PASSWORD}@postgres:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_TEAMSETTINGS_TEAMMATENAMEDISPLAY: "full_name"
      # Both of these exist for Switch Console's embedded room view (CHOO-1674):
      # the onboarding checklist opens a modal over a dimmed page inside the
      # pane, and Mattermost only turns known schemes into links, so without
      # the second the `switchdash://session?…` deeplinks agents post render as
      # unclickable text. Kept in step with the standalone compose.
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_DISPLAYSETTINGS_CUSTOMURLSCHEMES: switchdash
    depends_on:
      init-db:
        condition: service_completed_successfully

  setup:
    build:
      context: .
      dockerfile: deploy/shared_resources/images/Dockerfile.setup
    restart: on-failure
    environment:
      SWITCH_URL: http://host.docker.internal:8000
      MATTERMOST_URL: http://mattermost:8065
      MATTERMOST_URL_FOR_SWITCH: http://localhost:8065
      MATTERMOST_ADMIN_USER: ${MATTERMOST_ADMIN_USER}
      MATTERMOST_ADMIN_PASSWORD: ${MATTERMOST_ADMIN_PASSWORD}
      MATTERMOST_TEAM_NAME: ${MATTERMOST_TEAM_NAME}
      MATTERMOST_USER: ${MATTERMOST_USER}
      MATTERMOST_USER_PASSWORD: ${MATTERMOST_USER_PASSWORD}
      GATEWAY_ADMIN_EMAIL: ${GATEWAY_ADMIN_EMAIL}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
    depends_on:
      - mattermost

volumes:
  pgdata:
  mmdata:
