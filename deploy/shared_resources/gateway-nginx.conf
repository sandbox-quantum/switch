server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    location = /gateway/provider-connections/github/callback {
        access_log off;
        proxy_pass http://switch:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The signed-in user's change socket (core gateway/changes.py): a WebSocket,
    # so the upgrade headers are passed on, and an idle socket is kept for as
    # long as its pings keep it alive.
    location = /gateway/changes/ws {
        proxy_pass http://switch:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    location /gateway {
        proxy_pass http://switch:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
