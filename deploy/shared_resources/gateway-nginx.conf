server {
    listen 3000;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /gateway/provider-connections/github/callback {
        access_log off;
        proxy_pass http://switch:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The signed-in user's change socket (core gateway/changes.py): a WebSocket,
    # so the upgrade headers are passed on, and an idle socket is kept for as
    # long as its pings keep it alive.
    location = /gateway/changes/ws {
        proxy_pass http://switch:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    location /gateway {
        proxy_pass http://switch:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The dashboard's own files: scripts and connections only to this origin,
    # styles inline (MUI writes them at runtime), images from anywhere over HTTPS
    # (vendors host connector logos and agent icons), no framing, no type
    # sniffing, and no Referer to other sites. What /gateway answers keeps
    # switch-core's own headers.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
