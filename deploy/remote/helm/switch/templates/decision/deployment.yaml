{{- if .Values.decision.enabled }}
{{- $d := .Values.decision }}
{{- $ms := $d.modelServer }}
{{- $kind := "" }}
{{- if $ms.enabled }}
{{- $kind = include "switch.decisionModelServerKind" . }}
{{- end }}
{{- $backend := include "switch.decisionBackend" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switch.decisionHost" . }}
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.decisionSelectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  # One GPU and a ReadWriteOnce weights volume: the old pod lets go of both
  # before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "switch.decisionSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switch.labels" . | nindent 8 }}
        {{- include "switch.decisionSelectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      {{- include "switch.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "switch.decisionHost" . }}
      securityContext:
        # The decision images' user; the model server or the downloader writes
        # the weights as it.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with $d.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $kind "llamacpp" }}
      {{- $llama := $ms.llamacpp }}
      initContainers:
        # Downloads the weights into the volume unless they are already there
        # and pass their checksum, resuming a download a restart interrupted.
        # A file that fails the checksum is deleted: one already on the volume
        # is downloaded again at once; a fresh download that fails exits
        # non-zero, and the next start downloads it again.
        - name: download-model
          image: {{ $llama.model.downloaderImage }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              target="/models/$MODEL_FILE"
              verify() {
                [ -z "$MODEL_SHA256" ] || echo "$MODEL_SHA256  $target" | sha256sum -c -
              }
              if [ -s "$target" ]; then
                if verify; then
                  echo "have $MODEL_FILE"
                  exit 0
                fi
                echo "$MODEL_FILE on the volume fails its checksum; deleting it and downloading it again" >&2
                rm -f "$target"
              fi
              echo "downloading $MODEL_URL"
              set -- -fsSL --retry 5 --retry-delay 10 -C - -o "$target.partial"
              if [ -n "${HF_TOKEN:-}" ]; then
                set -- "$@" -H "Authorization: Bearer $HF_TOKEN"
              fi
              curl "$@" "$MODEL_URL"
              mv "$target.partial" "$target"
              if ! verify; then
                echo "the downloaded $MODEL_FILE fails its checksum; deleted it, so the next start downloads it again" >&2
                rm -f "$target"
                exit 1
              fi
          env:
            - name: MODEL_URL
              value: {{ required "decision.modelServer.llamacpp.model.url is required" $llama.model.url | quote }}
            - name: MODEL_FILE
              value: {{ include "switch.decisionModelFile" . | quote }}
            - name: MODEL_SHA256
              value: {{ $llama.model.sha256 | quote }}
            {{- with include "switch.decisionHfToken" . }}
            {{- . | trim | nindent 12 }}
            {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: weights
              mountPath: /models
      {{- end }}
      containers:
        - name: decision
          image: {{ include "switch.image" (dict "global" .Values.global "image" $d.image) }}
          imagePullPolicy: {{ include "switch.imagePullPolicy" (dict "policy" $d.imagePullPolicy "image" $d.image) }}
          ports:
            - name: http
              containerPort: {{ $d.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $d.port | quote }}
            {{- include "switch.decisionTokenEnv" (dict "root" $ "name" "DECISION_SERVICE_TOKEN") | nindent 12 }}
            - name: DECISION_BACKEND
              value: {{ $backend | quote }}
            {{- with include "switch.decisionModel" . }}
            - name: DECISION_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if $kind }}
            # Sent to the model server beside it, which refuses everything but
            # /health without it.
            {{- include "switch.decisionTokenEnv" (dict "root" $ "name" "MODEL_SERVER_TOKEN") | nindent 12 }}
            {{- end }}
            {{- if eq $kind "strands" }}
            - name: SYSTEMONE_URL
              value: "http://127.0.0.1:{{ $ms.strands.port }}/v1/systemone"
            {{- else if eq $kind "llamacpp" }}
            - name: LLAMACPP_URL
              value: "http://127.0.0.1:{{ $ms.llamacpp.port }}"
            {{- end }}
            {{- with $d.confidenceThreshold }}
            - name: DECISION_CONFIDENCE_THRESHOLD
              value: {{ . | quote }}
            {{- end }}
            - name: DECISION_BEDROCK_ENABLED
              value: {{ ternary "1" "0" $d.bedrock.enabled | quote }}
            {{- with $d.bedrock.model }}
            - name: DECISION_BEDROCK_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with $d.bedrock.region }}
            - name: AWS_REGION
              value: {{ . | quote }}
            {{- end }}
            # Logs follow switch-core's settings (switchCore.logging and
            # switchCore.observability), under their own service name. Logs
            # only: the service exports no metrics; switch-core measures
            # decisions.
            - name: LOG_FORMAT
              value: {{ .Values.switchCore.logging.format | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.switchCore.logging.rootLevel | quote }}
            - name: SERVICE_NAME
              value: "switch-decision"
            {{- with .Values.switchCore.logging.environment }}
            - name: ENVIRONMENT
              value: {{ . | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with include "switch.otlpEnv" (dict "root" $ "metrics" false) }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            # Last, so an entry here replaces any of the above.
            {{- with $d.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /health is 503 while the model server is down or still loading, so
          # the Service sends nothing to a pod that cannot answer.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Not /health: a model server still loading is no reason to restart
          # this container.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $d.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if eq $kind "strands" }}
        {{- $st := $ms.strands }}
        - name: model-server
          image: {{ include "switch.image" (dict "global" .Values.global "image" $st.image) }}
          imagePullPolicy: {{ include "switch.imagePullPolicy" (dict "policy" $st.imagePullPolicy "image" $st.image) }}
          env:
            - name: STRANDS_CHECKPOINT
              value: {{ required "decision.modelServer.strands.checkpoint is required" $st.checkpoint | quote }}
            - name: STRANDS_REVISION
              value: {{ required "decision.modelServer.strands.revision is required: the checkpoint's commit on Hugging Face" $st.revision | quote }}
            - name: STRANDS_BASE_REVISION
              value: {{ required "decision.modelServer.strands.baseRevision is required: the base model's commit the checkpoint records" $st.baseRevision | quote }}
            - name: STRANDS_MODEL_NAME
              value: {{ required "decision.modelServer.strands.modelName is required" $st.modelName | quote }}
            - name: STRANDS_PORT
              value: {{ $st.port | quote }}
            # Every request but /health needs it; the decision container sends it.
            {{- include "switch.decisionTokenEnv" (dict "root" $ "name" "STRANDS_API_KEY") | nindent 12 }}
            {{- with include "switch.decisionHfToken" . }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            {{- with $st.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: model
              containerPort: {{ $st.port }}
              protocol: TCP
          # The port opens only once the checkpoint is downloaded (first start)
          # and loaded, which takes minutes.
          startupProbe:
            httpGet:
              path: /health
              port: model
            periodSeconds: {{ $st.startupProbe.periodSeconds }}
            failureThreshold: {{ $st.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: model
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $st.resources | nindent 12 }}
          # Hugging Face's cache (HF_HOME): written on the first start.
          volumeMounts:
            - name: weights
              mountPath: /models
        {{- else if eq $kind "llamacpp" }}
        {{- $llama := $ms.llamacpp }}
        - name: model-server
          image: {{ $llama.image }}
          imagePullPolicy: {{ $llama.imagePullPolicy }}
          {{- with $llama.args }}
          args:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: MODEL_PATH
              value: "/models/{{ include "switch.decisionModelFile" . }}"
            # llama-server's --api-key: every request but /health needs it; the
            # decision container sends it.
            {{- include "switch.decisionTokenEnv" (dict "root" $ "name" "LLAMA_API_KEY") | nindent 12 }}
          ports:
            - name: model
              containerPort: {{ $llama.port }}
              protocol: TCP
          # llama.cpp's /health is 503 until the model is loaded.
          startupProbe:
            httpGet:
              path: /health
              port: model
            periodSeconds: {{ $llama.startupProbe.periodSeconds }}
            failureThreshold: {{ $llama.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: model
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $llama.resources | nindent 12 }}
          volumeMounts:
            - name: weights
              mountPath: /models
              readOnly: true
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $ms.enabled }}
        - name: weights
          persistentVolumeClaim:
            claimName: {{ include "switch.decisionHost" . }}-weights
        {{- end }}
{{- end }}
