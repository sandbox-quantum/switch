{{- if and .Values.decision.enabled (not .Values.decision.token.existingSecret) }}
{{- $name := include "switch.decisionTokenSecret" . }}
{{- $key := .Values.decision.token.existingSecretKey }}
{{- $stored := lookup "v1" "Secret" .Release.Namespace $name }}
# The bearer token the decision service requires (DECISION_SERVICE_TOKEN) and
# switch-core sends (DECISION_API_KEY), so nothing else in the cluster can use
# the service even where the NetworkPolicy isn't enforced. Generated on the
# first install and kept on every upgrade: `lookup` reads the stored one back.
# `helm template` can't read the cluster and renders a fresh value each time.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.decisionSelectorLabels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $stored $stored.data (hasKey $stored.data $key) }}
  {{ $key }}: {{ index $stored.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
