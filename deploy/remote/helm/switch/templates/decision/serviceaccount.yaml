{{- if .Values.decision.enabled }}
# Its own account, so an IAM role for Bedrock (decision.serviceAccount
# .annotations) is given to the decision pod and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "switch.decisionHost" . }}
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.decisionSelectorLabels" . | nindent 4 }}
  {{- with .Values.decision.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
