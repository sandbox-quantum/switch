{{- if and .Values.networkPolicy.enabled (eq .Values.postgresql.mode "managed") }}
# Only this release's switch-core, Mattermost and migration Jobs reach the
# in-cluster Postgres, and only on its port: no other pod in the namespace or
# the cluster. Egress is left open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "switch.fullname" . }}-postgresql
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "switch.selectorLabels" (dict "Release" .Release "component" "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- $clients := list "switch-core" "create-runtime-role" }}
        {{- if .Values.switchCore.migrations.preUpgradeJob }}
        {{- $clients = append $clients "migrate" }}
        {{- end }}
        {{- if .Values.mattermost.enabled }}
        {{- $clients = append $clients "mattermost" }}
        {{- end }}
        {{- range $clients }}
        - podSelector:
            matchLabels:
              {{- include "switch.selectorLabels" (dict "Release" $.Release "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
