{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.ingressFrom }}
{{- $core := .Values.switchCore }}
# switch-core's ports admit networkPolicy.ingressFrom, and the release's own
# pods that call it: the gateway and the setup Job on the API, the bundled
# Mattermost on the callback port, the Teams test on the Teams port. Rendered
# only once ingressFrom names who reaches switch-core from outside (see
# networkPolicy in values.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "switch.fullname" . }}-switch-core
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8000
        {{- if $core.teamsBridge.enabled }}
        - protocol: TCP
          port: {{ $core.teamsBridge.port }}
        {{- end }}
        {{- if $core.collaborationCallback.enabled }}
        - protocol: TCP
          port: {{ $core.collaborationCallback.port }}
        {{- end }}
    - from:
        {{- range (list "gateway" "setup") }}
        - podSelector:
            matchLabels:
              {{- include "switch.selectorLabels" (dict "Release" $.Release "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
    {{- if and $core.collaborationCallback.enabled .Values.mattermost.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "switch.selectorLabels" (dict "Release" .Release "component" "mattermost") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $core.collaborationCallback.port }}
    {{- end }}
    {{- if $core.teamsBridge.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "switch.selectorLabels" (dict "Release" .Release "component" "teams-listener-test") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $core.teamsBridge.port }}
    {{- end }}
{{- end }}
