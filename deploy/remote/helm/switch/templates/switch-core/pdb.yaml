{{- $pdb := .Values.switchCore.podDisruptionBudget }}
{{- if and (gt (int .Values.switchCore.replicaCount) 1) $pdb.enabled }}
# Keeps a node drain or cluster upgrade from evicting every switch-core pod at
# once. A pod evicted here hands its bridges, connectors and readers to the
# pods still running, the same as on a roll.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "switch.fullname" . }}-switch-core
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 4 }}
spec:
  {{- if $pdb.minAvailable }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 6 }}
{{- end }}
