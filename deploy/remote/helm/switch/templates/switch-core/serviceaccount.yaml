{{- if not .Values.switchCore.serviceAccount.name }}
{{- fail "switchCore.serviceAccount.name must be set: switch-core runs as that ServiceAccount, and a cloud IAM binding (e.g. IRSA) trusts it by name." }}
{{- end }}
{{- if .Values.switchCore.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.switchCore.serviceAccount.name }}
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 4 }}
  {{- with .Values.switchCore.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
