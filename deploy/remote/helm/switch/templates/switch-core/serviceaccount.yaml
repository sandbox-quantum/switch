{{- if .Values.switchCore.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "switch.coreServiceAccountName" . }}
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    app.kubernetes.io/component: switch-core
  {{- with .Values.switchCore.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
