{{- if ne (int .Values.switchCore.replicaCount) 1 }}
{{- fail "switchCore.replicaCount must be 1: switch-core keeps live Matrix sync sessions in memory and cannot be horizontally scaled (a second replica would duplicate every client and split session state)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switch.fullname" . }}-switch-core
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 4 }}
spec:
  replicas: {{ .Values.switchCore.replicaCount }}
  # switch-core is a singleton (live Matrix sync + collaboration-bridge sessions
  # in memory). A rolling update would briefly run two pods whose bridge/client
  # sessions collide and leave bridges stuck; Recreate tears the old pod down
  # before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switch.labels" . | nindent 8 }}
        {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      {{- include "switch.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      initContainers:
        {{- include "switch.waitFor" (dict "name" "postgres" "host" (include "switch.postgresHost" .) "port" (include "switch.postgresPort" .)) | nindent 8 }}
      containers:
        - name: switch-core
          image: {{ include "switch.image" (dict "global" .Values.global "image" .Values.switchCore.image) }}
          imagePullPolicy: {{ .Values.switchCore.imagePullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
            {{- if .Values.switchCore.teamsBridge.enabled }}
            - containerPort: {{ .Values.switchCore.teamsBridge.port }}
              name: teams
              protocol: TCP
            {{- end }}
          env:
            {{- include "switch.coreEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.switchCore.resources | nindent 12 }}
