{{- if ne (int .Values.switchCore.replicaCount) 1 }}
{{- fail "switchCore.replicaCount must be 1: switch-core keeps in-process state that cannot be horizontally scaled — the event buffer, the invite bus, the presence bus, the message-listener subscriber registry, and live collaboration-bridge connections. A second replica would hold its own copy of each, so signals raised in one would never reach clients attached to the other." }}
{{- end }}
{{- include "switch.validateDbTls" . }}
{{- include "switch.validateLogging" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switch.fullname" . }}-switch-core
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 4 }}
spec:
  replicas: {{ .Values.switchCore.replicaCount }}
  # switch-core is a singleton (in-process buses + live collaboration-bridge
  # connections in memory; see the replicaCount guard above). A rolling update
  # would briefly run two pods whose bridge/client sessions collide and leave
  # bridges stuck; Recreate tears the old pod down before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switch.labels" . | nindent 8 }}
        {{- include "switch.selectorLabels" (dict "Release" .Release "component" "switch-core") | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      {{- include "switch.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      initContainers:
        {{- include "switch.waitFor" (dict "name" "postgres" "host" (include "switch.postgresHost" .) "port" (include "switch.postgresPort" .)) | nindent 8 }}
      containers:
        - name: switch-core
          image: {{ include "switch.image" (dict "global" .Values.global "image" .Values.switchCore.image) }}
          imagePullPolicy: {{ .Values.switchCore.imagePullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
            {{- if .Values.switchCore.teamsBridge.enabled }}
            - containerPort: {{ .Values.switchCore.teamsBridge.port }}
              name: teams
              protocol: TCP
            {{- end }}
          env:
            {{- include "switch.coreEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.switchCore.resources | nindent 12 }}
          {{- if include "switch.dbCaBundleConfigMap" . }}
          volumeMounts:
            {{- include "switch.dbCaBundleVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if include "switch.dbCaBundleConfigMap" . }}
      volumes:
        {{- include "switch.dbCaBundleVolume" . | nindent 8 }}
      {{- end }}
