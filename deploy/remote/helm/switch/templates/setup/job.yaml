{{- if .Values.mattermost.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "switch.fullname" . }}-setup
  labels:
    {{- include "switch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.setup.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "switch.labels" . | nindent 8 }}
        {{- include "switch.selectorLabels" (dict "Release" .Release "component" "setup") | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      {{- include "switch.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      restartPolicy: OnFailure
      initContainers:
        {{- include "switch.waitForHttp" (dict "name" "switch-core" "url" (printf "http://%s:%v/health" (include "switch.switchCoreHost" .) (.Values.switchCore.service.port | toString))) | nindent 8 }}
        {{- include "switch.waitForHttp" (dict "name" "mattermost" "url" (printf "http://%s:%v/api/v4/system/ping" (include "switch.mattermostHost" .) (.Values.mattermost.service.port | toString))) | nindent 8 }}
      containers:
        - name: setup
          image: {{ include "switch.image" (dict "global" .Values.global "image" .Values.setup.image) }}
          imagePullPolicy: {{ .Values.setup.imagePullPolicy }}
          env:
            - name: SWITCH_URL
              value: "http://{{ include "switch.switchCoreHost" . }}:{{ .Values.switchCore.service.port }}"
            - name: MATTERMOST_URL
              value: "http://{{ include "switch.mattermostHost" . }}:{{ .Values.mattermost.service.port }}"
            - name: MATTERMOST_URL_FOR_SWITCH
              value: "http://{{ include "switch.mattermostHost" . }}:{{ .Values.mattermost.service.port }}"
            {{- if .Values.mattermost.publicUrl }}
            - name: MATTERMOST_PUBLIC_URL
              value: {{ .Values.mattermost.publicUrl | quote }}
            {{- end }}
            - name: MATTERMOST_ADMIN_USER
              value: {{ .Values.mattermost.adminUser | quote }}
            - name: MATTERMOST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "switch.secretName" . }}
                  key: MATTERMOST_ADMIN_PASSWORD
            - name: MATTERMOST_TEAM_NAME
              value: {{ .Values.mattermost.teamName | quote }}
            - name: MATTERMOST_USER
              value: {{ .Values.mattermost.regularUser | quote }}
            - name: MATTERMOST_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "switch.secretName" . }}
                  key: MATTERMOST_USER_PASSWORD
            - name: GATEWAY_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "switch.secretName" . }}
                  key: GATEWAY_ADMIN_EMAIL
            - name: GATEWAY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "switch.secretName" . }}
                  key: GATEWAY_ADMIN_PASSWORD
{{- end }}
