{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switch.fullname" . }}-gateway-nginx
  labels:
    {{- include "switch.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 3000;

        root /usr/share/nginx/html;
        index index.html;

        location = /gateway/provider-connections/github/callback {
            access_log off;
            proxy_pass http://{{ include "switch.switchCoreHost" . }}:{{ .Values.switchCore.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # The signed-in user's change socket (core gateway/changes.py): a WebSocket,
        # so the upgrade headers are passed on, and an idle socket is kept for as
        # long as its pings keep it alive.
        location = /gateway/changes/ws {
            proxy_pass http://{{ include "switch.switchCoreHost" . }}:{{ .Values.switchCore.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 1h;
        }

        location /gateway {
            proxy_pass http://{{ include "switch.switchCoreHost" . }}:{{ .Values.switchCore.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Built files carry a hash of their contents in their names, so a browser
        # may keep them for good. A missing one is a 404, never index.html: a
        # browser holding an older index.html would try to run that as a script
        # and show a blank page.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html names the current release's assets, so a browser checks for
        # a newer one on every load instead of keeping the last release's.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
