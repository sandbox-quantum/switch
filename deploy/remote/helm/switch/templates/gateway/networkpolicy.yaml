{{- if and .Values.gateway.enabled .Values.networkPolicy.enabled .Values.networkPolicy.ingressFrom }}
# The dashboard's port admits only networkPolicy.ingressFrom. Rendered only
# once that names who reaches it (see networkPolicy in values.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "switch.fullname" . }}-gateway
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "switch.selectorLabels" (dict "Release" .Release "component" "gateway") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
