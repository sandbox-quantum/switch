{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switch.fullname" . }}-gateway
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "switch.selectorLabels" (dict "Release" .Release "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switch.labels" . | nindent 8 }}
        {{- include "switch.selectorLabels" (dict "Release" .Release "component" "gateway") | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      {{- include "switch.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.gateway.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "switch.waitForHttp" (dict "name" "switch-core" "url" (printf "http://%s:%v/health" (include "switch.switchCoreHost" .) (.Values.switchCore.service.port | toString))) | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "switch.image" (dict "global" .Values.global "image" .Values.gateway.image) }}
          imagePullPolicy: {{ include "switch.imagePullPolicy" (dict "policy" .Values.gateway.imagePullPolicy "image" .Values.gateway.image) }}
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            {{- toYaml .Values.gateway.securityContext | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # The root filesystem is read-only: nginx's temporary files and
            # its pid file (/tmp/nginx.pid in the image) go here.
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          {{- include "switch.preStopDrain" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ include "switch.fullname" . }}-gateway-nginx
{{- end }}
