# ── Global ────────────────────────────────────────────────────────────────────
global:
  # StorageClass for all PVCs. Empty ("") uses the cluster's default
  # StorageClass — the portable choice. Set it explicitly (e.g. "gp2" on EKS,
  # "standard-rwo" on GKE) only if your cluster has no default or you need a
  # specific class.
  storageClass: ""
  imageRegistry: ""
  # Names of pre-existing dockerconfigjson Secrets used to pull images from a
  # private registry (e.g. a private GHCR namespace). Applied to every pod. Leave
  # empty for public images.
  imagePullSecrets: []

# ── Ingress ─────────────────────────────────────────────────────────────────
# Generic Ingress for the web surface. Bring your own ingress controller
# (ingress-nginx, Traefik, cloud ALB/GLB, …).
#
#   mode: existing  -> render nothing; wire up the services with your own
#                      manifest. See samples/ingress.example.yaml.
#   mode: managed   -> render one path-routed Ingress: the agent/MCP surface and
#                      bridge webhooks (agentApiPaths) go to switch-core, and /
#                      goes to the gateway SPA. Supply className/host, and tls
#                      for HTTPS (e.g. with a cert-manager annotation).
ingress:
  mode: existing
  className: ""
  host: ""
  # Extra annotations, merged over the streaming defaults below (yours win).
  # For cert-manager TLS, add e.g.:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  # Emit ingress-nginx annotations that keep MCP/SSE streams alive (long read
  # timeouts, buffering off). Harmless on other controllers but ignored by them
  # — set false and add your controller's equivalents via annotations.
  streamingAnnotations: true
  tls:
    enabled: false
    # Secret holding the cert; cert-manager creates it from the annotation
    # above, or reference a pre-created TLS Secret.
    secretName: ""
  # Path prefixes on the primary host routed to switch-core instead of the
  # gateway: the Bearer-auth agent bridge + MCP, and public OAuth/MCP discovery.
  agentApiPaths:
    - /agents
    - /mcp
    - /oauth
    - /.well-known
    - /health
  # Path prefixes served by the Teams bridge listener rather than the FastAPI
  # app, because that listener is a separate HTTP server on its own port. Used
  # by both switchCore.teamsBridge.ingress modes "shared" and "dedicated".
  # Graph rejects a subscription whose notification URL does not answer its
  # validation handshake over valid TLS within 10 seconds, so wherever these are
  # served must be publicly reachable — not Tailscale- or VPN-only.
  teamsPaths:
    - /api/messages
    - /api/teams/notifications

# ── Secrets ───────────────────────────────────────────────────────────────────
# Two ways to supply secrets:
#
# 1. Chart-managed (default): set the values below (via --set / a values file)
#    and the chart renders a Secret named <release>-secrets.
#
# 2. Bring your own (existingSecret): point the chart at a pre-existing Secret —
#    e.g. one produced by the External Secrets Operator or sealed-secrets. The
#    chart then renders no Secret and the values below are ignored. That Secret
#    must contain these keys:
#      POSTGRES_PASSWORD (unless postgresql.existingSecret is set),
#      MATRIX_REGISTRATION_SHARED_SECRET, MATRIX_ADMIN_PASSWORD,
#      AGENT_REGISTRATION_TOKEN, JWT_SECRET_KEY, GATEWAY_ADMIN_EMAIL,
#      GATEWAY_ADMIN_PASSWORD,
#      MATTERMOST_ADMIN_PASSWORD + MATTERMOST_USER_PASSWORD (if mattermost.enabled),
#      GATEWAY_OIDC_CLIENT_SECRET (if switchCore.oidc.enabled).
secrets:
  # Name of a pre-existing Secret to read all of the above from. Empty = the
  # chart manages its own Secret from the values below.
  existingSecret: ""
  postgresPassword: ""
  matrixRegistrationSharedSecret: ""
  matrixAdminPassword: ""
  agentRegistrationToken: ""
  jwtSecretKey: ""
  gatewayAdminEmail: ""
  gatewayAdminPassword: ""
  mattermostAdminPassword: ""
  mattermostUserPassword: ""
  # Gateway OIDC client secret (required when switchCore.oidc.enabled).
  gatewayOidcClientSecret: ""

# ── Switch Core (FastAPI) ─────────────────────────────────────────────────────
switchCore:
  image: switch-core:latest
  imagePullPolicy: Always
  logLevel: INFO
  # Public base URL the gateway is served on (used for links / OIDC redirects).
  frontendBaseUrl: ""
  # Public origin (scheme + host, no path) of the gateway HTTP API itself, used
  # to build the switchdash:// deeplink HTTP redirect so the "Open in Switch
  # Console" link is clickable on Discord, Telegram and other http-only
  # platforms. Leave empty to
  # post the raw switchdash:// deeplink.
  gatewayPublicUrl: ""
  # Set the Secure flag on the switch_auth session cookie. True here because the
  # gateway is served over HTTPS (ALB / Tailscale); keep false only for plain-HTTP
  # local dev.
  cookieSecure: true
  # Gateway OIDC login (bring-your-own IdP, e.g. Okta). Disabled by default;
  # set enabled=true and supply issuerUrl/clientId (plus
  # secrets.gatewayOidcClientSecret) to gate the gateway behind OIDC. Provider
  # endpoints are read from the issuer's OIDC discovery document.
  oidc:
    enabled: false
    # OIDC issuer base URL (discovery is read from <issuerUrl>/.well-known/...).
    issuerUrl: ""
    clientId: ""
    scopes: "openid profile email"
    providerLabel: "OIDC"
    # Must exactly match the redirect URI registered with the IdP.
    redirectUrl: ""
    # Set false to disable password login entirely (OIDC-only).
    passwordLoginEnabled: true
  # Bearer-token resolution runs before every authenticated request and agents
  # beat continuously, so a successful resolution is memoised in process for
  # this many seconds. Only successes are cached — an unknown or revoked token
  # always reads the database — and a key rotation or agent deletion drops the
  # entry at once rather than waiting for it to expire. This is therefore the
  # window in which an already-issued credential can outlive its revocation;
  # it must stay under the 6s agent heartbeat TTL, and 0 disables the cache.
  authCache:
    ttlSeconds: 5
  service:
    type: ClusterIP
    port: 8000
  # Microsoft Teams bridge listener. The Teams adapter runs its own HTTP server
  # inside switch-core, separate from the FastAPI app on service.port: Bot
  # Framework activities arrive at /api/messages and Graph change notifications
  # at /api/teams/notifications. Microsoft calls both from the public internet,
  # so both must be reachable over HTTPS. Without that the bridge is
  # outbound-only — it can create channels and post, but receives nothing back
  # and captures no messages.
  #
  # Off by default, and deliberately: Teams bridges are created at runtime in the
  # gateway, not in Helm values, so the chart cannot tell whether you have one.
  # Enable this when you configure a Teams bridge, and set that bridge's
  # public_base_url to the host this is served on.
  teamsBridge:
    enabled: false
    # Listener bind port inside the container; must match the bridge's
    # listen_port (default 3978). One Teams bridge per port.
    port: 3978
    # How Microsoft reaches the two callback paths (ingress.teamsPaths).
    # Required when enabled — publishing the port without routing it is the
    # failure this whole block exists to prevent, so the chart refuses to render
    # rather than let you deploy a bridge that can never receive anything.
    #
    #   dedicated -> the chart renders a second Ingress carrying only those two
    #                paths, with its own host, class, annotations and TLS. Use
    #                this to give Teams a public hostname while the gateway
    #                stays internal: Microsoft needs those two paths and nothing
    #                else, and both authenticate per-request inside the adapter.
    #   shared    -> add the paths to the chart's main Ingress. Requires
    #                ingress.mode=managed, and puts Teams on the same public
    #                host as the gateway.
    #   external  -> the chart renders no route; you add the two paths to your
    #                own Ingress. See samples/ingress.example.yaml.
    ingress:
      mode: ""
      # Used by mode=dedicated only.
      className: ""
      # Public hostname Microsoft resolves, e.g. "teams.switch.example.com".
      # Must match the host in the bridge's public_base_url.
      #
      # Leave empty ONLY when something upstream terminates TLS and owns the
      # public name — a CDN or reverse proxy in front of this Ingress. The rule
      # then carries no host and answers whatever Host header arrives, which is
      # required there: the incoming Host is the proxy's name, and the chart
      # cannot know it. Empty with tls.enabled=true is rejected, because a
      # host-less rule cannot carry a certificate.
      host: ""
      # Annotations for the dedicated Ingress. This is the ONLY source of them:
      # the top-level ingress.annotations are not merged in, so an org-wide
      # annotation set there (a WAF association, cost tags, a policy webhook)
      # does not reach this Ingress and must be repeated here. That separation
      # is deliberate — the main Ingress's streaming annotations suit long-lived
      # MCP/SSE connections and Teams callbacks are short request/response —
      # but it does mean this list is not additive.
      # For cert-manager, add e.g.:
      #   cert-manager.io/cluster-issuer: letsencrypt-prod
      annotations: {}
      tls:
        # Graph only calls an HTTPS URL whose certificate it trusts, so this is
        # on by default. Set false only when TLS terminates upstream and is not
        # expressed in spec.tls — e.g. an AWS ALB configured by annotation. The
        # chart cannot verify that, so it warns instead of failing.
        enabled: true
        # Secret holding the cert; cert-manager creates it from the annotation
        # above, or reference a pre-created TLS Secret.
        secretName: ""
  # switch-core keeps live Matrix sync sessions in memory, so it MUST run as a
  # single replica — a second replica would double every client and split
  # session state. This is enforced at render time; do not raise it.
  replicaCount: 1
  # Run DB migrations (alembic upgrade head) as a pre-upgrade hook Job, before
  # the new pods roll, so a failed migration blocks the upgrade instead of
  # crash-looping the new pods. switch-core also migrates on startup (which
  # covers fresh installs, where pre-upgrade hooks don't run), so the Job is
  # idempotent. Disable only if you run migrations out-of-band.
  migrations:
    preUpgradeJob: true
  # One-off migration steps for the move onto the Postgres message store. Both
  # read the homeserver, so they only work while Tuwunel is still deployed, and
  # both are off by default: they belong to one release, not to every release.
  #
  #   1. enable backfill with dryRun: true, upgrade, read the Job's log
  #   2. set dryRun: false, upgrade again
  #   3. enable reconcile, upgrade, confirm it exits clean
  #   4. set MESSAGE_TRANSPORT=postgres
  #   5. turn both back off
  #
  # Backfill is idempotent and its rows are numbered below the live sequence,
  # so it can be re-run and nobody is redelivered old history.
  backfill:
    enabled: false
    dryRun: true
    # Exit 0 when there is no history to walk. For an install with no rooms
    # yet, where a failed Job would be reporting an empty database as a fault.
    allowEmpty: false
  reconcile:
    enabled: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# ── Gateway (React + nginx) ──────────────────────────────────────────────────
gateway:
  image: gateway:latest
  imagePullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# ── Tuwunel (Matrix homeserver) ───────────────────────────────────────────────
# The internal message bus. switch-core points here. RocksDB-backed (no Postgres
# dependency); data lives on its own PVC.
tuwunel:
  image: jevolk/tuwunel:v1.7.1
  imagePullPolicy: IfNotPresent
  # Every Matrix user id is @localpart:<serverName>, so changing this on an
  # existing deployment orphans all accounts.
  serverName: "switch.local"
  allowFederation: false
  allowRegistration: false
  maxRequestSize: "20000000"
  # Set if the image runs as non-root and can't write the PVC, e.g. {fsGroup: 1000}.
  podSecurityContext: {}
  service:
    type: ClusterIP
    port: 8008
  persistence:
    size: 10Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# ── Mattermost ───────────────────────────────────────────────────────────────
mattermost:
  enabled: true
  # Pinned for reproducibility (floating :latest makes installs non-deterministic
  # and can silently jump major versions). Mattermost does not support
  # downgrades, so bump this deliberately. Requires >= v10.2 (see the API post
  # deletion setting below).
  image: mattermost/mattermost-team-edition:11.8.3
  imagePullPolicy: IfNotPresent
  adminUser: admin
  teamName: switch
  regularUser: user
  siteUrl: ""
  # User-facing Mattermost URL, used to build channel deeplinks (the
  # mattermost:// links surfaced in Switch Console). Distinct from the internal
  # cluster address Switch connects to. Empty → falls back to the internal URL.
  publicUrl: ""
  maxUsersPerTeam: 1000
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8065
  persistence:
    size: 2Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ── Setup Job ─────────────────────────────────────────────────────────────────
setup:
  image: setup:latest
  imagePullPolicy: Always
  backoffLimit: 5

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgresql:
  # managed  -> this chart runs an in-cluster Postgres StatefulSet (below).
  # existing -> bring your own Postgres (RDS / Cloud SQL / Azure / self-run);
  #             the StatefulSet/Service/init are not rendered and Switch
  #             connects to postgresql.external.* instead.
  mode: managed

  # TLS mode for connecting to Postgres, applied to BOTH switch-core (asyncpg)
  # and Mattermost. libpq/asyncpg values: disable | allow | prefer | require |
  # verify-ca | verify-full. Keep "disable" for the in-cluster managed DB;
  # managed cloud databases generally require "require" or stricter.
  sslMode: disable

  # switch-core's SQLAlchemy connection pool. Size this against the number of
  # live agent connections, not human traffic: bearer-token auth hits the
  # database on every authenticated request and each agent connection beats
  # every 2s, so roughly N/2 checkouts per second for N connections. When the
  # pool is exhausted requests queue rather than fail, and a heartbeat delayed
  # past the server's TTL loses its connection — so under-sizing this shows up
  # as fleet-wide agent disconnects, not as database errors.
  # size + maxOverflow must stay under Postgres max_connections, remembering
  # Mattermost and Keycloak share the same instance.
  pool:
    size: 30
    maxOverflow: 10
    # Seconds to wait for a free slot before raising. Deliberately short:
    # SQLAlchemy's 30s default hides starvation as latency.
    timeout: 5

  # Postgres kills a switch-core connection that sits inside an open
  # transaction without executing anything for longer than this (e.g. "15s"),
  # so a leaked checkout becomes a loud, attributable error instead of a slot
  # that never comes back. Empty (the default) leaves it off, and it must stay
  # off until switch-core stops holding transactions across Matrix round trips
  # on the room-membership paths — until then this trades request latency for
  # membership drift: agents invited on Matrix with no row recording it. Set it
  # in staging first. Migrations are unaffected; Alembic does not read it.
  idleInTransactionSessionTimeout: ""

  # Password source. By default the password is read from the chart-managed
  # Secret (secrets.postgresPassword). To source it from a pre-existing Secret
  # instead (e.g. synced by external-secrets / sealed-secrets), set
  # existingSecret to that Secret's name; then secrets.postgresPassword is not
  # required and no POSTGRES_PASSWORD is written into the chart Secret.
  existingSecret: ""
  existingSecretKey: POSTGRES_PASSWORD

  # ── mode: existing ──────────────────────────────────────────────────────────
  # Only used when mode=existing. The `switch` and `mattermost` databases and
  # the user must already exist; the password comes from the Secret above.
  external:
    host: ""
    port: 5432
    username: postgres
    database: switch

  # ── mode: managed ───────────────────────────────────────────────────────────
  image: postgres:16-alpine
  imagePullPolicy: IfNotPresent
  database: switch
  persistence:
    size: 10Gi
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Postgres server parameters, passed as `-c name=value`. Each client
  # connection is a backend process costing several MB of non-reclaimable
  # memory, so raising the pool above without also raising resources.limits
  # .memory trades a connection-pool stall for an OOMKill — size them together.
  # effective_cache_size in particular should track the memory limit rather
  # than being left at the Postgres default, which assumes a far larger host.
  # Example:
  #   parameters:
  #     effective_cache_size: 1536MB
  #     shared_buffers: 256MB
  parameters: {}

# ── Backups ───────────────────────────────────────────────────────────────────
# This chart ships no backup jobs on purpose — an on-cluster backup shares the
# storage backend it is meant to protect, and every target already has stronger,
# portable primitives (CSI VolumeSnapshots, managed-DB backups, Velero). See
# BACKUP.md for what to back up (the Tuwunel volume holds the Matrix signing key
# — the irreplaceable server identity) and how, plus samples/volumesnapshot.example.yaml.
