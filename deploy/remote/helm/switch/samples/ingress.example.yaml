# Sample Ingress for a Switch install running with `ingress.mode=existing`.
#
# The chart renders no Ingress in that mode; apply something like this with your
# own controller instead. Or just set `ingress.mode=managed` and let the chart
# render the equivalent for you (className/host/tls/annotations via values).
#
# Replace:
#   RELEASE   -> your Helm release name (the prefix on the Service names below;
#                run `kubectl get svc` to confirm, e.g. `switch-switch-core`)
#   switch.example.com -> your hostname
#   letsencrypt-prod    -> your cert-manager ClusterIssuer (or drop TLS entirely)
#
# Routing mirrors the managed Ingress: the agent surface goes to
# switch-core; everything else (the gateway SPA, which proxies /gateway to
# switch-core) goes to the gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: switch-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Keep SSE streams alive (ingress-nginx; adjust for your controller).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - switch.example.com
      secretName: switch-web-tls
  rules:
    - host: switch.example.com
      http:
        paths:
          - path: /agents
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          - path: /hosted
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          # Session hosts report session starts, turn activity and approval
          # requests here, and poll for approval answers. Without it a
          # session fails on the HTML the gateway serves instead.
          - path: /agent-sessions
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          - path: /version
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          # The "Open in Switch Console" redirect posted in messaging platforms.
          - path: /deeplink
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          # Agents controllers: enrollment, tokens, assignment, status and
          # their event stream (/v1/management/..., /v1/controllers/...).
          - path: /v1
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          # The distributed Slack app's OAuth callback and event URLs. Needed
          # only if you offer workspace installs; Slack dials these from the
          # internet, so they must be reachable and on a trusted certificate.
          - path: /messaging
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          # Microsoft Teams bridge only, and only with
          # switchCore.teamsBridge.ingress.mode=external — the mode that says
          # "I route these myself". Delete both if you run no Teams bridge.
          #
          # The Teams adapter listens on its own port inside switch-core (3978
          # by default), NOT on 8000, so these two paths need the teams port;
          # aiming them at 8000 reaches the API, which does not speak Bot
          # Framework. The chart publishes that port only when
          # switchCore.teamsBridge.enabled=true.
          #
          # Prefer mode=dedicated to putting these here: it gives the callback
          # its own host and certificate, so Microsoft reaches those two paths
          # and nothing else while the gateway stays internal.
          - path: /api/messages
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 3978 } } }
          - path: /api/teams/notifications
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 3978 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: RELEASE-gateway, port: { number: 3000 } } }
