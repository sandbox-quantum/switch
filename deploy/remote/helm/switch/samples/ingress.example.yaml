# Sample Ingress for a Switch install running with `ingress.mode=existing`.
#
# The chart renders no Ingress in that mode; apply something like this with your
# own controller instead. Or just set `ingress.mode=managed` and let the chart
# render the equivalent for you (className/host/tls/annotations via values).
#
# Replace:
#   RELEASE   -> your Helm release name (the prefix on the Service names below;
#                run `kubectl get svc` to confirm, e.g. `switch-switch-core`)
#   switch.example.com -> your hostname
#   letsencrypt-prod    -> your cert-manager ClusterIssuer (or drop TLS entirely)
#
# Routing mirrors the managed Ingress: the agent/MCP surface goes to
# switch-core; everything else (the gateway SPA, which proxies /gateway to
# switch-core) goes to the gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: switch-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Keep MCP/SSE streams alive (ingress-nginx; adjust for your controller).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - switch.example.com
      secretName: switch-web-tls
  rules:
    - host: switch.example.com
      http:
        paths:
          - path: /agents
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          - path: /oauth
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 8000 } } }
          # Microsoft Teams bridge only. The Teams adapter listens on its own
          # port inside switch-core (3978 by default), NOT on 8000 — so these two
          # paths need the teams port, and the chart only publishes it when
          # switchCore.teamsBridge.enabled=true. Delete both if you run no Teams
          # bridge. If you do run one and omit them, Microsoft cannot reach
          # Switch: the bridge creates channels and posts fine, but receives
          # nothing and captures no messages.
          - path: /api/messages
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 3978 } } }
          - path: /api/teams/notifications
            pathType: Prefix
            backend: { service: { name: RELEASE-switch-core, port: { number: 3978 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: RELEASE-gateway, port: { number: 3000 } } }
