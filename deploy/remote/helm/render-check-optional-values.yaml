# Layered over render-check-values.yaml for a second render with the chart's
# optional workloads switched on, so an image reference behind a feature flag
# is checked too (see scripts/pin_chart_images.py). Never deploy with these.
mattermost:
  enabled: true
switchCore:
  featureFlags:
    enabled:
      - follow_the_conversation
      - decision_routing
  migrations:
    preUpgradeJob: true
  teamsBridge:
    enabled: true
    ingress:
      mode: external
  # Rendered so the JSON settings' template is checked too.
  disabledServices:
    datadog: "Not offered on this server."
  serviceAccessProfiles:
    google-workspace: drive-file
  serviceSignInRedirect:
    atlassian: core
  allowNonExpiringKeys: true
  # Rendered so the GitLab client's env var, mount and volume are checked.
  gitlabClientSecret: render-check-gitlab-client
  # Reporting on, so the OTLP settings switch-core and the decision service
  # share are rendered too.
  observability:
    otlpEndpoint: https://collector.example.com
    deploymentId: 00000000-0000-4000-8000-000000000000
    logs: true
secrets:
  otlpHeaders: "render-check=render-check"
decision:
  enabled: true
  bedrock:
    enabled: true
  modelServer:
    hfTokenSecret:
      name: render-check-hf-token
