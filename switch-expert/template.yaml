# Switch expert, as an agent template.
#
# An agent template describes an agent the way a room template describes a
# room. Open it in Switch Console's Templates view, choose where the agent
# runs and which provider runs it, click "Create agent", and the agent
# exists. Everything the agent depends on is data (this document and the
# instructions file next to it), so an expert on another subject is another
# document with the same fields.
#
#   agent:        Who the agent is. `name` is offered as the default agent
#                 name (people address it as @name), `display_name` is how
#                 the agent is shown to people, `description` is what
#                 others read to know what it is for, `instructions` is its
#                 brief. `repo` is the repository it works from: Switch
#                 Console offers to clone it (shallow) into a subdirectory of
#                 the agent's working directory before the agent first runs,
#                 and the agent clones it itself when that did not happen.
#                 `sources` are the pages it should read; they are shown to
#                 the deployer and are the agent's to fetch.
#                 `addressing` is who may talk to it: `owner` (the default,
#                 the user who created it), `owner-agents` (that user and
#                 their other agents), or `anyone` (every member of its
#                 rooms). An expert shared by a team needs `anyone`. It can
#                 be changed afterwards under the agent's Settings.
#
#   room:         Optional. A room to put the agent in as soon as it exists,
#                 in the same shape as a room template. `{agent}` is the name
#                 the agent was given; `{$creator}` is the deployer
#                 creating it. A template with no `room:` creates the agent
#                 and stops there.
#
#   params:       Optional. Values the deployer fills in, referred to as
#                 `{name}` anywhere below. On a param of type `bridge`,
#                 `agent` or `room`, `prefill: first` selects the server's
#                 default messaging app, or its first agent or room by name,
#                 so the deployer only confirms it.
#
#   kickoff:      Optional, needs `room:`. Posted into the room on behalf of
#                 the deployer, once the room exists. An agent
#                 starts working when a message addresses it, so mention the
#                 agent here or it will sit in the room without answering.
#
#   agents:       The plural form: a list of `agent` blocks, each created by
#                 Switch Console, for a template that makes a team. The room
#                 lists them by the same names, `{team}-triager` for example,
#                 and on the Use page each one can be created new or pointed
#                 at an agent the server already has. An agent may
#                 carry `provider: "{provider}"` to read a `type: provider`
#                 param, which the Console answers and leaves out of the
#                 request to the server. See
#                 examples/agent-templates/triage-pair.template.yaml.
#
#   group:        Used instead of `room:` for several rooms. `group:` has the
#   rooms:        group's name, description and color; `rooms:` is a list of
#   links:        room blocks, each with its own `kickoff:`; `links:` connects
#                 rooms by name and is optional.
#
# Switch Console bundles this template and reads `agent.instructions` from
# AGENT.md next to this file, so the instructions are written once. A
# template saved to a workspace carries its instructions inline instead.
version: 1
params:
  bridge:
    type: bridge
    description: The messaging app the room is created in.
    prefill: first
agent:
  name: switch-expert
  display_name: Switch expert
  description: >-
    Answers questions about Switch and helps you design and build things with
    it. Grounded in a local clone of the Switch repository, which it re-reads
    rather than answering from memory.
  repo: https://github.com/sandbox-quantum/switch
  addressing: anyone
  sources:
    - label: Stand up a Switch expert
      url: https://docs.flintai.dev/flintai/switch/getting-started/switch-expert
    - label: Switch documentation
      url: https://docs.flintai.dev/flintai/switch/getting-started
room:
  name: "Ask {agent}"
  description: >-
    Where {$creator} asks {agent} about Switch: how it works, how to set
    something up, why something is not behaving.
  channel_type: channel_private
  bridge: "{bridge}"
  agents: ["{agent}"]
  users: ["{$creator}"]
  instructions: |
    This room is for asking {agent} about Switch. Answer here, briefly and
    concretely, in the plainest words that are still true. When you do not
    know, say so and say where the answer would live.
kickoff: |
  @{agent} hi. Introduce yourself in two lines, then tell me the first thing
  you would check if an agent in a room stopped answering.
