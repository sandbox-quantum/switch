# BUNDLED COPY — do not hand-edit. This is the standalone compose published to
# GHCR as `standalone-compose:<version>` by the switch-release workflow, pinned
# to COMPATIBLE_SWITCH_VERSION (src/shared/app-identity.ts) and bundled into the
# app so local-server mode needs no runtime OCI puller. Re-sync it from the
# repo's deploy/local/standalone-docker-compose.yml when bumping the pin
# (scripts/sync-standalone-compose.mjs).
#
# Standalone all-in-one Switch stack, running published GHCR images.
#
# This file is a VERSIONED CONTRACT: service names, profiles, and the env vars
# below are the interface Switch Console (and any other consumer) pins against. It
# is itself published to GHCR as an OCI artifact per `switch-v*` release, tagged
# with the same version as the images. Change the interface deliberately.
#
# Images are pulled from GHCR — nothing is built. Repo users who want the
# build-from-source flow add the build override (see `just standalone-up`):
#   docker compose -f standalone-docker-compose.yml -f standalone-docker-compose.build.yml up
#
# Profiles keep optional services opt-in:
#   (core, no profile) postgres, tuwunel, switch  — always started
#   collab            init-db, mattermost, setup  — Mattermost bridge + seeder
#   gateway           gateway                      — operator dashboard
# Select them with `--profile collab --profile gateway` or COMPOSE_PROFILES.
#
# Image coordinates are env-interpolated so the same file retargets registries
# and pins versions without edits:
#   SWITCH_REGISTRY         (default ghcr.io)
#   SWITCH_IMAGE_NAMESPACE  (default sandbox-quantum)
#   SWITCH_VERSION          (REQUIRED — no default, on purpose)
#
# SWITCH_VERSION has no fallback. It used to default to `latest`, so a missing
# or misspelt env var silently floated the whole stack to whatever had most
# recently been published — a different switch-core on every `up`, with nothing
# to say so. Compose now refuses to start rather than pick a version nobody
# asked for (CHOO-1865). `.env.example` sets it, and Switch Console writes it.
#
# The `:?` messages below read "required, set it in .env" rather than
# "required - set it in .env" on purpose. Some Compose builds (observed on
# v2.6.0) mis-tokenize a `${VAR:?msg}` whose msg contains " - " when it follows
# other `${...}` substitutions in the same value: part of the message is
# spliced into the image reference instead of the required-variable check
# firing, and the daemon then rejects the mangled tag. A comma keeps the
# wording without the trigger.

# What this compose artifact speaks on the `stack-compose` contract, which is
# what Switch Console's local-server mode pins against (CHOO-1865). The version this
# file is published under says which release it is; this says what it speaks.
# Compose ignores `x-` keys.
x-switch-contract:
  name: stack-compose
  artifact: compose
  speaks: 1
  accepts: 1

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 2s
      timeout: 3s
      retries: 10

  init-db:
    image: postgres:16-alpine
    profiles: ["collab"]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint: >
      sh -c "
        i=0
        until psql -h postgres -U ${DB_USER} -d postgres -c 'SELECT 1' >/dev/null 2>&1; do
          i=$$((i+1))
          if [ $$i -ge 30 ]; then
            echo 'init-db: could not connect to postgres as ${DB_USER} after 30 tries.' >&2
            echo 'Last attempt:' >&2
            psql -h postgres -U ${DB_USER} -d postgres -c 'SELECT 1' >&2
            echo 'A stale pgdata volume keeps the password it was first created with,' >&2
            echo 'so a regenerated DB_PASSWORD will fail here. Recreate the stack to reset it.' >&2
            exit 1
          fi
          sleep 1
        done
        psql -h postgres -U ${DB_USER} -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='mattermost'\" | grep -q 1 ||
          psql -h postgres -U ${DB_USER} -d postgres -c 'CREATE DATABASE mattermost;'
      "
    depends_on:
      postgres:
        condition: service_healthy

  tuwunel:
    image: jevolk/tuwunel:v1.7.1
    volumes:
      - tuwuneldata:/var/lib/tuwunel
    environment:
      TUWUNEL_SERVER_NAME: localhost
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_PORT: "8008"
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_ALLOW_REGISTRATION: "false"
      TUWUNEL_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET}
      TUWUNEL_MAX_REQUEST_SIZE: "20000000"

  mattermost:
    # Pinned rather than `latest`: Switch Console embeds this Mattermost's web UI
    # and depends on its DOM structure, so an unattended upgrade could break
    # the embedded room view on a `docker compose pull` no one initiated.
    image: mattermost/mattermost-team-edition:11.9.0
    # Mattermost publishes team-edition for amd64 only, so an Apple Silicon or
    # other arm64 host fails the pull outright without this. Runs emulated.
    platform: linux/amd64
    profiles: ["collab"]
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:${MATTERMOST_HOST_PORT:-8065}:8065"
    volumes:
      - mmdata:/mattermost/data
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: http://localhost:${MATTERMOST_HOST_PORT:-8065}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      # The first-run onboarding checklist opens a modal over a dimmed page,
      # which in the embedded room view is chrome the user cannot meaningfully
      # act on and has to dismiss per account.
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      # Agents post `switchdash://session?…` deeplinks so a human can jump from
      # a message to the session behind it. Mattermost only turns known schemes
      # into links, so without this they render as unclickable plain text.
      MM_DISPLAYSETTINGS_CUSTOMURLSCHEMES: switchdash
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      # Neither plugin is usable in a bundled Switch deployment: Copilot has no
      # configured provider and throws a 404 looking up its bot on every page
      # load, and Calls ships a WebRTC service nothing here can reach.
      MM_PLUGINSETTINGS_PLUGINSTATES: |
        {"mattermost-ai":{"Enable":false},"com.mattermost.calls":{"Enable":false}}
    depends_on:
      init-db:
        condition: service_completed_successfully

  switch:
    image: ${SWITCH_REGISTRY:-ghcr.io}/${SWITCH_IMAGE_NAMESPACE:-sandbox-quantum}/switch-core:${SWITCH_VERSION:?required, set it in .env, there is no default}
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MATRIX_SERVER: http://tuwunel:8008
      MATRIX_SERVER_NAME: localhost
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET}
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GATEWAY_ADMIN_EMAIL: ${GATEWAY_ADMIN_EMAIL}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      tuwunel:
        condition: service_started

  gateway:
    image: ${SWITCH_REGISTRY:-ghcr.io}/${SWITCH_IMAGE_NAMESPACE:-sandbox-quantum}/gateway:${SWITCH_VERSION:?required, set it in .env, there is no default}
    profiles: ["gateway"]
    ports:
      - "${SWITCH_BIND_ADDR:-127.0.0.1}:${GATEWAY_HOST_PORT:-3000}:3000"
    depends_on:
      - switch

  setup:
    image: ${SWITCH_REGISTRY:-ghcr.io}/${SWITCH_IMAGE_NAMESPACE:-sandbox-quantum}/setup:${SWITCH_VERSION:?required, set it in .env, there is no default}
    profiles: ["collab"]
    restart: on-failure
    environment:
      SWITCH_URL: http://switch:8000
      MATTERMOST_URL: http://mattermost:8065
      MATTERMOST_URL_FOR_SWITCH: http://mattermost:8065
      MATTERMOST_ADMIN_USER: ${MATTERMOST_ADMIN_USER}
      MATTERMOST_ADMIN_PASSWORD: ${MATTERMOST_ADMIN_PASSWORD}
      MATTERMOST_TEAM_NAME: ${MATTERMOST_TEAM_NAME}
      MATTERMOST_USER: ${MATTERMOST_USER}
      MATTERMOST_USER_PASSWORD: ${MATTERMOST_USER_PASSWORD}
      GATEWAY_ADMIN_EMAIL: ${GATEWAY_ADMIN_EMAIL}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
    depends_on:
      - mattermost
      - switch

volumes:
  pgdata:
  mmdata:
  tuwuneldata:
