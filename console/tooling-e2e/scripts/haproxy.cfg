# In front of two switch-core replicas on the host, for `ephemeral-stack.sh
# --replicas 2`. Round robin with no stickiness, so consecutive requests from
# one client land on different replicas: whatever one replica writes, the
# other must be able to read and act on.
#
# :8000 is the API, the gateway and the WebSockets (agent connections, gateway
# changes, controllers); :8081 is the collaboration callback listener, which a
# replica binds only once it serves a bridge that is called back, so its check
# is a plain connect and a replica that does not listen is left out.

global
  log stdout format raw local0

defaults
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  # Server-sent event streams sit idle between events.
  timeout client 5m
  timeout server 5m
  # A WebSocket, once upgraded.
  timeout tunnel 1h
  timeout http-request 30s

frontend api
  mode http
  bind :8000
  default_backend replicas

backend replicas
  mode http
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  default-server inter 1s fall 2 rise 1
  server one host.docker.internal:8001 check
  server two host.docker.internal:8002 check

frontend callbacks
  mode http
  bind :8081
  default_backend callback_replicas

backend callback_replicas
  mode http
  balance roundrobin
  default-server inter 1s fall 2 rise 1
  server one host.docker.internal:8091 check
  server two host.docker.internal:8092 check
