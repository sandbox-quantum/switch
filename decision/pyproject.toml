[project]
name = "switch-decision"
version = "0.1.0"
description = "Switch decision service: picks which agent in a room, if any, should answer a message nobody tagged."
requires-python = ">=3.12"
license = "LicenseRef-Apache-2.0-with-Commons-Clause"
# The base package (prompt, request models, readers and the threshold step)
# needs pydantic alone: switch-core depends on it to ask a model served on a
# user's own machine exactly as the service asks its own. The service itself
# is the `service` extra.
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "boto3>=1.43.117",
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switch_decision"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "switch-decision[service]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["switch_decision"]
