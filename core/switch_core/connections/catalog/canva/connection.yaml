slug: canva
name: Canva
category: Design
description: Create and export Canva designs.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Each refresh returns a new refresh token and spends the old one.
  refresh: rotating
  oauth:
    # Each server's operator registers a Canva integration and names its
    # settings in CANVA_CLIENT_CONFIG_PATH. Canva matches a redirect exactly,
    # port included, so sign-ins come back to Switch Console on one of five
    # fixed ports.
    registration: static
    client_settings: CANVA
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    # Authorization and token endpoints are discovered from the MCP server's
    # metadata. Revoking a refresh token ends its whole lineage and the
    # person's consent for the integration, so a reconnect must not revoke
    # the sign-in it replaces.
    revocation_url: https://api.canva.com/rest/v1/oauth/revoke
    revocation_ends_grant: true
    # Canva's MCP server is a Developer Portal setting, and the app may need
    # approving before everyone can authorize it. Nothing Switch asks Canva
    # about the client shows either.
    unchecked: >-
      Switch can't check that Canva's MCP server is enabled for this
      integration, or that the integration is approved for everyone who will
      connect. Confirm with a real sign-in.
  identity:
    url: https://api.canva.com/rest/v1/users/me
    account_id: team_user.user_id
    # The answer carries only ids: no email or display name, so a connection
    # is named by its account id.
    label: team_user.user_id
# Canva documents a four-hour access-token lifetime; Switch has not measured it.
token: { kind: pass_through, max_lifetime: 14400 }
mcp:
  servers:
    - { name: canva, url: "https://api.canva.com/connect/v1/mcp" }
access:
  # MCP access must be enabled for this integration in Canva's Developer Portal.
  read:
    scopes:
      - design:meta:read
      - design:content:read
  write:
    scopes:
      - design:meta:read
      - design:content:read
      - design:content:write
tools: { mode: pass_through }
