slug: intercom
name: Intercom
category: Customer support
description: Work with Intercom conversations, contacts and help-center articles, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Intercom's MCP OAuth metadata advertises the refresh_token grant; rotation
  # was not measured, so assume it rotates until a live sign-in confirms.
  refresh: rotating
  oauth:
    # Intercom's hosted MCP server advertises a registration endpoint and a
    # public ("none") client, so Core registers its own client and discovers
    # the endpoints from the server.
    registration: dynamic
    # Intercom allows an OAuth callback on localhost/127.0.0.1 on any port
    # without setup; any other callback needs Intercom to allowlist it first,
    # so Switch connects through Switch Console in loopback mode.
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    revocation_discovered: true
  # Intercom's current-admin endpoint names the account; a version header is
  # optional and defaults to the workspace's version.
  identity:
    url: https://api.intercom.io/me
    account_id: id
    label: email
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    # Intercom's US hosted MCP server. EU workspaces use mcp.eu.intercom.com;
    # AU workspaces are not supported. One connection is one workspace.
    - name: intercom
      url: "https://mcp.intercom.com/mcp"
access:
  # Intercom's MCP OAuth exposes a single coarse `mcp` scope (its "operator"
  # scope is Fin Operator, not requested); what the connection can read or
  # write is set by the permissions on the workspace's app, not by scope
  # strings, so this entry offers a single grant level.
  read:
    scopes:
      - mcp
tools: { mode: pass_through }
