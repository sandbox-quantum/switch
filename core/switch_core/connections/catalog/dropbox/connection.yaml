slug: dropbox
name: Dropbox
category: File storage
description: Search and read the files in your Dropbox, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # A refresh token survives its use, and comes only with
  # token_access_type=offline below.
  refresh: reusable
  oauth:
    # Each server's operator registers a scoped Dropbox app with Full Dropbox
    # access in the App Console, ticks the scopes under access on its
    # Permissions tab, and names it in DROPBOX_CLIENT_CONFIG_PATH. Dropbox
    # advertises dynamic registration, but answers it with a fixed list of
    # port-less http://localhost and http://127.0.0.1 redirects in place of
    # the ones asked for, so neither Core's callback nor Console's listener
    # can be registered that way.
    registration: static
    client_settings: DROPBOX
    # Back to Core's own https callback, registered under Redirect URIs on
    # the app's Settings tab: the server needs GATEWAY_PUBLIC_URL.
    redirect: [core]
    # Without it Dropbox hands out an access token and no refresh token.
    authorization_params:
      token_access_type: offline
    # The endpoints are discovered from the MCP server, the revocation
    # endpoint too. It (/2/auth/token/revoke) is Dropbox's own API call,
    # authenticated by the access token as a bearer with no body, and refuses
    # an RFC 7009 request. Revoking the access token ends its refresh token.
    revocation_discovered: true
    revocation_bearer: true
    # Not revocation_ends_grant: a revocation ends only the sign-in whose
    # token it was. Dropbox keeps the app's other sign-ins to the same account,
    # so a reconnect's replaced sign-in is still revoked.
  identity:
    # Dropbox's account call is a POST that takes no arguments, so it is sent
    # with no body.
    method: POST
    url: https://api.dropboxapi.com/2/users/get_current_account
    account_id: account_id
    label: email
# Dropbox's short-lived access tokens live 4 hours (expires_in: 14400).
token: { kind: pass_through, max_lifetime: 14400 }
mcp:
  servers:
    - { name: dropbox, url: "https://mcp.dropbox.com/mcp" }
access:
  # account_info.read is what the identity call needs. Dropbox puts creating,
  # copying, moving and deleting files and folders under files.content.write.
  # Not asked for:
  # files.metadata.write (tags and custom properties), the sharing and file
  # request scopes, which reach other people (shared links, invitations,
  # uploads from anyone with the link), and files.permanent_delete, which the
  # MCP server does not offer. The server still lists the tools those scopes
  # carry, and Dropbox refuses them. A deleted file goes to Dropbox's deleted
  # files, where it can be restored within the plan's recovery window.
  read:
    scopes:
      - account_info.read
      - files.metadata.read
      - files.content.read
  write:
    scopes:
      - account_info.read
      - files.metadata.read
      - files.content.read
      - files.content.write
tools: { mode: pass_through }
