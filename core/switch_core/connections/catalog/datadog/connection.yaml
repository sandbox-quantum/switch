slug: datadog
name: Datadog
category: Observability
description: Query Datadog metrics, logs, traces, monitors and incidents, as you.
enabled: true
publisher: Datadog
links:
  documentation: https://docs.datadoghq.com/bits_ai/mcp_server/
  support: https://www.datadoghq.com/support/
  privacy: https://www.datadoghq.com/legal/privacy/
adapter: oauth
auth:
  type: oauth
  # A refresh returns a new access token and leaves the refresh token as it is.
  refresh: reusable
  oauth:
    # Datadog's MCP authorization server registers a public client for each
    # site, so Core registers one itself at each site people pick.
    registration: dynamic
    # Sign-ins come back to Switch Console by default, which Datadog accepts
    # from any organization. A server may send them to Core's own callback
    # instead (SERVICE_SIGN_IN_REDIRECT names `core` for datadog), which
    # Datadog accepts only once an organization admin has added it to the MCP
    # OAuth redirect URLs in Organization Settings. Switching either way
    # registers new clients, so every Datadog connection on that server
    # reconnects once.
    redirect: [loopback, core]
    loopback_ports: [39241, 39242, 39243, 39244, 39245]
    # Each site is a Datadog of its own: its own accounts, MCP server and
    # authorization server. Government sites offer no MCP server.
    choices:
      - name: site
        label: Datadog site
        secret: false
        help: "The address you open Datadog at, without app. On Datadog's consent page, Full access lets agents do all your user can, admin actions too; Limited is read-only."
        choices:
          - datadoghq.com
          - us3.datadoghq.com
          - us5.datadoghq.com
          - datadoghq.eu
          - ap1.datadoghq.com
          - ap2.datadoghq.com
          - uk1.datadoghq.com
    # Datadog advertises no revocation endpoint.
    remove_access: Remove it in Datadog under Personal Settings, Authorized Apps.
  # The user in the organization signed in to: one person in two organizations
  # is two accounts.
  identity:
    url: "https://api.{site}/api/v2/current_user"
    account_id: data.id
    label: data.attributes.email
  # In place of signing in, a person may paste a personal access token, which
  # Datadog ends on the date set when it was made, or an API key and an
  # application key, which never expire: a server offers those only where it
  # allows such keys (ALLOW_NON_EXPIRING_KEYS). Either reaches what it was
  # made to at the site picked, and is checked at the MCP server there.
  paste:
    - name: token
      label: Personal access token
      fields:
        - name: pat
          label: Personal access token
          secret: true
          help: "Personal Settings, Access Tokens. Scopes: mcp_read, mcp_write for writes, the read scope of each product agents use (monitors_read, metrics_read, logs_read_data), user_access_read to keep grants."
      headers: { Authorization: "Bearer {pat}" }
      # Datadog requires every personal access token to expire, from 24 hours
      # to one year after it is made, so no token is one that never expires.
      expires: vendor
      # The part of a token before its secret, which Datadog shows people.
      alias: "^(ddpat_[A-Za-z0-9]+)_"
      help_url: https://docs.datadoghq.com/account_management/personal-access-tokens/
    - name: keys
      label: API and application keys
      fields:
        - name: api_key
          label: API key
          secret: true
          help: Organization Settings, API Keys.
        - name: application_key
          label: Application key
          secret: true
          help: Personal Settings, Application Keys, with mcp_read, mcp_write for writes, and the read scope of each product agents use (monitors_read, metrics_read, logs_read_data).
      # Datadog's MCP server takes the keys in headers named with
      # underscores, unlike its REST API.
      headers:
        DD_API_KEY: "{api_key}"
        DD_APPLICATION_KEY: "{application_key}"
      expires: never
      help_url: https://docs.datadoghq.com/account_management/api-app-keys/
# Datadog's access tokens live 3,599 seconds. A pasted credential is bound by
# its own expiry, not this.
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    # MCP access is turned on per organization, and its write tools may be
    # turned off there, under Organization Settings.
    - { name: datadog, url: "https://mcp.{site}/v1/mcp" }
access:
  # Datadog's authorization server offers one scope. Its consent page offers
  # Full access or Limited (read-only) access, and the token's scope lists the
  # permissions given: mcp_write only with Full.
  read: { scopes: [mcp_all] }
  write: { scopes: [mcp_all] }
  consent: { read: mcp_read, write: mcp_write }
tools: { mode: pass_through }
