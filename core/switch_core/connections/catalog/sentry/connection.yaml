slug: sentry
name: Sentry
category: Observability
description: Look up Sentry issues, events, stack traces and releases, and triage issues, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # A refresh hands out a new refresh token, which replaces the old one (the
  # server runs Cloudflare's OAuth provider). Measured: a refresh after the
  # first token expired succeeded with no new sign-in.
  refresh: rotating
  oauth:
    # Sentry's MCP server offers dynamic registration, PKCE S256 and token
    # revocation, so Core registers its client and nothing is set up on the
    # server. Sentry.io only: a self-hosted Sentry needs the local MCP server.
    registration: dynamic
    # Sign-ins come back to Switch Console, so a server without a public
    # address can connect Sentry too. The ports are Atlassian's.
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    revocation_discovered: true
  # An MCP token works only with Sentry's MCP server: sentry.io/api/0/
  # answers it 401, and the token answer names nobody, so the account is
  # read from the server's own whoami tool (read-only, no arguments).
  identity:
    mcp_tool: whoami
    account_id: user.id
    label: user.email
# The first access token lives 3600 s, as measured. Sentry's MCP server never
# refreshes upstream: a refreshed token lives as long as the person's 30-day
# Sentry token has left, so the broker withholds it from agents (it outlives
# this cap) until it is within an hour of expiring. Until Switch can hand out
# such a token, agents have Sentry for the hour after each sign-in.
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    - { name: sentry, url: "https://mcp.sentry.dev/mcp" }
access:
  # Sentry grants these four scopes to every sign-in, whatever the person
  # picks on its consent screen, so a read level cannot be told from a write
  # one and every connection is granted the write level. What they pick there
  # is what limits the tools: "Inspect Issues & Events" alone gives read-only
  # tools, and Seer, "Triage Issues" and "Manage Projects & Teams" add their
  # own. Sentry remembers the choice for the next sign-in. Not asked for:
  # alerts:write.
  read:
    scopes: [org:read, project:write, team:write, event:write]
  write:
    scopes: [org:read, project:write, team:write, event:write]
tools: { mode: pass_through }
