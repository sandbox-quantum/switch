slug: cloudflare
name: Cloudflare
category: Infrastructure
description: Inspect and manage Cloudflare Workers, DNS records, zones and logs.
enabled: true
adapter: oauth
auth:
  type: oauth
  # [DOCUMENTED] Advertises refresh_token in grant_types_supported at https://mcp.cloudflare.com/.well-known/oauth-authorization-server.
  refresh: rotating
  oauth:
    # [DOCUMENTED] RFC 7591 dynamic client registration endpoint https://mcp.cloudflare.com/register advertised in RFC 8414 metadata.
    registration: dynamic
    # [DOCUMENTED] RFC 8252 loopback redirection on 127.0.0.1 for public native desktop clients per PKCE S256.
    redirect: [loopback]
    # [DOCUMENTED] Revocation advertised at token endpoint in RFC 8414 metadata.
    revocation_discovered: true
  identity:
    # [UNVERIFIED] REST user identity endpoint (GET https://api.cloudflare.com/client/v4/user).
    # Needs live verification that an MCP-issued token is accepted by this endpoint (HTTP 200).
    url: https://api.cloudflare.com/client/v4/user
    # [DOCUMENTED] Field 'result.id' in Cloudflare user API response.
    account_id: result.id
    # [DOCUMENTED] Field 'result.email' in Cloudflare user API response.
    label: result.email
# [DOCUMENTED] Standard 1-hour access token lifetime (3,600s) for Cloudflare OAuth tokens.
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    # [DOCUMENTED] Official Cloudflare remote MCP server endpoint.
    - { name: cloudflare, url: "https://mcp.cloudflare.com/mcp" }
access:
  # Scopes chosen strictly from scopes_supported at https://mcp.cloudflare.com/.well-known/oauth-authorization-server.
  # Least access requested: offline refresh, user/account inspection, and read of zones, DNS, and worker scripts.
  read:
    scopes:
      - offline_access
      - user:read
      - account:read
      - zone.read
      - dns.read
      - workers-scripts.read
  # Write adds zone, DNS, and worker script modification scopes.
  write:
    scopes:
      - offline_access
      - user:read
      - account:read
      - zone.read
      - dns.read
      - workers-scripts.read
      - zone.write
      - dns.write
      - workers-scripts.write
tools: { mode: pass_through }
