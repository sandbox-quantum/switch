slug: cloudflare
name: Cloudflare
category: Infrastructure
description: Work with Cloudflare zones, DNS and Workers, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Cloudflare's MCP OAuth metadata advertises the refresh_token grant and the
  # offline_access scope; rotation was not measured, so assume it rotates until
  # a live sign-in confirms.
  refresh: rotating
  oauth:
    # Cloudflare's hosted MCP server advertises a registration endpoint, so
    # Core registers its own client and discovers the endpoints from it.
    registration: dynamic
    redirect: [loopback, core]
    revocation_discovered: true
  # Cloudflare's current-user endpoint names the account. NOT yet confirmed
  # that an MCP-issued token is accepted against the REST API; validate before
  # relying on it (the issue asks for a connect/grant/use video).
  identity:
    url: https://api.cloudflare.com/client/v4/user
    account_id: result.id
    label: result.email
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    # Cloudflare's general hosted MCP server. Cloudflare also runs
    # product-specific servers; this entry starts with the general one and
    # keeps the scopes minimal.
    - name: cloudflare
      url: "https://mcp.cloudflare.com/mcp"
access:
  # Cloudflare exposes a very large scope surface. Least access that works:
  # the identity and account reads, offline access for refresh, and read of
  # zones, DNS and Workers. Write adds the matching writes. No account-admin,
  # membership, token-management or Access-revoke scopes.
  read:
    scopes:
      - offline_access
      - user:read
      - account:read
      - zone.read
      - dns.read
      - workers-scripts.read
  write:
    scopes:
      - offline_access
      - user:read
      - account:read
      - zone.read
      - zone.write
      - dns.read
      - dns.write
      - workers-scripts.read
      - workers-scripts.write
tools: { mode: pass_through }
