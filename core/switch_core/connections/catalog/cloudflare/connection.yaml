slug: cloudflare
name: Cloudflare
category: Infrastructure
description: Inspect and manage Cloudflare Workers, DNS, logs and the rest of the Cloudflare API, as you.
enabled: true
adapter: api_key
auth:
  type: api_key
  refresh: none
  api_key:
    # Cloudflare's MCP server also signs in with OAuth and registers clients
    # dynamically, but the tokens it issues are good only at its /mcp
    # endpoint, which answers who they belong to through a tool, not a GET.
    # A Cloudflare API token works at the same server and at the REST API's
    # /user, and Cloudflare enforces its permissions, so a read-only token
    # keeps the connection read-only.
    fields:
      - name: api_token
        label: API token
        secret: true
        help: My Profile, API Tokens. The Read all resources template keeps agents read-only. Include User Details and Account Settings read.
    # /user answers only for a token a person owns; an account-owned token
    # has no user and is refused. The MCP server needs the same two reads, of
    # /user and /accounts, before it serves a call.
    identity:
      method: GET
      url: https://api.cloudflare.com/client/v4/user
      headers: { Authorization: "Bearer {api_token}" }
      account_id: result.id
      label: result.email
    help_url: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
# A token lives until it is deleted, or until the end date set on it at
# Cloudflare; Switch cannot renew it. Each issue hands it out for an hour, so
# the grant is checked again at least hourly.
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    # One server for the whole API, in code mode: search the OpenAPI spec,
    # then execute calls against it. Not Cloudflare's product-specific
    # servers, which would split one token across many. It refuses tokens
    # restricted by client IP address, since its calls come from Cloudflare.
    - name: cloudflare
      url: https://mcp.cloudflare.com/mcp
      headers: { Authorization: "Bearer {api_token}" }
tools: { mode: pass_through }
