slug: cloudflare
name: Cloudflare
category: Infrastructure
description: Inspect Cloudflare zones, DNS records, Workers and their logs, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Cloudflare's authorization server advertises refresh_token; treat each
  # refresh as spending the old token, the safe assumption.
  refresh: rotating
  oauth:
    # Cloudflare's MCP server offers dynamic client registration
    # (https://mcp.cloudflare.com/register) and PKCE S256: no operator setup.
    registration: dynamic
    redirect: [core, loopback]
    # A disconnect revokes at the advertised revocation endpoint.
    revocation_discovered: true
  identity:
    # Needs the user:read scope, which every level asks for.
    url: https://api.cloudflare.com/client/v4/user
    account_id: result.id
    label: result.email
# Cloudflare does not document the lifetime of the MCP server's access tokens;
# one hour is assumed until measured, and a longer one is refused.
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    # The API MCP server: Cloudflare's whole API through search and execute,
    # limited to what the granted scopes allow.
    - { name: cloudflare, url: "https://mcp.cloudflare.com/mcp" }
access:
  # Only the products the issue names: zones, DNS, Workers and their logs.
  # Not asked for: Access/Zero Trust, WAF, API tokens, R2, KV, billing, or any
  # .admin or .revoke scope.
  read:
    scopes:
      - offline_access
      - user:read
      - account:read
      - zone.read
      - dns.read
      - workers-scripts.read
      - workers-routes.read
      - workers-observability.read
      - workers-tail.read
      - logs.read
  write:
    scopes:
      - offline_access
      - user:read
      - account:read
      - zone.read
      - dns.read
      - dns.write
      - workers-scripts.read
      - workers-scripts.write
      - workers-routes.read
      - workers-routes.write
      - workers-observability.read
      - workers-tail.read
      - logs.read
tools: { mode: pass_through }
