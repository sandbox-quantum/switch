slug: launchdarkly
name: LaunchDarkly
category: Developer tools
description: Inspect LaunchDarkly feature flags, environments, and rollout contexts.
enabled: true
adapter: oauth
auth:
  type: oauth
  refresh: rotating
  oauth:
    registration: dynamic
    redirect: [loopback]
    loopback_ports: [39151, 39152, 39153, 39154, 39155]
    prompt: consent
    revocation_discovered: true
  identity:
    url: https://app.launchdarkly.com/api/v2/users/me
    account_id: _id
    label: email
token: { kind: pass_through, max_lifetime: 7200 }
mcp:
  servers:
    - name: launchdarkly
      url: "https://mcp.launchdarkly.com/mcp/launchdarkly"
access:
  read:
    scopes:
      - "reader"
  write:
    scopes:
      - "reader"
      - "writer"
tools: { mode: pass_through }
