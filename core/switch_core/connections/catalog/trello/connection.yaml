slug: trello
name: Trello
category: Project management
description: Read and update Trello boards, lists and cards, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Atlassian issues rotating refresh tokens for this MCP connection.
  refresh: rotating
  oauth:
    # Trello's protected-resource metadata points to Atlassian's issuer, which
    # supports dynamic registration, PKCE S256 and discovered revocation.
    registration: dynamic
    # Atlassian matches the registered loopback port exactly.
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    prompt: consent
    revocation_discovered: true
  identity:
    url: https://api.atlassian.com/me
    account_id: account_id
    label: email
# The vendor's observed MCP access-token lifetime is 8 hours; Core still
# rechecks pass-through access at least hourly.
token: { kind: pass_through, max_lifetime: 28800 }
mcp:
  servers:
    - { name: trello, url: "https://mcp.trello.com/v1" }
access:
  read:
    scopes:
      - read:me
      - read:account
      - offline_access
      - read:board:trello
      - read:member:trello
  write:
    scopes:
      - read:me
      - read:account
      - offline_access
      - read:board:trello
      - write:board:trello
      - read:member:trello
tools: { mode: pass_through }