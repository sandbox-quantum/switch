slug: zendesk
name: Zendesk
category: Customer support
description: Zendesk ticket and user access is coming soon. No supported transport is available; this entry cannot connect or grant access.
# No official remote MCP server or suitable CLI transport has been verified.
# Do not point this at a community server or enable it merely to bypass this gate.
enabled: false
adapter: api_key
auth:
  type: api_key
  refresh: none
  api_key:
    fields:
      - name: subdomain
        label: Zendesk subdomain
        secret: false
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        help: Only your account label, without .zendesk.com. Never enter a full URL.
      - name: email
        label: Verified Zendesk email
        secret: true
        help: The verified account whose existing API token is being checked.
      - name: api_token
        label: Existing API token
        secret: true
        help: Zendesk is retiring API tokens. This disabled entry does not ask you to create one.
    identity:
      method: GET
      url: 'https://{subdomain}.zendesk.com/api/v2/users/me.json'
      headers: { Accept: application/json }
      basic_auth:
        username: '{email}/token'
        password: '{api_token}'
      account_id: user.id
      # Show Self is also available anonymously. A 200 response alone is not
      # proof of a sign-in; reject null, negative and zero anonymous IDs.
      account_id_pattern: '^[1-9][0-9]*$'
      label: user.email
    help_url: https://developer.zendesk.com/api-reference/introduction/security-and-auth/
# Non-expiring keys are never passed to an agent, even after a future transport
# exists. Core-mediated access is separate follow-up work.
token: { kind: pass_through, max_lifetime: null }
