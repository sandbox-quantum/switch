slug: zendesk
name: Zendesk
category: Customer support
description: Zendesk ticket access is coming soon; no supported agent transport is available.
# Approved disabled groundwork (#843). No verified official Support MCP server
# or suitable CLI is configured. Do not substitute community tools or zcli.
enabled: false
adapter: api_key
auth:
  type: api_key
  refresh: none
  api_key:
    fields:
      - name: subdomain
        label: Zendesk subdomain
        secret: false
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        help: One account label, without .zendesk.com or a URL.
      - name: email
        label: Zendesk email
        secret: false
        pattern: '^[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,253}$'
      - name: api_token
        label: Existing API token
        secret: true
        help: Existing tokens only. New token creation ended on 2026-10-27.
    identity:
      method: GET
      url: https://{subdomain}.zendesk.com/api/v2/users/me.json
      basic: { username: '{email}/token', password: '{api_token}' }
      account_id: user.id
      # Show Self can return HTTP 200 anonymously; require a positive user ID.
      account_id_positive: true
      label: user.email
    help_url: https://developer.zendesk.com/documentation/authentication/oauth-migration/
# Accounts created from 2026-07-28 cannot use API tokens. Existing tokens idle
# for 30 days are deactivated; all remaining tokens end on 2027-04-30.
# API tokens have no scopes or Switch-managed revocation. They inherit the
# user's permissions; no read-only boundary is claimed. They never reach an
# agent. Future activation needs a separately approved transport and secure
# credential handling, not just enabled: true. See docs/connections/zendesk.md.
token: { kind: pass_through, max_lifetime: null }
