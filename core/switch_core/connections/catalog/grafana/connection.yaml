slug: grafana
name: Grafana
category: Observability
description: Query Grafana Cloud dashboards, metrics, logs, traces and alerts, as you. Needs Grafana Assistant on the stack, and each person who connects counts as an Assistant user for billing.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Grafana's server is OAuth 2.1 with PKCE S256, so refresh-token rotation
  # is expected; the token endpoint's answers were not measured against a
  # live stack. Confirm at manual QA.
  refresh: rotating
  oauth:
    # Grafana Cloud MCP registers clients itself (RFC 7591), as its docs say
    # most clients need: Core registers one on first connect, discovered from
    # the MCP server's metadata with the authorization and token endpoints.
    registration: dynamic
    # Grafana matches a pre-registered https redirect exactly but accepts a
    # loopback redirect on any port (RFC 8252), so no ports are pinned.
    redirect: [loopback, core]
    # The authorization-server metadata names no revocation endpoint and no
    # revoke API is documented, so a disconnect cannot revoke at Grafana.
    remove_access: In your Grafana stack, open Assistant Settings, Connectors, MCP clients and revoke the connection under Your connections. Until you do, the sign-in stays authorized for up to 30 days.
  identity:
    # Maintainer direction on #826 (petr-sandbox, 2026-11-02): no REST
    # endpoint accepts Grafana's MCP token, so identity comes from the MCP
    # server itself. user_info is a read-only, no-argument tool on Grafana's
    # own server that returns the signed-in identity; it is listed in
    # Grafana's cloud MCP tools reference and its result carries login,
    # email, name and the current organization (mcp-grafana tools/user.go).
    # email can be empty for a Grafana user; the login is then the label.
    # Whether the cloud variant exposes the numeric user id is unverified
    # until a live sign-in; login is present in both.
    # Uniqueness: each Grafana Cloud stack is an isolated Grafana instance
    # with its own user records, and the consent flow asks for the stack, so
    # a connection is inherently per-stack and login is unique within it.
    # The shared implementation keys identity by this account_id alone; no
    # stack component exists in it, so whether the same login on a second
    # stack needs distinct keying is an open question on #826 (unanswered).
    mcp_tool: user_info
    account_id: login
    label: email
# Grafana documents access tokens of 1 hour, refreshed without the user for
# 30 days; not yet measured. An agent's copy may outlive its grant by up to
# an hour; agents still ask again hourly.
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  # One server signs in per stack: consent asks for the Grafana Cloud stack
  # unless its address is sent in the X-Grafana-URL header. Self-hosted
  # Grafana is out of scope.
  servers:
    - { name: grafana, url: "https://mcp.grafana.com/mcp" }
access:
  # Grafana's authorization-server metadata advertises grafana:read,
  # grafana:query and grafana:write, so access.unscoped does not apply
  # (maintainer direction on #826: unscoped is only for servers that offer
  # no scopes at all).
  # grafana:read alone is truly read-only: dashboards, alerts, incidents and
  # queries to read-only data sources (Prometheus, Loki, Tempo, Pyroscope).
  read:
    scopes:
      - grafana:read
  # grafana:query runs raw SQL as written and can change data where the data
  # source's own credentials allow it, so it sits at the write level, as
  # does grafana:write (create, change and delete resources; Grafana says it
  # includes read and query, and all three are asked for explicitly).
  write:
    scopes:
      - grafana:read
      - grafana:query
      - grafana:write
tools: { mode: pass_through }
