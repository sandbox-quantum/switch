slug: supabase
name: Supabase
category: Database
description: Inspect and manage Supabase projects, databases and logs, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Supabase tokens rotate on each refresh.
  refresh: rotating
  oauth:
    # Supabase's remote MCP server at https://mcp.supabase.com/mcp supports
    # OAuth 2.0 dynamic client registration (RFC 7591).
    registration: dynamic
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    prompt: consent
    revocation_discovered: true
  identity:
    url: https://api.supabase.com/v1/profile
    account_id: id
    label: primary_email
# Supabase OAuth access tokens live 1 hour (3600 seconds).
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    - { name: supabase, url: "https://mcp.supabase.com/mcp" }
access:
  # Supabase Management API scopes control what operations the agent can perform.
  # Read access inspects schemas, tables, query plans, and logs.
  # Write access allows schema alterations, table updates, and edge function deployments.
  read:
    scopes:
      - openid
      - email
      - profile
      - projects:read
      - database:read
      - environment:read
  write:
    scopes:
      - openid
      - email
      - profile
      - projects:read
      - database:read
      - database:write
      - environment:read
      - environment:write
tools: { mode: pass_through }
