slug: supabase
name: Supabase
category: Database
description: Connect Supabase projects to query databases, read schemas, and manage table records.
enabled: true
adapter: api_key
auth:
  type: api_key
  refresh: none
  api_key:
    fields:
      - name: project_url
        label: Project URL
        secret: true
        help: Project Settings, API, Project URL.
      - name: api_key
        label: API key
        secret: true
        help: Project Settings, API, API Keys.
    identity:
      method: GET
      url: "https://api.supabase.com/v1/projects"
      headers:
        Authorization: "Bearer {api_key}"
        apikey: "{api_key}"
    help_url: https://supabase.com/docs/guides/api
# A key does not expire, and only Supabase can revoke it, so it is never handed
# to an agent. Agents default to read-only access (schema inspection and queries);
# mutations require explicit user confirmation.
token: { kind: pass_through, max_lifetime: null }
mcp:
  servers:
    - name: supabase
      url: "https://mcp.supabase.com/mcp"
      headers:
        Authorization: "Bearer {api_key}"
        apikey: "{api_key}"
tools: { mode: pass_through }
