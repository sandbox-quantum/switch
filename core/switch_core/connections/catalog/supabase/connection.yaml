slug: supabase
name: Supabase
category: Database
description: Inspect and manage Supabase databases, schemas, edge functions, and project telemetry across your account.
enabled: true
adapter: oauth
auth:
  type: oauth
  refresh: rotating
  oauth:
    registration: dynamic
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    prompt: consent
    revocation_discovered: true
  identity:
    url: https://api.supabase.com/v1/profile
    account_id: gotrue_id
    label: primary_email
# Supabase OAuth access tokens expire after 24 hours (86,400 seconds) as documented
# by the Supabase OAuth provider specification (https://supabase.com/docs/guides/platform/oauth-apps).
# A refresh token rotation strategy is employed to issue fresh tokens upon expiration.
token:
  kind: pass_through
  max_lifetime: 86400
# Supabase's official remote MCP server provides management access across all projects of
# the authenticated account.
# The read access level maps to the dedicated read_only=true endpoint to restrict agents to
# schema inspection, logs, and telemetry.
# The write access level connects to the primary endpoint to permit SQL execution and database
# migrations across user projects; destructive operations are guarded in SKILL.md.
mcp:
  servers:
    - name: supabase
      url: "https://mcp.supabase.com/mcp"
      read_url: "https://mcp.supabase.com/mcp?read_only=true"
access:
  read:
    scopes:
      - "all"
  write:
    scopes:
      - "all"
tools:
  mode: pass_through
