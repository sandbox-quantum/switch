slug: box
name: Box
category: File storage
description: Search, read and organize the files and folders you can reach in Box, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Box's refresh tokens are single-use: each refresh returns a new one, and
  # one left unused for 60 days lapses.
  refresh: rotating
  oauth:
    # Box offers no dynamic registration. A Box admin enables the Box MCP
    # server under Integrations in the Box Admin Console and adds Integration
    # Credentials there, which give the client id and secret; each server's
    # operator saves them under Connector apps, or names them in
    # BOX_CLIENT_CONFIG_PATH. The credentials' Access Scopes are the most a
    # sign-in can be granted; the scopes asked for below narrow it.
    registration: static
    client_settings: BOX
    # Back to Core's own https callback, as Airtable's and Google's: the
    # server needs GATEWAY_PUBLIC_URL, and nothing listens on people's
    # computers.
    redirect: [core]
    # A check proves the client id and secret, but not the redirect URI, the
    # credentials' scopes, or that the integration is enabled for the person.
    unchecked: >-
      Switch can't check the redirect URI, the integration's scopes, or that
      the Box MCP server is enabled for everyone who connects. Connect once to
      confirm.
    # The endpoints, PKCE S256 and the revocation endpoint are discovered:
    # mcp.box.com names api.box.com as its authorization server.
    revocation_discovered: true
  identity:
    url: https://api.box.com/2.0/users/me
    account_id: id
    label: login
# Box's access tokens live about an hour (documented). A longer one is held
# back until it has run down to an hour.
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    - { name: box, url: "https://mcp.box.com" }
access:
  # Box checks each call against the person's own folder and file
  # permissions as well as these scopes. Not asked for: ai.readwrite, whose
  # Box AI tools (ask, extract) spend the enterprise's AI units, and
  # docgen.readwrite, which needs an Enterprise Advanced licence. Box refuses
  # those tools without them, though its server may still list them. The Box
  # MCP server has no tool that deletes a file or folder; root_readwrite lets
  # it upload, copy, move, rename and comment.
  read:
    scopes:
      - root_readonly
  write:
    scopes:
      - root_readwrite
tools: { mode: pass_through }
