slug: asana
name: Asana
category: Project management
description: Read and update Asana tasks and projects, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Asana's OAuth guide describes a long-lived reusable refresh token. The
  # V2 MCP app's refresh response has not been measured for this entry.
  # The adapter stores a replacement if the server supplies one.
  refresh: reusable
  oauth:
    # Each server's operator registers an Asana MCP app and names its
    # settings in ASANA_CLIENT_CONFIG_PATH. Asana offers no dynamic
    # registration for its MCP server: a client must be pre-registered in
    # Asana's developer console, as an app of the MCP app type. A standard
    # API app is a different app, and its sign-ins are not the ones this
    # server takes. See docs/old/asana-setup.md.
    registration: static
    client_settings: ASANA
    # Back to Core's own https callback, as Airtable's and Google's: the
    # server needs GATEWAY_PUBLIC_URL, and nothing listens on people's
    # computers.
    redirect: [core]
    # Asana compares the redirect only at sign-in, and which workspaces the
    # app may reach is set on the app, where Switch cannot look. A person
    # whose workspace the app does not allow is refused at Asana's consent
    # page, with nothing wrong in Switch.
    unchecked: >-
      Switch can't check the redirect URL, or that the app allows your
      workspace. Have someone whose workspace it allows connect once to
      confirm.
    # Disconnecting revokes at the revocation endpoint Asana's authorization
    # server advertises in its metadata (/-/oauth_revoke): the refresh token
    # is deauthorized, and its access tokens with it.
    revocation_discovered: true
  identity:
    # MCP tokens cannot call the REST API. On 2026-11-06, Asana V2's
    # get_user advertised readOnlyHint: true and no required arguments.
    # A live get_user({}) returned nonempty strings at data.gid and data.email.
    # https://developers.asana.com/docs/mcp-tools-reference
    mcp_tool: get_user
    account_id: data.gid
    label: data.email
# Asana's access tokens live 60 minutes (documented, not measured).
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    - { name: asana, url: "https://mcp.asana.com/v2/mcp" }
access:
  # MCP apps have no granular scopes; omitting scope is supported. Consent
  # reaches every available MCP tool within the user's permissions.
  # https://developers.asana.com/docs/mcp-tools-reference
  # https://developers.asana.com/docs/integrating-with-asanas-mcp-server
  unscoped: true
  read: { scopes: [] }
  write: { scopes: [] }
tools: { mode: pass_through }
