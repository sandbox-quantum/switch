slug: clickup
name: ClickUp
category: Project management
description: Read and update ClickUp tasks, lists, and docs, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Note on ClickUp OAuth token lifecycle (verified 2026-11-04):
  # https://mcp.clickup.com/.well-known/oauth-authorization-server advertises
  # grant_types_supported: ["authorization_code"], and ClickUp's OAuth docs
  # (https://developer.clickup.com/docs/authentication) note that access tokens
  # currently do not expire unless revoked. Switch's OAuth loader requires a
  # finite token.max_lifetime and refresh: rotating|reusable for enabled OAuth
  # entries; if ClickUp remains non-expiring without refresh_token support,
  # flip enabled: false to keep ClickUp as a documented placeholder.
  refresh: rotating
  oauth:
    # ClickUp's MCP authorization server advertises RFC 7591 Dynamic Client
    # Registration at https://mcp.clickup.com/oauth/register with PKCE (S256)
    # and token_endpoint_auth_method: "none".
    registration: dynamic
    # ClickUp matches the registered loopback redirect URI (including port).
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    # https://mcp.clickup.com/.well-known/oauth-authorization-server does not
    # advertise a revocation_endpoint; users disconnect in ClickUp settings.
    remove_access: >-
      Disconnect it in ClickUp under Settings → App Center (or Integrations).
  identity:
    # ClickUp REST API v2 authorized user endpoint (resource_server_origin
    # https://api.clickup.com advertised in .well-known/oauth-protected-resource).
    url: https://api.clickup.com/api/v2/user
    account_id: user.id
    label: user.email
# Agents re-request tokens from Core at least hourly (3600s).
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    - { name: clickup, url: "https://mcp.clickup.com/mcp" }
access:
  # Scopes verified from https://mcp.clickup.com/.well-known/oauth-protected-resource
  # and https://mcp.clickup.com/.well-known/oauth-authorization-server:
  # "scopes_supported": ["read", "write"] (covering mcp_server_capabilities:
  # task_management, document_management, chat).
  read:
    scopes:
      - read
  write:
    scopes:
      - read
      - write
tools: { mode: pass_through }
