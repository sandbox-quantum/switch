slug: clickup
name: ClickUp
category: Project management
description: ClickUp tasks, documents and chat. Unavailable because its OAuth tokens do not expire or refresh.
# Accepted disabled outcome for #836, not an enabled OAuth integration:
# https://github.com/sandbox-quantum/switch/issues/836#issuecomment-6650763832
# ClickUp documents non-expiring access tokens:
# https://developer.clickup.com/docs/authentication
# https://developer.clickup.com/docs/faq
# Public MCP discovery checked 2026-11-06 advertises only authorization_code,
# PKCE S256 and scopes [read, write], not task:read/task:write. No refresh grant:
# https://mcp.clickup.com/.well-known/oauth-authorization-server
# https://mcp.clickup.com/.well-known/oauth-protected-resource/mcp
# Do not invent a finite lifetime, declare refresh:none on an oauth adapter,
# substitute an API key, or weaken the loader to enable this entry.
# No skill is shipped: disabled entries must not offer an agent tool surface.
# Evidence and conditions for revisiting: docs/connections/clickup.md.
enabled: false
auth:
  type: oauth
