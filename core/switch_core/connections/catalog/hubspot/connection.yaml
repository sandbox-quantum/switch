slug: hubspot
name: HubSpot
category: CRM
description: Read and update HubSpot contacts, companies and deals, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # HubSpot rotates refresh tokens whenever an access token is renewed.
  refresh: rotating
  oauth:
    # HubSpot requires a manually created MCP Connector. The operator
    # configures it once with Switch Core's callback and stores its client.
    # The account must use HubSpot's new Developer Platform; setup is in
    # docs/official/deploy/hubspot-setup.md.
    registration: static
    client_settings: HUBSPOT
    redirect: [core]
    revocation_discovered: true
  identity:
    # This endpoint returns the HubSpot portal id for the signed-in user
    # without putting a token in the request URL. The response does not
    # guarantee a display-name field, so the portal id is also the label.
    url: https://api.hubapi.com/account-info/v3/details
    account_id: portalId
    label: portalId
# HubSpot access tokens expire after 30 minutes (documented).
token: { kind: pass_through, max_lifetime: 1800 }
mcp:
  servers:
    - { name: hubspot, url: "https://mcp.hubspot.com" }
access:
  # The MCP Connector's install screen offers permissions dynamically. Keep
  # its scopes to identity and the requested CRM objects.
  read:
    scopes:
      - oauth
      - account-info.security.read
      - crm.objects.contacts.read
      - crm.objects.companies.read
      - crm.objects.deals.read
  write:
    scopes:
      - oauth
      - account-info.security.read
      - crm.objects.contacts.read
      - crm.objects.contacts.write
      - crm.objects.companies.read
      - crm.objects.companies.write
      - crm.objects.deals.read
      - crm.objects.deals.write
tools: { mode: pass_through }
