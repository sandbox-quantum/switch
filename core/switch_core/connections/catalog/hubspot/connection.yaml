slug: hubspot
name: HubSpot
category: CRM
description: Read and update HubSpot contacts, companies and deals, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # The issue states, and HubSpot's OAuth docs describe, rotating refresh
  # tokens; not yet measured against a live connector. Confirm at manual QA.
  refresh: rotating
  oauth:
    # HubSpot's MCP server offers no dynamic registration (its metadata has
    # no registration endpoint): the operator creates an "MCP connector" in
    # their HubSpot account (Development, MCP Connectors) and stores its
    # client. Setup: docs/old/hubspot-setup.md.
    registration: static
    client_settings: HUBSPOT
    # HubSpot wants the redirect URL to "match what's configured", with no
    # documented loopback port variance, so Console's ports are pinned, as
    # Atlassian's. Endpoints are discovered from the MCP server's metadata.
    redirect: [loopback, core]
    loopback_ports: [39241, 39242, 39243, 39244, 39245]
    # Switch cannot read the connector back: the operator confirms in
    # HubSpot that its redirect URLs match Switch's exactly, port included.
    # Measured HTTP 400 invalid_request with status BAD_AUTH_CODE even for a wrong secret.
    inconclusive_probe: [{error: invalid_request, body_status: BAD_AUTH_CODE}]
    unchecked: The connector's redirect URLs in HubSpot must match Switch's exactly, port included, or every sign-in fails at consent.
    # No revocation endpoint is advertised and the only documented revoke
    # (a DELETE naming the token in its path) is not one Switch can make.
    remove_access: In HubSpot, open Settings, Integrations, Connected Apps and uninstall Switch. Until you do, the sign-in keeps working.
  identity:
    # Maintainer direction on #830 (petr-sandbox, 2026-11-02 and 2026-11-03):
    # get the identity from get_user_details through identity.mcp_tool, since
    # no REST lookup is known to accept the MCP token, and key the connection
    # by user id plus HubSpot account id, since one person can belong to
    # several accounts. get_user_details is a read-only, no-argument tool
    # HubSpot documents for exactly this; its result carries user and account IDs. The initial catalog
    # assumed hubId, but the live result uses an account-id field. The list form of
    # account_id is the shared implementation of that composite keying. An
    # Live get_user_details returned root integer user/account IDs. The
    # adapter accepts only explicit spellings of those two names and rejects
    # ambiguity; no configured portal or other ID is used as a fallback.
    mcp_tool: get_user_details
    account_id: [userId, accountId]
    label: userId
# HubSpot documents 30-minute OAuth access tokens; whether MCP-issued
# tokens differ is not documented. Verify at manual QA.
token: { kind: pass_through, max_lifetime: 1800 }
mcp:
  servers:
    - { name: hubspot, url: "https://mcp.hubspot.com" }
access:
  # Maintainer direction on #830 (petr-sandbox, 2026-11-02): use
  # access.unscoped. HubSpot's authorization-server metadata lists
  # scopes_supported: [] and its MCP docs say an MCP connector's scopes are
  # not defined explicitly - they follow the server's tools and the
  # permissions granted at install - so there is no vendor scope parameter
  # to send and no vendor-enforced read-only consent. The signed-in user's
  # HubSpot permissions are the real boundary; the skill says read and write
  # stay within them, and read-only via tools.mode: listed may follow.
  unscoped: true
  read: { scopes: [] }
  write: { scopes: [] }
tools: { mode: pass_through }
