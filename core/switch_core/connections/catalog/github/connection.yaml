slug: github
name: GitHub
category: Source control
description: Clone, branch, push and open pull requests in the repository you grant.
enabled: true
publisher: GitHub
links:
  documentation: https://docs.github.com/en/apps/using-github-apps/about-using-github-apps
  support: https://support.github.com
  privacy: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
adapter: github
auth:
  type: oauth
  refresh: rotating
  # In place of the App's sign-in, a person may paste a personal access token
  # of their own. It is checked with GET /user, and refused where GitHub says
  # it has no expiration date (unless ALLOW_NON_EXPIRING_KEYS is on). It
  # reaches what the person let it, acts as them, and only GitHub revokes it.
  paste:
    - name: token
      label: Personal access token
      fields:
        - { name: pat, label: Personal access token, secret: true }
      headers: { Authorization: "Bearer {pat}" }
      expires: vendor
      help_url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
      # GitHub's form for a new fine-grained token, filled in with what the
      # App asks for: code and pull requests, read and write, for 30 days.
      # The person picks the repositories it reaches there.
      create_url: https://github.com/settings/personal-access-tokens/new?name=Switch%20agents&description=Used%20by%20Switch%20agents%20you%20turn%20GitHub%20on%20for&expires_in=30&contents=write&pull_requests=write
token: { kind: minted, max_lifetime: 3600 }
access:
  read:
    permissions: { contents: read, pull_requests: read }
  write:
    permissions: { contents: write, pull_requests: write }
tools:
  mode: listed
  read: []
  write: []
