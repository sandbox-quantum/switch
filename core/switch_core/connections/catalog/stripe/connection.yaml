slug: stripe
name: Stripe
category: Payments
description: Inspect Stripe payments, customers, subscriptions, and disputes with your credentials. Test-mode accounts recommended.
enabled: true
adapter: oauth
auth:
  type: oauth
  refresh: rotating
  oauth:
    registration: dynamic
    redirect: [loopback]
    loopback_ports: [39231, 39232, 39233, 39234, 39235]
    prompt: consent
    revocation_discovered: true
  identity:
    url: https://api.stripe.com/v1/account
    account_id: id
    label: email
# Stripe OAuth access tokens expire after 1 hour (3600 seconds) when issued
# via standard authorization code flow with refresh token rotation.
token:
  kind: pass_through
  max_lifetime: 3600
# Stripe's official remote MCP server at https://mcp.stripe.com handles
# authentication via OAuth and surfaces tools scoped to the connected account.
# Access defaults strictly to read-only: write scopes are omitted to prevent
# unauthorized mutations to live financial records.
mcp:
  servers:
    - name: stripe
      url: "https://mcp.stripe.com"
access:
  read:
    scopes:
      - "mcp"
tools:
  mode: pass_through
