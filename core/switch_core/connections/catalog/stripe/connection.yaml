slug: stripe
name: Stripe
category: Payments
description: Look up Stripe payments, customers and products, as you. Test-mode is recommended.
enabled: true
adapter: oauth
auth:
  # Stripe's MCP OAuth metadata advertises the refresh_token grant; rotation
  # was not measured, so assume it rotates until a live sign-in confirms.
  type: oauth
  refresh: rotating
  oauth:
    # Stripe's hosted MCP server advertises a registration endpoint, so Core
    # registers its own client and discovers the endpoints from the server.
    # From 31 Oct 2026 Stripe's MCP accepts only OAuth or Agent-tagged keys.
    registration: dynamic
    redirect: [loopback, core]
    revocation_discovered: true
  # Stripe's account endpoint names the connected account. NOT yet confirmed
  # that an MCP-issued token is accepted against the REST API; validate before
  # relying on it (the issue asks for a connect/grant/use video).
  identity:
    url: https://api.stripe.com/v1/account
    account_id: id
    label: email
token: { kind: pass_through, max_lifetime: 3600 }
mcp:
  servers:
    - name: stripe
      url: "https://mcp.stripe.com"
access:
  # Stripe's MCP OAuth exposes a single coarse `mcp` scope with no read/write
  # split; what a session can do is governed by the connected Stripe account
  # and its mode, not by scope strings. Payments are sensitive, so this entry
  # offers a single read-level grant and the skill tells the agent to work in
  # test-mode and to make changes only when explicitly asked.
  read:
    scopes:
      - mcp
tools: { mode: pass_through }
