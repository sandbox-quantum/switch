slug: notion
name: Notion
category: Knowledge base
description: Search, read and edit Notion pages, databases and comments, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Each refresh returns a new refresh token.
  refresh: rotating
  oauth:
    # Notion offers no client to configure: Core registers one itself.
    registration: dynamic
    # Notion takes a loopback redirect on any port, so sign-ins come back to
    # Switch Console and the server needs no public address. Its consent
    # screen asks the person to confirm they trust that address first.
    redirect: [loopback]
    # Notion advertises its token endpoint for revocation. Revoking the
    # refresh token ends the access token at once (measured).
    revocation_discovered: true
  identity:
    # A Notion MCP token reaches neither Notion's REST API (/v1/users/me
    # answers 401) nor the MCP server's /userinfo (403). Notion advertises
    # token introspection, whose answer names the workspace and the user. The
    # account is that pair. A person has one Notion connection, so connecting
    # another workspace replaces it, and its grants stop working until the
    # person grants them again. The answer names neither by name, so the
    # connection is labelled with the workspace's id.
    introspection: true
    account_id: [workspace_id, user_id]
    label: workspace_id
# Notion's MCP access tokens live 8 hours (measured), and Notion offers no way
# to ask for a shorter one or to revoke one alone, so an agent's copy may
# outlive its grant by up to that long. Agents still ask again hourly.
token: { kind: pass_through, max_lifetime: 28800 }
mcp:
  servers:
    - { name: notion, url: "https://mcp.notion.com/mcp" }
access:
  # Notion has one scope, default, for everything its MCP server does, and
  # its consent screen picks a workspace, not scopes or pages: a connection
  # reaches whatever the person can reach in that workspace, at their own
  # access level. So every connection is granted the write level.
  read: { scopes: [default] }
  write: { scopes: [default] }
tools: { mode: pass_through }
