slug: notion
name: Notion
category: Knowledge base
description: Search, read and edit Notion pages, databases and comments, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # [DOCUMENTED] Advertises refresh_token in grant_types_supported at https://mcp.notion.com/.well-known/oauth-authorization-server.
  refresh: rotating
  oauth:
    # [DOCUMENTED] registration_endpoint (https://mcp.notion.com/register) advertised in RFC 8414 metadata at https://mcp.notion.com/.well-known/oauth-authorization-server.
    registration: dynamic
    # [DOCUMENTED] RFC 8252 loopback redirection on 127.0.0.1 for native/public desktop clients.
    redirect: [loopback]
    # [DOCUMENTED] revocation_endpoint (https://mcp.notion.com/token) advertised at https://mcp.notion.com/.well-known/oauth-authorization-server.
    revocation_discovered: true
  identity:
    # [DOCUMENTED] RFC 7662 token introspection (POST https://mcp.notion.com/introspect) advertised as introspection_endpoint.
    # Notion MCP tokens are not accepted by REST /v1/users/me (HTTP 401) or /userinfo (HTTP 403).
    introspection: true
    # [DOCUMENTED] Composite identifier combining workspace_id and user_id per maintainer ruling on issue #819.
    account_id: [workspace_id, user_id]
    # [DOCUMENTED] Introspection response returns: active, aud, client_id, exp, iat, iss, scope, sub, token_type, user_id, workspace_id.
    # It contains no human-readable user name, email, or workspace name, so the connection is labelled with workspace_id.
    label: workspace_id
# [DOCUMENTED] Access token lifetime of 28,800 seconds (8 hours) documented in Notion MCP developer guides (https://developers.notion.com/guides/mcp/build-mcp-client).
token: { kind: pass_through, max_lifetime: 28800 }
mcp:
  servers:
    # [DOCUMENTED] Official remote MCP server endpoint.
    - { name: notion, url: "https://mcp.notion.com/mcp" }
access:
  # [DOCUMENTED] Notion advertises only 'default' and 'ema_issuer:manage' scopes (https://mcp.notion.com/.well-known/oauth-authorization-server).
  # Notion's consent authorizes entire workspace access, so there is no distinct read-only level.
  # Following maintainer ruling on issue #819, the entry exposes only the write level rather than a synthetic read level.
  write:
    scopes:
      - default
tools: { mode: pass_through }
