slug: linear
name: Linear
category: Project management
description: Read and update Linear issues and projects, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  refresh: rotating
  oauth:
    # Linear's remote MCP server at mcp.linear.app offers dynamic client
    # registration (RFC 7591) via its discovery document.
    registration: dynamic
    redirect: [loopback]
    revocation_discovered: true
    remove_access: >-
      Remove Switch under your authorized applications in Linear's settings.
  identity:
    method: POST
    url: https://api.linear.app/graphql
    body:
      query: "{ viewer { id email name } }"
    account_id: data.viewer.id
    label: data.viewer.email
# Linear access tokens live 24 hours (86400 s documented at
# https://developers.linear.app/docs/oauth/authentication); refresh tokens rotate on use.
token: { kind: pass_through, max_lifetime: 86400 }
mcp:
  servers:
    - { name: linear, url: "https://mcp.linear.app/mcp" }
access:
  read:
    scopes:
      - read
  write:
    scopes:
      - read
      - write
tools: { mode: pass_through }
