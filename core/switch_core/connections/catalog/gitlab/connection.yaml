slug: gitlab
name: GitLab
category: Source control
description: Read and update GitLab projects, issues, merge requests and pipelines, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  refresh: rotating
  oauth:
    # GitLab supports dynamic client registration for its remote MCP server
    # as documented in GitLab MCP documentation.
    registration: dynamic
    redirect: [loopback, core]
    loopback_ports: [39246, 39247, 39248, 39249, 39250]
    prompt: consent
    revocation_discovered: true
  identity:
    url: https://gitlab.com/api/v4/user
    account_id: id
    label: username
token: { kind: pass_through, max_lifetime: 7200 }
mcp:
  servers:
    - { name: gitlab, url: "https://gitlab.com/api/v4/mcp" }
access:
  read:
    scopes:
      - read_api
      - read_user
      - openid
  write:
    scopes:
      - api
      - read_api
      - read_user
      - openid
tools: { mode: pass_through }
