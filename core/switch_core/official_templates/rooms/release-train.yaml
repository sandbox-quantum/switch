version: 2
params:
  provider:
    type: provider
    label: Provider
    description: Which coding agent provider to use for the AI agents
  machine:
    type: machine
    label: Machine
    description: Which machine to run the agents on
  version:
    type: string
    label: Version
    description: The release version or name (e.g. "v2.4.0", "Q1 Release")
    required: true
  bridge:
    type: bridge
    label: Messaging app
    description: Which messaging app to create the channel on
    required: false
  bypass:
    type: boolean
    label: Go ahead without asking
    description: Let the agents run every command and file change without asking anyone first. Unsafe; off by default, so they ask before anything risky.
    default: false
    input: advanced
resources:
  release_manager:
    type: agent
    display_name: "{version} Release Manager"
    description: Tracks release checklist, compiles changelog, coordinates go/no-go, and drafts release notes
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{release_manager.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [release_room]}
    instructions: |-
      You are the release manager agent for the {version} release. You help the release captain keep the release on track.

      You only receive messages that mention you, so each time you are addressed, first read the room's recent history to catch up on everything posted since you last looked.

      Track the release lifecycle:
      - Maintain the Release Checklist document - update items as they are completed
      - Track which features are confirmed in vs out of this release
      - Log cherry-pick requests: who requested it, what it is, whether it was approved

      Support the release captain:
      - When asked, draft the daily release status update: days until ship, test pass rate, blocking bugs, cherry-picks pending, overall confidence
      - When someone requests a cherry-pick after freeze, summarize the request and its risk for the captain to decide
      - Compile the changelog from merged PRs and feature descriptions

      When approaching go/no-go:
      - Verify every checklist item is checked or explicitly waived
      - Summarize outstanding risks
      - Draft the release notes from the feature list and changelog

      After the release ships:
      - Post the final release notes
      - Summarize the release: what shipped, what was deferred, any incidents during rollout
  qa_coordinator:
    type: agent
    display_name: "{version} QA Coordinator"
    description: Tracks test pass/fail status, flags blocking bugs, and manages the regression suite
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{qa_coordinator.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [release_room]}
    instructions: |-
      You are the QA coordinator for the {version} release. You track testing progress and flag quality risks.

      You only receive messages that mention you, so each time you are addressed, first read the room's recent history to catch up on test results and bugs posted since you last looked.

      Track testing status:
      - Review test suite results as they are posted
      - Categorize failures: known flaky tests vs new failures vs regressions
      - For each new failure, assess whether it is release-blocking based on severity and scope
      - Track which features have been tested and which still need coverage

      Support the release captain:
      - When asked, post the daily test status: pass rate, new failures, blocking bugs, areas not yet tested
      - When a bug is found, help assess: is this a regression from this release or a pre-existing issue?
      - Maintain a list of known issues shipping with this release (accepted risks)

      Before go/no-go:
      - Confirm regression suite is passing
      - Confirm all new features have been tested
      - List any accepted risks (known issues shipping with this release)
      - Flag any areas that could not be tested and why
  release_room:
    type: room
    name: "Release - {version}"
    description: "Release coordination for {version}. Feature tracking, go/no-go, and release notes."
    bridge: "{bridge}"
    agents: [release_manager, qa_coordinator]
    users:
      - {if: "{bridge}", value: ["{$creator}"]}
      - {value: []}
    instructions: |-
      This room coordinates the release of {version}. Everything about this release - what's in, what's out, blockers, cherry-picks, and the go/no-go decision - happens here.

      Process:
      1. Feature freeze: the release captain locks scope and posts the feature list
      2. Testing: QA runs the regression suite and reports results here
      3. Cherry-picks: any post-freeze changes must be approved by the release captain
      4. Go/no-go: the release captain calls the final decision
      5. Ship: release notes are published and the release is cut

      The agents only see messages that mention them by name: mention {release_manager.name} for the checklist, cherry-picks, status and release notes, and {qa_coordinator.name} for test results and bugs.

      If you need something added after feature freeze, post a request here with the business justification. The release captain decides.

      Note for agents: the documents attached to this room are starting layouts that only their creator can edit. The first time you need to update one, create your own room document named after it with " (live)" added (for example "Release Checklist (live)"), starting from its current content, keep that copy up to date, and tell the room you did. If a live copy already exists, use it: update it if you created it, otherwise post the change and ask the agent that created it to apply it.
    roles:
      - name: release-captain
        exclusive: true
        instructions: |-
          You own this release. Your responsibilities:
          - Maintain the feature list and lock scope at feature freeze
          - Approve or reject cherry-pick requests after freeze
          - Track test results and decide if blockers are release-blocking
          - Make the go/no-go call
          - Ensure release notes are complete and accurate
          - Communicate the release timeline to stakeholders

          Post a daily release status:
          - Days until target ship date
          - Test pass rate and blocking bugs
          - Cherry-picks pending review
          - Overall go/no-go confidence (green/yellow/red)
    docs:
      - name: Release Checklist
        description: Steps to complete before shipping
        instructions: Work through this checklist. Every item must be checked before go/no-go.
        content: |-
          # Release Checklist - {version}

          ## Pre-freeze
          - [ ] Feature list finalized and posted
          - [ ] All feature PRs merged to release branch
          - [ ] Feature freeze announced

          ## Testing
          - [ ] Regression suite passing
          - [ ] Performance benchmarks within bounds
          - [ ] Security scan clean
          - [ ] Staging environment smoke test passed

          ## Pre-ship
          - [ ] Release notes drafted
          - [ ] Breaking changes documented
          - [ ] Migration guide written (if applicable)
          - [ ] Rollback plan documented
          - [ ] Go/no-go decision: GO

          ## Ship
          - [ ] Release tagged and built
          - [ ] Deployed to production
          - [ ] Monitoring confirmed stable
          - [ ] Release notes published
          - [ ] Stakeholders notified
    kickoff: "Release room is live for {version}. @{release_manager.name} is tracking the checklist. @{qa_coordinator.name} is monitoring test results. Release captain - post the feature list and target timeline, mentioning both agents so they see it."
