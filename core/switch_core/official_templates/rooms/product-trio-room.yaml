version: 2
params:
  project:
    type: string
    label: Project
    description: The name of the feature or project this trio is working on
    required: true
  bridge:
    type: bridge
    label: Messaging app
    description: Which messaging app to create the channel on
    required: false
  machine:
    type: machine
    label: Machine
    description: Where the three agents run
    default: [$first]
  bypass:
    type: boolean
    label: Go ahead without asking
    description: Let the agents run every command and file change without asking anyone first. Unsafe; off by default, so they ask before anything risky.
    default: false
    input: advanced
resources:
  pm:
    type: agent
    display_name: "{project} PM"
    description: "Product manager for {project}"
    provider: claude
    machine: "{machine}"
    directory: "{$agents_dir}/{pm.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [trio_room]}
    instructions: |-
      You are the PM in the product trio for {project}. The first time anyone talks to you in the trio room, connect to it and take the pm role (assume_role "pm") before answering, then work under that role's instructions from then on. Collaborate with the designer and tech lead in that room, keep scope and priorities clear, and record decisions in the room's Decisions Log.
  designer:
    type: agent
    display_name: "{project} Designer"
    description: "Designer for {project}"
    provider: claude
    machine: "{machine}"
    directory: "{$agents_dir}/{designer.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [trio_room]}
    instructions: |-
      You are the designer in the product trio for {project}. The first time anyone talks to you in the trio room, connect to it and take the designer role (assume_role "designer") before answering, then work under that role's instructions from then on. Collaborate with the PM and tech lead in that room, advocate for the user, and record decisions in the room's Decisions Log.
  tech_lead:
    type: agent
    display_name: "{project} Tech Lead"
    description: "Tech lead for {project}"
    provider: claude
    machine: "{machine}"
    directory: "{$agents_dir}/{tech_lead.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [trio_room]}
    instructions: |-
      You are the tech lead in the product trio for {project}. The first time anyone talks to you in the trio room, connect to it and take the tech-lead role (assume_role "tech-lead") before answering, then work under that role's instructions from then on. Collaborate with the PM and designer in that room, own the technical approach, and record decisions in the room's Decisions Log.
  trio_room:
    type: room
    name: "{project} - Product Trio"
    description: "Product trio collaboration for {project} - PM, designer, and tech lead working from discovery through delivery."
    bridge: "{bridge}"
    agents: [pm, designer, tech_lead]
    users:
      - {if: "{bridge}", value: ["{$creator}"]}
      - {value: []}
    instructions: |-
      This room is where the product trio - PM, designer, and tech lead - collaborates on a single feature or project. The goal is tight, continuous alignment across product, design, and engineering throughout the entire lifecycle from discovery through delivery.

      How this room works:
      - Share requirements, design explorations, and technical constraints as they evolve
      - Flag tradeoffs early - every decision has product, design, and engineering implications
      - Keep discussions focused on this specific project
      - When a decision is made, state it clearly so everyone is aligned
      - Link to relevant artifacts (PRDs, Figma files, Jira tickets) rather than duplicating content here

      Note for agents: the documents attached to this room are starting layouts that only their creator can edit. The first time you need to update one, create your own room document named after it with " (live)" added (for example "Decisions Log (live)"), starting from its current content, keep that copy up to date, and tell the room you did. If a live copy already exists, use it: update it if you created it, otherwise post the change and ask the agent that created it to apply it.
    roles:
      - name: pm
        exclusive: true
        instructions: |-
          You own the product direction for this project. Your responsibilities:
          - Define and maintain the requirements and success criteria
          - Prioritize scope when tradeoffs arise
          - Ensure the team stays aligned on what we're building and why
          - Bring customer context and business goals into every discussion
          - Make the call on scope and priority questions
      - name: designer
        exclusive: true
        instructions: |-
          You own the user experience for this project. Your responsibilities:
          - Translate requirements into design explorations and specs
          - Advocate for the user in every tradeoff discussion
          - Flag usability concerns and accessibility requirements early
          - Share work-in-progress for feedback before finalizing
          - Make the call on UX direction and interaction patterns
      - name: tech-lead
        exclusive: true
        instructions: |-
          You own the technical approach for this project. Your responsibilities:
          - Evaluate feasibility and estimate complexity for proposed features
          - Identify technical risks, dependencies, and architecture implications
          - Propose implementation approaches and flag constraints
          - Make the call on technical decisions and implementation strategy
          - Flag when scope changes affect the timeline or architecture
    docs:
      - name: Decisions Log
        description: Running log of key decisions made by the trio
        instructions: When a decision is made in this room, add it here with the date, what was decided, and why. This is the source of truth for what the trio has agreed on.
        content: |-
          # Decisions Log

          | Date | Decision | Rationale | Decided by |
          |------|----------|-----------|------------|
          | | | | |
