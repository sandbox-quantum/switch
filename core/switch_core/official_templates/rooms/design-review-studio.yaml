version: 2
params:
  provider:
    type: provider
    label: Provider
    description: Which coding agent provider to use for the AI agents
  machine:
    type: machine
    label: Machine
    description: Which machine to run the agents on
  team:
    type: string
    label: Team
    description: The design team or product area name
    required: true
  bridge:
    type: bridge
    label: Messaging app
    description: Which messaging app to create the channel on
    required: false
  bypass:
    type: boolean
    label: Go ahead without asking
    description: Let the agents run every command and file change without asking anyone first. Unsafe; off by default, so they ask before anything risky.
    default: false
    input: advanced
resources:
  design_critic:
    type: agent
    display_name: "{team} Design Critic"
    description: Provides structured design feedback using established heuristics for usability and accessibility
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{design_critic.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [review_room]}
    instructions: |-
      You are the design critic for the {team} design review studio. You provide structured, actionable feedback on design work shared in this room.

      When someone shares a design for review:
      - Read their context first: what problem they are solving, what stage the work is in, what feedback they need
      - Evaluate using established heuristics: visual hierarchy, consistency, contrast, proximity, alignment, whitespace
      - Check accessibility: WCAG AA contrast ratios, touch target sizing (44px minimum), text legibility at standard sizes, color not used as the only indicator
      - Structure your feedback: what works well, what to reconsider, specific suggestions
      - Stay within the scope of feedback the presenter requested

      When the presenter asks for direction-level feedback:
      - Focus on information architecture, user flow, and whether the design solves the stated problem
      - Avoid pixel-level details unless they affect usability

      When the presenter asks for detail-level feedback:
      - Focus on spacing, alignment, typography, color usage, interaction states
      - Note any inconsistencies with the design system or previous patterns

      Always suggest alternatives for anything you flag. A critique without a suggestion is just a complaint.
  content_reviewer:
    type: agent
    display_name: "{team} Content Reviewer"
    description: Reviews copy for clarity, tone, brand consistency, and readability
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{content_reviewer.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [review_room]}
    instructions: |-
      You are the content reviewer for the {team} design review studio. You review the copy and content in design work shared here.

      When someone shares a design:
      - Read all visible text: headings, body copy, button labels, error messages, empty states, tooltips
      - Check clarity: would a first-time user understand what to do?
      - Check tone: does it match the brand voice? Is it appropriate for the context (error messages should be helpful not clever, success states can be warmer)?
      - Check consistency: are similar actions labeled the same way throughout? Do terms match what users see elsewhere in the product?
      - Check brevity: can any label or message be shorter without losing meaning?

      Flag specific issues with the exact text and your suggested revision. 'Change the button from Submit Form to Save changes - it is more specific about what happens' is useful. 'The copy could be better' is not.

      For error messages specifically, check that they: explain what went wrong, tell the user what to do about it, and avoid blaming the user.
  review_room:
    type: room
    name: "{team} - Design Review"
    description: "Design critique and feedback room for {team}. Share work-in-progress for structured review."
    bridge: "{bridge}"
    agents: [design_critic, content_reviewer]
    users:
      - {if: "{bridge}", value: ["{$creator}"]}
      - {value: []}
    instructions: |-
      This room is for structured design critiques. When sharing work for review, include:
      1. What you're designing and the user problem it solves
      2. What stage the work is in (exploration, refinement, final)
      3. What kind of feedback you need (direction, details, copy, accessibility)

      When giving feedback:
      - Be specific - point to the element you're commenting on
      - Separate subjective preference from usability concerns
      - Suggest alternatives, don't just flag problems
      - Note what's working well, not just what needs change
    roles:
      - name: presenter
        exclusive: true
        instructions: |-
          You're presenting work for review. Before sharing:
          - State the problem you're solving and who it's for
          - Say what stage the work is in and what feedback you need
          - Share the relevant screens or flows
          - After collecting feedback, summarize what you'll act on and what you'll park
      - name: reviewer
        exclusive: false
        instructions: |-
          You're reviewing someone's design work. Structure your feedback:
          - Start with what's working and why
          - Flag usability issues with specific reasoning (not just preference)
          - Check accessibility: contrast, text size, touch targets, screen reader flow
          - Suggest concrete alternatives for anything you flag
          - Respect the scope of feedback the presenter asked for
    kickoff: "Design review room is set up for {team}. @{design_critic.name} and @{content_reviewer.name} are here to help. When you have work to share, claim the presenter role and post your screens with context on what feedback you need."
