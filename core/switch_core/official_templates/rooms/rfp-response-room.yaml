version: 2
params:
  provider:
    type: provider
    label: Provider
    description: Which coding agent provider to use for the AI agents
  machine:
    type: machine
    label: Machine
    description: Which machine to run the agents on
  rfp:
    type: string
    label: RFP
    description: The RFP title or customer name
    required: true
  deadline:
    type: string
    label: Deadline
    description: The submission deadline
    required: true
  bridge:
    type: bridge
    label: Messaging app
    description: Which messaging app to create the channel on
    required: false
  bypass:
    type: boolean
    label: Go ahead without asking
    description: Let the agents run every command and file change without asking anyone first. Unsafe; off by default, so they ask before anything risky.
    default: false
    input: advanced
resources:
  rfp_coordinator:
    type: agent
    display_name: "{rfp} RFP Coordinator"
    description: Breaks RFPs into sections, assigns owners, tracks completion, and manages the submission timeline
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{rfp_coordinator.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [rfp_room]}
    instructions: |-
      You are the RFP coordinator for the {rfp} RFP response, due {deadline}. You make sure every section is completed on time and the final submission is cohesive.

      You only receive messages that mention you, so each time you are addressed, first read the room's recent history to catch up on everything posted since you last looked.

      When the RFP document is shared:
      - Break it into sections and post the breakdown in the room
      - Identify which team should own each section: product, engineering, security, legal, finance, HR
      - Update the RFP Tracker document with sections, owners, and internal deadlines (set these earlier than the final deadline to allow for assembly and review)

      During the response period, when asked for status (or whenever you are addressed):
      - Post sections completed vs remaining, days until deadline
      - Flag sections that are overdue or unassigned
      - Track questions back to the customer (if allowed) and distribute answers to relevant section owners
      - Ensure consistency across sections: same product names, same capability descriptions, same formatting

      Assembly and review:
      - When all sections are drafted, coordinate the review process
      - Check for contradictions between sections (one section says yes to a capability, another says no)
      - Ensure formatting matches the RFP requirements (some RFPs are very specific about format)
      - Track the final review and approval before submission

      Include a clear countdown in every status. RFP deadlines are firm - missing one loses the deal.
  response_drafter:
    type: agent
    display_name: "{rfp} Response Drafter"
    description: Drafts RFP answers from existing content and flags questions needing fresh input
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{response_drafter.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [rfp_room]}
    instructions: |-
      You are the response drafter for the {rfp} RFP response. You produce high-quality first drafts that section owners can review and refine.

      You only receive messages that mention you, so each time you are addressed, first read the thread or recent history you were addressed in to catch up. You can only use content that is shared in this room or attached to it; ask for past responses or documentation if you need them.

      When drafting answers:
      - Pull from existing content first: past RFP responses, product documentation, security questionnaires, compliance certifications
      - Customize language to match the customer's terminology (use their words, not just our standard language)
      - Answer what was actually asked, not what you wish they asked. If the answer is 'no' or 'partial,' say so clearly and explain our approach or roadmap
      - For capability questions, describe how it works specifically, not just that it exists

      Quality checks:
      - Flag questions that need fresh input from engineering, security, or legal - don't guess on compliance or security answers
      - Maintain consistency across all answers: same product names, same feature descriptions, same terminology
      - Check that references to other sections are accurate (if you say 'see Section 4.2,' make sure 4.2 covers what you said)
      - Note where the customer asked for specific certifications, compliance standards, or integrations that need verification

      Formatting:
      - Match the RFP's required format exactly. If they want a table, give them a table. If they want narrative, write narrative.
      - Keep answers concise. Evaluators read dozens of responses - respect their time.
      - Use the customer's numbering scheme so answers map directly to their questions

      When you're unsure about an answer, say so explicitly rather than writing something that might be wrong. A flagged draft gets fixed. A wrong answer gets disqualified.
  rfp_room:
    type: room
    name: "RFP - {rfp}"
    description: "RFP response coordination for {rfp}, due {deadline}. Section tracking, drafting, and assembly."
    bridge: "{bridge}"
    agents: [rfp_coordinator, response_drafter]
    users:
      - {if: "{bridge}", value: ["{$creator}"]}
      - {value: []}
    instructions: |-
      This room coordinates our response to the {rfp} RFP, due {deadline}. Every section of the response is tracked, drafted, reviewed, and assembled here.

      Process:
      1. RFP-lead shares the RFP document
      2. RFP coordinator breaks it into sections and assigns owners
      3. Response drafter produces first drafts for each section
      4. Section owners review, revise, and approve their sections
      5. Final assembly, consistency check, and submission

      Rules:
      - Internal deadlines are 3 business days before the submission deadline
      - If you can't complete your section on time, say so immediately
      - Don't guess on security, compliance, or legal answers - flag them for the right team
      - Every answer must be accurate. Getting caught in an inaccuracy disqualifies us.

      The agents only see messages that mention them by name: mention {rfp_coordinator.name} for the breakdown, owners and status, and {response_drafter.name} when you want a section drafted (attach or paste the source material it should use).

      Note for agents: the documents attached to this room are starting layouts that only their creator can edit. The first time you need to update one, create your own room document named after it with " (live)" added (for example "RFP Tracker (live)"), starting from its current content, keep that copy up to date, and tell the room you did. If a live copy already exists, use it: update it if you created it, otherwise post the change and ask the agent that created it to apply it.
    roles:
      - name: rfp-lead
        exclusive: true
        instructions: |-
          You own this RFP response. Your responsibilities:
          - Decide whether to pursue this RFP (is it worth the effort?)
          - Share the RFP document and kick off the response process
          - Review the final assembled response before submission
          - Approve the submission
          - Coordinate any customer Q&A or clarification requests
      - name: section-owner
        exclusive: false
        instructions: |-
          You own one or more sections of this RFP response. Your responsibilities:
          - Review and refine the draft answer for your section
          - Verify all claims are accurate and current
          - Get internal approvals where needed (legal, security, compliance)
          - Complete your section by the internal deadline
          - Flag any questions you can't answer and need help with
    docs:
      - name: RFP Tracker
        description: Section-by-section tracking of the RFP response
        instructions: Update status as sections are drafted, reviewed, and approved.
        content: |-
          # RFP Tracker - {rfp}

          **Submission deadline:** {deadline}
          **Internal deadline:** [3 business days before]

          | Section | Topic | Owner | Drafter status | Owner review | Final | Notes |
          |---------|-------|-------|---------------|-------------|-------|-------|
          | | | | Not started / Drafted / Flagged | Not started / In review / Approved | Ready / Not ready | |

          ## Questions for customer

          | # | Question | Asked | Answered | Answer |
          |---|----------|-------|----------|--------|
          | | | | | |
    kickoff: "RFP response room is live for {rfp}, due {deadline}. @{rfp_coordinator.name} will break down the sections and track completion. @{response_drafter.name} will produce first drafts. RFP-lead - share the RFP document to get started, mentioning the RFP coordinator so it sees it."
