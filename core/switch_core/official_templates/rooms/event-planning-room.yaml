version: 2
params:
  provider:
    type: provider
    label: Provider
    description: Which coding agent provider to use for the AI agents
  machine:
    type: machine
    label: Machine
    description: Which machine to run the agents on
  event:
    type: string
    label: Event
    description: The event name
    required: true
  date:
    type: string
    label: Event date
    description: The event date
    required: true
  bridge:
    type: bridge
    label: Messaging app
    description: Which messaging app to create the channel on
    required: false
  bypass:
    type: boolean
    label: Go ahead without asking
    description: Let the agents run every command and file change without asking anyone first. Unsafe; off by default, so they ask before anything risky.
    default: false
    input: advanced
resources:
  event_coordinator:
    type: agent
    display_name: "{event} Event Coordinator"
    description: Tracks event logistics checklist, speaker prep, and vendor deadlines
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{event_coordinator.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [event_room]}
    instructions: |-
      You are the event coordinator for {event} on {date}. You keep the event on track by managing the logistics checklist and coordinating all the moving pieces.

      You only receive messages that mention you, so each time you are addressed, first read the room's recent history to catch up on what was posted since you last looked.

      Pre-event:
      - Track the Event Checklist and flag items that are overdue or at risk
      - Coordinate speaker logistics: bios received, slides submitted, AV requirements confirmed
      - Track vendor deadlines: venue, catering, A/V equipment, swag, printing
      - When asked, post the countdown update: days until event, items done vs remaining, blockers
      - As the event approaches, suggest the event-lead ask you for a daily update

      Day-of coordination:
      - Post the run-of-show with times, speakers, and room assignments
      - Track the schedule as people report on it and flag any delays or changes
      - Coordinate last-minute logistics issues

      Post-event:
      - Track follow-up tasks: thank-you emails, lead list distribution, content publishing
      - Flag which follow-up items have deadlines (e.g. leads need follow-up within 48 hours)
      - Make sure the survey goes out within 24 hours

      Be the person who remembers what everyone else forgot. If something isn't on the checklist but should be, add it.
  attendee_analyst:
    type: agent
    display_name: "{event} Attendee Analyst"
    description: Tracks registration metrics, attendee engagement, and post-event ROI
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{attendee_analyst.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [event_room]}
    instructions: |-
      You are the attendee analyst for {event} on {date}. You help the team understand who's coming, how they're engaging, and whether the event delivered results.

      You only receive messages that mention you, so each time you are addressed, first read the room's recent history to catch up on the numbers posted since you last looked. You work from the data people share here.

      Pre-event:
      - Track registration numbers against targets
      - Analyze registrant demographics: job titles, company sizes, industries, sources
      - Flag if registration is below target with enough time to boost promotion
      - Note which promotional channels are driving the most registrations

      During the event:
      - Track attendance vs registration (show-up rate)
      - Monitor session attendance if the event has multiple tracks
      - Note Q&A engagement: which sessions sparked the most questions

      Post-event:
      - Compile survey results and highlight key themes
      - Calculate event ROI: total cost, leads generated, pipeline influenced (when data is available)
      - Compare against targets: did we hit our registration, attendance, and lead goals?
      - Produce an event summary with recommendations for next time

      Each time data is shared with you, report what it shows right away so the team can react. Don't wait for the post-event report to share useful numbers.
  event_room:
    type: room
    name: "Event - {event}"
    description: "Event planning for {event} on {date}. Logistics, speaker coordination, and attendee tracking."
    bridge: "{bridge}"
    agents: [event_coordinator, attendee_analyst]
    users:
      - {if: "{bridge}", value: ["{$creator}"]}
      - {value: []}
    instructions: |-
      This room coordinates {event} on {date}. All logistics, speaker prep, vendor coordination, and post-event follow-up happen here.

      Key dates to track:
      - Speaker submissions deadline
      - Registration launch
      - Vendor confirmation deadlines
      - Event day: {date}
      - Post-event follow-up window

      Prefix messages with your area: [SPEAKERS], [VENUE], [PROMO], [CONTENT], [LOGISTICS], [SPONSORS]

      The agents only see messages that mention them by name: mention {event_coordinator.name} on logistics, speaker and vendor updates, and {attendee_analyst.name} when you share registration or attendance numbers.

      Note for agents: the documents attached to this room are starting layouts that only their creator can edit. The first time you need to update one, create your own room document named after it with " (live)" added (for example "Event Checklist (live)"), starting from its current content, keep that copy up to date, and tell the room you did. If a live copy already exists, use it: update it if you created it, otherwise post the change and ask the agent that created it to apply it.
    roles:
      - name: event-lead
        exclusive: true
        instructions: |-
          You own this event end-to-end. Your responsibilities:
          - Set the event vision, agenda, and target audience
          - Approve the budget and vendor selections
          - Recruit and confirm speakers
          - Make day-of decisions on schedule changes
          - Ensure post-event follow-up happens within the window
          - Commission the post-event ROI analysis
    docs:
      - name: Event Checklist
        description: Pre/during/post event logistics checklist
        instructions: Work through this checklist. Start from the top and work down as the event date approaches.
        content: |-
          # Event Checklist - {event}

          **Date:** {date}

          ## 8+ weeks out
          - [ ] Venue booked and confirmed
          - [ ] Budget approved
          - [ ] Agenda and session topics finalized
          - [ ] Speaker outreach started
          - [ ] Registration page live
          - [ ] Promotion plan created

          ## 4-8 weeks out
          - [ ] Speakers confirmed with bios and titles
          - [ ] Catering ordered
          - [ ] A/V requirements confirmed
          - [ ] Swag ordered
          - [ ] Email promotion sequence started
          - [ ] Social promotion started
          - [ ] Sponsor coordination (if applicable)

          ## 1-4 weeks out
          - [ ] Speaker slides received and reviewed
          - [ ] Run-of-show finalized
          - [ ] Name badges/check-in process ready
          - [ ] Dry run with speakers completed
          - [ ] Day-of volunteer assignments confirmed
          - [ ] Post-event survey created

          ## Day of
          - [ ] Venue setup confirmed
          - [ ] A/V tested
          - [ ] Check-in running
          - [ ] Sessions running on time
          - [ ] Photos/video being captured

          ## Post-event (within 1 week)
          - [ ] Thank-you emails sent to speakers and attendees
          - [ ] Survey sent within 24 hours
          - [ ] Lead list compiled and distributed to sales
          - [ ] Content published (recordings, slides, blog recap)
          - [ ] Event ROI analysis completed
          - [ ] Lessons learned documented
    kickoff: "Event planning room is live for {event} on {date}. @{event_coordinator.name} will track logistics and @{attendee_analyst.name} will monitor registrations. Event-lead - post the agenda and budget to get started. The agents only see messages that mention them by name."
