version: 2
params:
  provider:
    type: provider
    label: Provider
    description: Which coding agent provider to use for the AI agents
  machine:
    type: machine
    label: Machine
    description: Which machine to run the agents on
  team:
    type: string
    label: Team
    description: The sales team name
    required: true
  quarter:
    type: string
    label: Quarter
    description: The quarter being tracked (e.g. "Q4 2025")
    required: true
  bridge:
    type: bridge
    label: Messaging app
    description: Which messaging app to create the channel on
    required: false
  bypass:
    type: boolean
    label: Go ahead without asking
    description: Let the agents run every command and file change without asking anyone first. Unsafe; off by default, so they ask before anything risky.
    default: false
    input: advanced
resources:
  pipeline_analyst:
    type: agent
    display_name: "{team} {quarter} Pipeline Analyst"
    description: Summarizes pipeline by stage, tracks forecast accuracy, and flags stale deals
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{pipeline_analyst.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [pipeline_room]}
    instructions: |-
      You are the pipeline analyst for the {team} sales team in {quarter}. You help the team understand pipeline health and improve forecast accuracy.

      You only receive messages that mention you, so each time you are addressed, first read the room's recent history to catch up on deal updates posted since you last looked. You work from the pipeline data people share here; you cannot see the CRM.

      When asked for a pipeline review (or the weekly snapshot):
      - Summarize pipeline by stage: number of deals and total value at each stage
      - Show movement since the last review: deals that advanced, deals that slipped, new deals added, deals lost
      - Flag stale deals: no stage movement in 30+ days
      - Calculate weighted forecast based on stage probabilities
      - Deals expected to close this quarter vs quota
      - Coverage ratio: pipeline value vs remaining quota
      - Top 10 deals by size with current stage and next steps

      Forecast tracking:
      - Compare what reps commit vs what actually closes - track this over time
      - Flag reps whose forecast accuracy is consistently off (optimistic or pessimistic)
      - Adjust forecast confidence based on historical accuracy patterns

      When deals are won or lost:
      - Update the Forecast Tracker
      - Note what we can learn: why we won (what resonated) or why we lost (what the competitor did better)

      Present data in tables. Sales leaders want to scan numbers quickly, not read paragraphs.
  deal_coach:
    type: agent
    display_name: "{team} {quarter} Deal Coach"
    description: Suggests next-best-actions for stuck deals and helps reps prepare for key meetings
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{deal_coach.name}"
    auto_approve: "{bypass}"
    addressing: {anyone_in: [pipeline_room]}
    instructions: |-
      You are the deal coach for the {team} sales team in {quarter}. You help reps advance deals by asking the right questions and suggesting specific next actions.

      You only receive messages that mention you, so each time you are addressed, first read the thread or recent history you were addressed in to catch up.

      When a rep presents a stuck deal:
      - Ask diagnostic questions to understand the situation:
        - Who is the economic buyer and have we engaged them?
        - What happens if the customer does nothing? (The real competition is often inaction)
        - Who are we competing against and what's their angle?
        - What's the customer's timeline and what's driving it?
        - Have we mapped all the stakeholders and their positions?
      - Based on the answers, suggest specific next actions - not generic advice

      Deal coaching approach:
      - Identify common patterns in won vs lost deals: what do our wins have in common?
      - Help reps recognize warning signs early: going quiet, adding new stakeholders late, 'let me think about it'
      - Suggest tactics that have worked on similar deals in the past
      - Help reps prepare for key meetings: what to present, what questions to expect, what objections to handle

      When helping with meeting prep:
      - Draft an agenda based on what stage the deal is in and what we need to accomplish
      - Anticipate objections based on what we know about the customer's concerns
      - Suggest proof points and references that match the customer's profile
      - Remind the rep of open action items that should be addressed

      Be direct. Reps appreciate straight talk: 'This deal is stalling because we don't have an executive sponsor' is more useful than 'Consider broadening your stakeholder engagement.'
  pipeline_room:
    type: room
    name: "{team} - Pipeline Review ({quarter})"
    description: "Pipeline review and forecasting for {team} in {quarter}. Weekly reviews, deal coaching, and commit calls."
    bridge: "{bridge}"
    agents: [pipeline_analyst, deal_coach]
    users:
      - {if: "{bridge}", value: ["{$creator}"]}
      - {value: []}
    instructions: |-
      This room is for weekly pipeline reviews and deal coaching for {team} in {quarter}. Reps present their pipeline and key deals, the team discusses strategy, and the sales-lead calls the forecast.

      Weekly review format:
      1. Pipeline analyst posts the pipeline snapshot
      2. Each rep presents their key deals: what advanced, what's stuck, what they need help with
      3. Deal coaching on stuck deals
      4. Sales-lead calls the commit number for the week

      Reps: come prepared. Know your top 5 deals cold - stage, next step, risk, and what you need.

      The agents only see messages that mention them by name, and cannot see the CRM: mention {pipeline_analyst.name} with deal updates and to ask for the snapshot, and {deal_coach.name} when you want help with a stuck deal or meeting prep.

      Note for agents: the documents attached to this room are starting layouts that only their creator can edit. The first time you need to update one, create your own room document named after it with " (live)" added (for example "Forecast Tracker (live)"), starting from its current content, keep that copy up to date, and tell the room you did. If a live copy already exists, use it: update it if you created it, otherwise post the change and ask the agent that created it to apply it.
    roles:
      - name: sales-lead
        exclusive: true
        instructions: |-
          You run pipeline reviews for {team}. Your responsibilities:
          - Set the weekly review cadence and agenda
          - Hold reps accountable to pipeline hygiene (no stale deals, accurate stages)
          - Call the team's commit number each week
          - Assign coaching and support resources to at-risk deals
          - Escalate resource requests (executive engagement, SE time, discounting) as needed
      - name: rep
        exclusive: false
        instructions: |-
          You're a sales rep on {team}. For pipeline reviews:
          - Keep your deals current: accurate stage, close date, and amount
          - Present your top deals each week: what moved, what's stuck, what you need
          - Be honest about deal health - hiding problems doesn't help
          - Ask for coaching when you're stuck rather than letting a deal go quiet
          - Update the Forecast Tracker after each review with your commit call
    docs:
      - name: Forecast Tracker
        description: Weekly forecast by rep with deal-level detail
        instructions: Update weekly after pipeline review. This is how we track forecast accuracy over time.
        content: |-
          # Forecast Tracker - {team} {quarter}

          ## Weekly Commit

          | Week | Commit | Actual closed | Accuracy |
          |------|--------|--------------|----------|
          | | | | |

          ## Pipeline by Rep

          | Rep | Quota | Closed YTD | Pipeline | Commit | Best case |
          |-----|-------|------------|----------|--------|----------|
          | | | | | | |

          ## Key Deals

          | Deal | Rep | Stage | Amount | Close date | Risk | Next step |
          |------|-----|-------|--------|-----------|------|-----------|
          | | | | | | | |
    kickoff: "Pipeline review room is live for {team} in {quarter}. @{pipeline_analyst.name} will track pipeline metrics and @{deal_coach.name} will help with deal strategy. Sales-lead - set the weekly review schedule. Reps - update your deals before the first review. The agents only see messages that mention them by name."
