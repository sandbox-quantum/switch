[project]
name = "switch-core"
version = "0.5.0"
description = "Switch — AI agent orchestration and governance platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SandboxAQ" },
]
keywords = ["ai", "agents", "orchestration", "governance", "matrix", "mcp"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.29,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2.0,<3.0",
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "matrix-nio>=0.25,<0.26",
    "httpx>=0.28,<1",
    "Markdown>=3,<4",
    "slack-sdk>=3.41.0",
    "mattermostdriver>=7.3.2",
    "aiohttp>=3.10,<4",
    "cryptography>=43,<47",
    "fastmcp>=3.2.0,<4",
    "bcrypt>=4.0,<5",
    "PyJWT>=2.9,<3",
    "authlib>=1.3,<2",
    "itsdangerous>=2.1,<3",
    "PyYAML>=6,<7",
]

# Repo coordinates point at the public switch repo — see RELEASING.md.
[project.urls]
Homepage = "https://github.com/sandbox-quantum/switch"
Repository = "https://github.com/sandbox-quantum/switch"
Issues = "https://github.com/sandbox-quantum/switch/issues"

[project.scripts]
switch-core = "switch_core.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switch_core"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.5",
    "ruff>=0.15",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.14.2",
]

[tool.ruff]
target-version = "py312"
exclude = ["dependencies/"]
# pyproject lives in core/ (this dir); the package is right here, so `.`
# is the import source root for isort first-party grouping.
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["switch_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: boots real Postgres + Tuwunel via testcontainers (slow; excluded from the default run — use `just test-integration`)",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["dependencies/"]
plugins = ["pydantic.mypy"]
